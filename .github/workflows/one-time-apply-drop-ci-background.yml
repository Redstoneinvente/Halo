name: One-time Apply Drop CI Background

on:
  push:
    paths:
      - 'Scripts/one_time_apply_drop_ci_background.py'
      - '.github/workflows/one-time-apply-drop-ci-background.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply runtime background patch
        run: python3 Scripts/one_time_apply_drop_ci_background.py

      - name: Validate Swift syntax
        run: xcrun swiftc -parse Halo/NotchEngine/DisplayClock.swift

      - name: Validate diff
        run: git diff --check

      - name: Commit source and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/NotchEngine/DisplayClock.swift
          git rm Scripts/one_time_apply_drop_ci_background.py
          git rm .github/workflows/one-time-apply-drop-ci-background.yml
          git commit -m 'Apply customizable background to live Drop CI'
          git push origin HEAD:main
