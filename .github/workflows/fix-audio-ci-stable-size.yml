name: Fix Audio CI Stable Size

on:
  push:
    branches: [main]
    paths:
      - '.github/audio-ci-stable-size-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stable Audio CI sizing
        run: python3 .github/scripts/fix_audio_ci_stable_size.py

      - name: Verify sizing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Halo/Views/SurfaceView.swift').read_text()
          required = [
            'let scrubHeight = 30.0',
            'private var metadataReservedHeight: Double',
            'let metadataHeight = metadataReservedHeight',
            '.onChange(of: surfaceState.contextPreferredSize) { requested in',
            'if !contextMusicActive { state.contextPreferredSize = nil }',
            'if activeContext != nil && !contextMusicActive { state.contextPreferredSize = nil }'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing Audio CI geometry-stability markers: {missing}')
          if 'let metadataHeight = (options.showTitle ? options.fontSize * 1.35 : 0)' in text:
              raise SystemExit('Old one-line metadata height estimate still present')
          if '.onChange(of: playbackDuration) { _ in publishPreferredSize() }' in text:
              raise SystemExit('Duration is still driving Audio CI sizing publication')
          print('Audio CI geometry ownership contract passed')
          PY

      - name: Parse SurfaceView
        run: xcrun swiftc -parse Halo/Views/SurfaceView.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-audio-ci-size-build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking whether SurfaceView introduced compiler errors.'
            grep -E 'SurfaceView\.swift:.*error:' /tmp/halo-audio-ci-size-build.log && exit 1 || true
            echo 'Build failed only on unrelated baseline errors; SurfaceView emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit stable Audio CI sizing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/SurfaceView.swift
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Lock Audio CI geometry to music content'
          git push origin HEAD:main
