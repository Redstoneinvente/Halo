name: Fix Audio CI Stable Size

on:
  push:
    branches: [main]
    paths:
      - '.github/audio-ci-stable-size-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stable Audio CI sizing
        run: python3 .github/scripts/fix_audio_ci_stable_size.py

      - name: Verify sizing contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Halo/Views/SurfaceView.swift').read_text()
          required = [
            'let scrubHeight = 30.0',
            'Reserve the progress-row footprint even while duration is temporarily unavailable.',
            '.task(id: sizingKey) { publishPreferredSize() }'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Missing stable Audio CI sizing markers: {missing}')
          if 'let scrubHeight = playbackDuration > 0.5 ? 30.0 : 0' in text:
              raise SystemExit('Duration-dependent Audio CI preferred size still present')
          print('Audio CI stable sizing contract passed')
          PY

      - name: Parse SurfaceView
        run: xcrun swiftc -parse Halo/Views/SurfaceView.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-audio-ci-size-build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking whether SurfaceView introduced compiler errors.'
            grep -E 'SurfaceView\.swift:.*error:' /tmp/halo-audio-ci-size-build.log && exit 1 || true
            echo 'Build failed only on unrelated baseline errors; SurfaceView emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit stable Audio CI sizing
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/SurfaceView.swift
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Stabilize Audio CI size across metadata refreshes'
          git push origin HEAD:main
