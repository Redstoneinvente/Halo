name: Fix System Audio Stale Playback

on:
  push:
    branches: [main]
    paths:
      - '.github/system-audio-stale-playback-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply stale playback fix
        run: python3 .github/scripts/fix_system_audio_stale_playback.py

      - name: Verify playback freshness contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Halo/Core/WorkspaceStore.swift').read_text()
          required = [
              'if audibleNow { self.lastHeard = now }',
              'let remotePlaybackFresh = snapshot.playing && now.timeIntervalSince(snapshot.sampledAt) < 1.0',
              'let shouldPresentPlaying = remotePlaybackFresh || audibleNow || (self.ownsFallback && withinReleaseWindow)'
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing expected token: {token}')
          if 'if audibleNow || snapshot.playing { self.lastHeard = now }' in text:
              raise SystemExit('Stale snapshot can still refresh lastHeard')
          print('System Audio stale-playback contract passed')
          PY

      - name: Parse affected Swift file
        run: xcrun swiftc -parse Halo/Core/WorkspaceStore.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-stale-playback.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking WorkspaceStore.swift for compiler errors.'
            if grep -E 'WorkspaceStore\.swift:.*error:' /tmp/halo-stale-playback.log; then
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors; WorkspaceStore.swift emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceStore.swift
          git rm -f .github/scripts/fix_system_audio_stale_playback.py .github/workflows/fix-system-audio-stale-playback.yml .github/system-audio-stale-playback-trigger.txt
          git commit -m 'Stop stale MediaRemote state extending Audio CI'
          git pull --rebase origin main
          git push origin HEAD:main
