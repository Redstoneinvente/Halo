name: Vendor MediaRemote Adapter

on:
  push:
    branches: [main]
    paths:
      - '.github/vendor-mediaremote-trigger.txt'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vendor pinned MediaRemoteAdapter source
        run: |
          set -euo pipefail
          REV=5b6afde3f501a3da567e23bf7f23d562938a1809
          rm -rf /tmp/mediaremote-adapter Vendor/MediaRemoteAdapter
          git clone --quiet https://github.com/ejbills/mediaremote-adapter.git /tmp/mediaremote-adapter
          git -C /tmp/mediaremote-adapter checkout --quiet "$REV"
          mkdir -p Vendor/MediaRemoteAdapter
          cp /tmp/mediaremote-adapter/Package.swift Vendor/MediaRemoteAdapter/Package.swift
          cp -R /tmp/mediaremote-adapter/Sources Vendor/MediaRemoteAdapter/Sources
          if [ -f /tmp/mediaremote-adapter/LICENSE ]; then cp /tmp/mediaremote-adapter/LICENSE Vendor/MediaRemoteAdapter/LICENSE; fi

      - name: Switch Xcode project to local package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Halo.xcodeproj/project.pbxproj')
          s = p.read_text()
          ident = 'A11C0F1A0000000000000382'

          remote_block = '''\t\tA11C0F1A0000000000000382 /* XCRemoteSwiftPackageReference "mediaremote-adapter" */ = {\n\t\t\tisa = XCRemoteSwiftPackageReference;\n\t\t\trepositoryURL = "https://github.com/ejbills/mediaremote-adapter.git";\n\t\t\trequirement = {\n\t\t\t\tkind = revision;\n\t\t\t\trevision = 5b6afde3f501a3da567e23bf7f23d562938a1809;\n\t\t\t};\n\t\t};\n'''
          local_block = '''\t\tA11C0F1A0000000000000382 /* XCLocalSwiftPackageReference "Vendor/MediaRemoteAdapter" */ = {\n\t\t\tisa = XCLocalSwiftPackageReference;\n\t\t\trelativePath = Vendor/MediaRemoteAdapter;\n\t\t};\n'''

          if local_block not in s:
              if remote_block not in s:
                  raise SystemExit('Expected MediaRemoteAdapter package reference not found')
              s = s.replace(remote_block, '')
              marker = '/* Begin XCSwiftPackageProductDependency section */'
              local_section = f'''/* Begin XCLocalSwiftPackageReference section */\n{local_block}/* End XCLocalSwiftPackageReference section */\n\n'''
              if marker not in s:
                  raise SystemExit('XCSwiftPackageProductDependency section marker missing')
              s = s.replace(marker, local_section + marker, 1)

          s = s.replace(
              f'{ident} /* XCRemoteSwiftPackageReference "mediaremote-adapter" */',
              f'{ident} /* XCLocalSwiftPackageReference "Vendor/MediaRemoteAdapter" */'
          )
          p.write_text(s)
          PY

      - name: Verify local package contract
        run: |
          set -euo pipefail
          test -f Vendor/MediaRemoteAdapter/Package.swift
          test -f Vendor/MediaRemoteAdapter/Sources/MediaRemoteAdapter/MediaController.swift
          test -f Vendor/MediaRemoteAdapter/Sources/MediaRemoteAdapter/TrackInfo.swift
          test -f Vendor/MediaRemoteAdapter/Sources/MediaRemoteAdapter/Resources/run.pl
          test -f Vendor/MediaRemoteAdapter/Sources/CIMediaRemote/MediaRemoteAdapter.m
          test -f Vendor/MediaRemoteAdapter/Sources/CIMediaRemote/include/MediaRemoteAdapter.h
          grep -q 'XCLocalSwiftPackageReference "Vendor/MediaRemoteAdapter"' Halo.xcodeproj/project.pbxproj
          grep -q 'relativePath = Vendor/MediaRemoteAdapter;' Halo.xcodeproj/project.pbxproj
          ! grep -q 'repositoryURL = "https://github.com/ejbills/mediaremote-adapter.git"' Halo.xcodeproj/project.pbxproj
          grep -q '^import MediaRemoteAdapter$' Halo/Core/WorkspaceStore.swift

      - name: Build vendored package directly
        run: |
          set -euo pipefail
          swift build --package-path Vendor/MediaRemoteAdapter

      - name: Resolve packages from clean state
        run: |
          set -euo pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/Halo-* || true
          xcodebuild -resolvePackageDependencies -project Halo.xcodeproj -scheme Halo | tee /tmp/halo-resolve.log
          grep -q 'MediaRemoteAdapter: .*Vendor/MediaRemoteAdapter @ local' /tmp/halo-resolve.log

      - name: Validate Halo can import local adapter
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -sdk macosx \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/halo-local-mediaremote-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # The dependency must resolve and compile, regardless of unrelated giant-SwiftUI
          # type-check timeouts elsewhere in Halo.
          grep -q "MediaRemoteAdapter: .*Vendor/MediaRemoteAdapter @ local" /tmp/halo-local-mediaremote-build.log
          grep -q "Compiling MediaController.swift" /tmp/halo-local-mediaremote-build.log
          grep -q "Halo/Core/WorkspaceStore.swift" /tmp/halo-local-mediaremote-build.log

          # Never accept a failure caused by this integration.
          if grep -E "(WorkspaceStore\.swift|Vendor/MediaRemoteAdapter|MediaRemoteAdapter).*error:" /tmp/halo-local-mediaremote-build.log; then
            echo "MediaRemoteAdapter integration emitted a compiler error"
            exit 1
          fi
          if grep -E "(Unable to resolve module dependency|no such module).*MediaRemoteAdapter" /tmp/halo-local-mediaremote-build.log; then
            echo "Halo could not import MediaRemoteAdapter"
            exit 1
          fi

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "Halo full build returned $BUILD_STATUS due to unrelated existing source errors; local MediaRemoteAdapter import compiled successfully."
            grep -E "error:|unable to type-check" /tmp/halo-local-mediaremote-build.log | tail -30 || true
          fi

      - name: Verify adapter resource bundle was produced
        run: |
          set -euo pipefail
          RUN_PL=$(find ~/Library/Developer/Xcode/DerivedData -path '*MediaRemoteAdapter_MediaRemoteAdapter.bundle/Contents/Resources/run.pl' -print -quit)
          test -n "$RUN_PL"
          FRAMEWORK=$(find ~/Library/Developer/Xcode/DerivedData -path '*/PackageFrameworks/MediaRemoteAdapter.framework' -print -quit)
          test -n "$FRAMEWORK"
          echo "Built adapter framework: $FRAMEWORK"
          echo "Built adapter bridge: $RUN_PL"

      - name: Commit vendored dependency
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Vendor/MediaRemoteAdapter Halo.xcodeproj/project.pbxproj
          if [ -f Halo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved ]; then
            git add Halo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          fi
          if git diff --cached --quiet; then
            echo 'Vendored MediaRemoteAdapter is already committed.'
            exit 0
          fi
          git commit -m 'Vendor MediaRemote adapter for reliable Xcode builds'
          git pull --rebase origin main
          git push origin main
