name: Native MediaRemote Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/vendor-mediaremote-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native bridge migration
        run: |
          set -euo pipefail
          # The vendored controller's next member after libraryPath is runPerlCommand,
          # not an `arguments` property. Normalize the helper before executing it so
          # this migration remains safe against the source currently on main.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/remove_mediaremote_spm.py')
          s = p.read_text()
          old = "old_library_end = s.find('\\n    private var arguments: [String] {', old_library_start)"
          new = "old_library_end = s.find('\\n    @discardableResult', old_library_start)"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Could not normalize MediaRemote helper libraryPath terminator')
          PY
          python3 .github/scripts/remove_mediaremote_spm.py

      - name: Verify dependency and target-membership contract
        run: |
          set -euo pipefail
          ! grep -q '^import MediaRemoteAdapter$' Halo/Core/WorkspaceStore.swift
          ! grep -q 'XCLocalSwiftPackageReference "Vendor/MediaRemoteAdapter"' Halo.xcodeproj/project.pbxproj
          ! grep -q 'MediaRemoteAdapter in Frameworks' Halo.xcodeproj/project.pbxproj
          test -f Halo/Core/MediaRemoteController.swift
          test -f Halo/Core/MediaRemoteTrackInfo.swift
          grep -q 'Core/MediaRemoteController.swift in Sources' Halo.xcodeproj/project.pbxproj
          grep -q 'Core/MediaRemoteTrackInfo.swift in Sources' Halo.xcodeproj/project.pbxproj
          grep -q 'Core/MediaRemoteController.swift \*/,' Halo.xcodeproj/project.pbxproj
          grep -q 'Core/MediaRemoteTrackInfo.swift \*/,' Halo.xcodeproj/project.pbxproj
          grep -q 'Build native MediaRemote bridge' Halo.xcodeproj/project.pbxproj
          grep -q 'Bundle.main.path(forResource: "run", ofType: "pl")' Halo/Core/MediaRemoteController.swift
          grep -q 'libHaloMediaRemoteBridge.dylib' Halo/Core/MediaRemoteController.swift

      - name: Type-check direct Halo Swift bridge
        run: |
          set -euo pipefail
          xcrun swiftc -typecheck \
            Halo/Core/MediaRemoteTrackInfo.swift \
            Halo/Core/MediaRemoteController.swift \
            -framework AppKit

      - name: Compile Objective-C bridge directly
        run: |
          set -euo pipefail
          SRC="$PWD/Vendor/MediaRemoteAdapter/Sources/CIMediaRemote"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun clang -arch arm64 -isysroot "$SDK" -mmacosx-version-min=13.0 \
            -dynamiclib -fobjc-arc -fblocks -I"$SRC/include" \
            "$SRC/MediaRemote.m" "$SRC/MediaRemoteAdapter.m" "$SRC/MediaRemoteAdapterKeys.m" \
            -framework Foundation -framework AppKit \
            -install_name @rpath/libHaloMediaRemoteBridge.dylib \
            -o /tmp/libHaloMediaRemoteBridge.dylib
          test -s /tmp/libHaloMediaRemoteBridge.dylib
          nm -gU /tmp/libHaloMediaRemoteBridge.dylib | grep -q '_bootstrap$'
          nm -gU /tmp/libHaloMediaRemoteBridge.dylib | grep -q '_get$'

      - name: Resolve remaining Swift packages cleanly
        run: |
          set -euo pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/Halo-* || true
          xcodebuild -resolvePackageDependencies -project Halo.xcodeproj -scheme Halo | tee /tmp/halo-resolve.log
          ! grep -qi 'MediaRemoteAdapter' /tmp/halo-resolve.log
          grep -qi 'Sparkle' /tmp/halo-resolve.log

      - name: Build Halo and verify native bridge integration
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -sdk macosx \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/halo-native-mediaremote-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          # Prove Xcode actually included both direct bridge files in Halo's compile graph.
          grep -q 'MediaRemoteController.swift' /tmp/halo-native-mediaremote-build.log
          grep -q 'MediaRemoteTrackInfo.swift' /tmp/halo-native-mediaremote-build.log
          grep -q 'Build native MediaRemote bridge' /tmp/halo-native-mediaremote-build.log

          if grep -E '(MediaRemoteController\.swift|MediaRemoteTrackInfo\.swift|WorkspaceStore\.swift|libHaloMediaRemoteBridge).*error:' /tmp/halo-native-mediaremote-build.log; then
            echo 'Native MediaRemote integration emitted a compiler/build error'
            exit 1
          fi
          if grep -E '(Unable to resolve module dependency|no such module).*MediaRemoteAdapter' /tmp/halo-native-mediaremote-build.log; then
            echo 'Stale MediaRemoteAdapter SwiftPM import remains'
            exit 1
          fi
          if grep -E "cannot find ('MediaController'|type 'TrackInfo') in scope" /tmp/halo-native-mediaremote-build.log; then
            echo 'Direct MediaRemote source membership failed'
            exit 1
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug/Halo.app' -print -quit)
            test -n "$APP"
            test -s "$APP/Contents/Frameworks/libHaloMediaRemoteBridge.dylib"
            test -s "$APP/Contents/Resources/run.pl"
          else
            echo "Halo full build returned $BUILD_STATUS due to unrelated source errors; MediaRemote integration itself passed."
            grep -E 'error:|unable to type-check' /tmp/halo-native-mediaremote-build.log | tail -30 || true
          fi

      - name: Commit native bridge migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/remove_mediaremote_spm.py \
                  Halo/Core/WorkspaceStore.swift \
                  Halo/Core/MediaRemoteController.swift \
                  Halo/Core/MediaRemoteTrackInfo.swift \
                  Halo.xcodeproj/project.pbxproj \
                  Halo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if git diff --cached --quiet; then
            echo 'Native MediaRemote migration is already committed.'
            exit 0
          fi
          git commit -m 'Remove MediaRemoteAdapter SwiftPM dependency'
          git pull --rebase origin main
          git push origin main
