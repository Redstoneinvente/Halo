name: Native MediaRemote Bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/vendor-mediaremote-trigger.txt'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native bridge migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/remove_mediaremote_spm.py')
          s = p.read_text()
          old = "old_library_end = s.find('\\n    private var arguments: [String] {', old_library_start)"
          new = "old_library_end = s.find('\\n    @discardableResult', old_library_start)"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('Could not normalize MediaRemote helper libraryPath terminator')
          PY
          python3 .github/scripts/remove_mediaremote_spm.py

      - name: Embed Swift bridge in WorkspaceStore
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workspace = Path('Halo/Core/WorkspaceStore.swift')
          controller_path = Path('Halo/Core/MediaRemoteController.swift')
          track_path = Path('Halo/Core/MediaRemoteTrackInfo.swift')
          pbx = Path('Halo.xcodeproj/project.pbxproj')
          marker = '// MARK: - Embedded MediaRemote bridge'

          def without_imports(text: str) -> str:
              lines = [line for line in text.splitlines() if not line.startswith('import ')]
              return '\n'.join(lines).strip() + '\n'

          ws = workspace.read_text()
          if marker not in ws:
              track = without_imports(track_path.read_text())
              controller = without_imports(controller_path.read_text())
              ws = ws.rstrip() + '\n\n' + marker + '\n\n' + track + '\n' + controller
              workspace.write_text(ws)

          # These temporary files were useful to generate/validate the bridge, but keeping
          # the Swift types inside an already-compiled Halo source file avoids any PBX
          # target-membership ambiguity on Xcode.
          controller_path.unlink(missing_ok=True)
          track_path.unlink(missing_ok=True)

          project = pbx.read_text()
          for ident in (
              'A11C0F1A0000000000000390',
              'A11C0F1A0000000000000391',
              'A11C0F1A0000000000000392',
              'A11C0F1A0000000000000393',
          ):
              project = re.sub(r'^.*' + re.escape(ident) + r'.*\n?', '', project, flags=re.MULTILINE)
          pbx.write_text(project)
          PY

      - name: Verify embedded dependency contract
        run: |
          set -euo pipefail
          ! grep -q '^import MediaRemoteAdapter$' Halo/Core/WorkspaceStore.swift
          ! grep -q 'XCLocalSwiftPackageReference "Vendor/MediaRemoteAdapter"' Halo.xcodeproj/project.pbxproj
          ! grep -q 'MediaRemoteAdapter in Frameworks' Halo.xcodeproj/project.pbxproj
          ! grep -q 'A11C0F1A000000000000039[0-3]' Halo.xcodeproj/project.pbxproj
          test ! -e Halo/Core/MediaRemoteController.swift
          test ! -e Halo/Core/MediaRemoteTrackInfo.swift
          grep -q '// MARK: - Embedded MediaRemote bridge' Halo/Core/WorkspaceStore.swift
          grep -q 'public class MediaController' Halo/Core/WorkspaceStore.swift
          grep -q 'public struct TrackInfo' Halo/Core/WorkspaceStore.swift
          grep -q 'Bundle.main.path(forResource: "run", ofType: "pl")' Halo/Core/WorkspaceStore.swift
          grep -q 'libHaloMediaRemoteBridge.dylib' Halo/Core/WorkspaceStore.swift
          grep -q 'Build native MediaRemote bridge' Halo.xcodeproj/project.pbxproj

      - name: Type-check adapter Swift surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ws = Path('Halo/Core/WorkspaceStore.swift').read_text()
          marker = '// MARK: - Embedded MediaRemote bridge'
          bridge = ws.split(marker, 1)[1]
          Path('/tmp/HaloEmbeddedMediaRemote.swift').write_text('import AppKit\nimport Foundation\nimport Darwin\n' + bridge)
          PY
          xcrun swiftc -typecheck /tmp/HaloEmbeddedMediaRemote.swift -framework AppKit

      - name: Compile Objective-C bridge directly
        run: |
          set -euo pipefail
          SRC="$PWD/Vendor/MediaRemoteAdapter/Sources/CIMediaRemote"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun clang -arch arm64 -isysroot "$SDK" -mmacosx-version-min=13.0 \
            -dynamiclib -fobjc-arc -fblocks -I"$SRC/include" \
            "$SRC/MediaRemote.m" "$SRC/MediaRemoteAdapter.m" "$SRC/MediaRemoteAdapterKeys.m" \
            -framework Foundation -framework AppKit \
            -install_name @rpath/libHaloMediaRemoteBridge.dylib \
            -o /tmp/libHaloMediaRemoteBridge.dylib
          test -s /tmp/libHaloMediaRemoteBridge.dylib
          nm -gU /tmp/libHaloMediaRemoteBridge.dylib | grep -q '_bootstrap$'
          nm -gU /tmp/libHaloMediaRemoteBridge.dylib | grep -q '_get$'

      - name: Resolve remaining Swift packages cleanly
        run: |
          set -euo pipefail
          rm -rf ~/Library/Developer/Xcode/DerivedData/Halo-* || true
          xcodebuild -resolvePackageDependencies -project Halo.xcodeproj -scheme Halo | tee /tmp/halo-resolve.log
          ! grep -qi 'MediaRemoteAdapter' /tmp/halo-resolve.log
          grep -qi 'Sparkle' /tmp/halo-resolve.log

      - name: Build Halo and verify native bridge integration
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -sdk macosx \
            -arch arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/halo-native-mediaremote-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          grep -q 'Build native MediaRemote bridge' /tmp/halo-native-mediaremote-build.log

          if grep -E '(Unable to resolve module dependency|no such module).*MediaRemoteAdapter' /tmp/halo-native-mediaremote-build.log; then
            echo 'Stale MediaRemoteAdapter SwiftPM import remains'
            exit 1
          fi
          if grep -E "cannot find ('MediaController'|type 'TrackInfo') in scope" /tmp/halo-native-mediaremote-build.log; then
            echo 'Embedded MediaRemote Swift bridge is not visible to WorkspaceStore'
            exit 1
          fi
          if grep -E 'WorkspaceStore\.swift:.*(MediaRemote|MediaController|TrackInfo|run\.pl|libHaloMediaRemoteBridge).*error:' /tmp/halo-native-mediaremote-build.log; then
            echo 'Embedded MediaRemote integration emitted a compiler error'
            exit 1
          fi

          if [ "$BUILD_STATUS" -eq 0 ]; then
            APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Build/Products/Debug/Halo.app' -print -quit)
            test -n "$APP"
            test -s "$APP/Contents/Frameworks/libHaloMediaRemoteBridge.dylib"
            test -s "$APP/Contents/Resources/run.pl"
          else
            echo "Halo full build returned $BUILD_STATUS because of an unrelated source error; MediaRemote integration passed."
            grep -E 'error:|unable to type-check' /tmp/halo-native-mediaremote-build.log | tail -30 || true
          fi

      - name: Commit native bridge migration
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/scripts/remove_mediaremote_spm.py \
                  Halo/Core/WorkspaceStore.swift \
                  Halo.xcodeproj/project.pbxproj \
                  Halo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if git diff --cached --quiet; then
            echo 'Native MediaRemote migration is already committed.'
            exit 0
          fi
          git commit -m 'Remove MediaRemoteAdapter SwiftPM dependency'
          git pull --rebase origin main
          git push origin main
