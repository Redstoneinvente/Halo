name: Recover Pixel Pet Personality Pass

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-pixel-pal-personality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply personality patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import ast, base64, gzip, re

          workflow = Path('.github/workflows/polish-pixel-pal-interactions.yml').read_text()
          match = re.search(r"printf '%s' '([^']+)' \| python3 -c", workflow)
          if not match:
              raise SystemExit('Could not locate embedded personality patch payload')

          patcher = gzip.decompress(base64.b64decode(match.group(1))).decode()
          tree = ast.parse(patcher)
          draw_brows_header = '    private func drawBrows(render: (HaloPixelPalPlacedSprite, Double, Int, Int) -> Void) {\n'
          changed = 0

          class GuardFix(ast.NodeTransformer):
              def visit_Call(self, node):
                  nonlocal_changed = False
                  self.generic_visit(node)
                  if isinstance(node.func, ast.Name) and node.func.id == 'once' and len(node.args) >= 3:
                      label = node.args[2]
                      if isinstance(label, ast.Constant) and label.value == 'brow suppression':
                          old = node.args[0]
                          new = node.args[1]
                          if not (isinstance(old, ast.Constant) and isinstance(new, ast.Constant) and isinstance(old.value, str) and isinstance(new.value, str)):
                              raise SystemExit('brow suppression once() arguments are not string constants')
                          if not old.value.startswith(draw_brows_header):
                              old.value = draw_brows_header + old.value
                              new.value = draw_brows_header + new.value
                          nonlocal_changed = True
                  if nonlocal_changed:
                      self.changed = getattr(self, 'changed', 0) + 1
                  return node

          fixer = GuardFix()
          tree = fixer.visit(tree)
          ast.fix_missing_locations(tree)
          changed = getattr(fixer, 'changed', 0)
          if changed != 1:
              raise SystemExit(f'Expected one brow suppression call, found {changed}')

          patcher = ast.unparse(tree) + '\n'
          Path('/tmp/pixel_pal_personality_recovered.py').write_text(patcher)
          print('Recovered personality patcher with a function-scoped brow guard.')
          PY
          python3 /tmp/pixel_pal_personality_recovered.py

      - name: Verify personality contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'enum HaloPixelPalPersonality',
              'struct HaloPixelPalStrokeDetector',
              'func feedCookie()',
              'func petted()',
              'func considerChase',
              'case sneeze',
              'case hiccup',
              'case satisfied',
              'AudioSpectrumService.shared.snapshot()',
              '.onDrop(of: [UTType.fileURL.identifier]',
              'private func drawCookieBadge',
              'isEatingAnyCookie',
              'case .dreamCookie:',
              'Picker("Personality"',
          ]
          missing = [marker for marker in required if marker not in s]
          if missing:
              raise SystemExit(f'Missing Pixel Pet personality markers: {missing}')
          doc = Path('Docs/PixelPalV2.md').read_text()
          if '## 21. Personality micro-behaviour engine' not in doc:
              raise SystemExit('Canonical Pixel Pal personality section missing')
          print('Pixel Pet personality contract verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift Docs/PixelPalV2.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand Pixel Pet personality engine"
          git pull --rebase origin main
          git push origin HEAD:main
