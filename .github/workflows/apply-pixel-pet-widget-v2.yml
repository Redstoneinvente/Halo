name: Integrate Halo Pixel Pet Widget

on:
  push:
    branches: [main]
    paths:
      - '.github/pixel-pet-widget-v2-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate Pixel Pet module
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace_path = Path('Halo/Core/WorkspaceModels.swift')
          workspace = workspace_path.read_text()

          replacements = [
              ('case clock, timer, shelf, media, audio, calendar, clipboard, system, launcher, activities, developer, notes, capture, stopwatch',
               'case clock, timer, shelf, media, audio, calendar, clipboard, system, launcher, activities, pet, developer, notes, capture, stopwatch'),
              ('static var allCases: [ModuleID] { [.clock, .timer, .shelf, .media, .audio, .calendar, .clipboard, .system, .launcher, .activities, .notes, .capture, .stopwatch] }',
               'static var allCases: [ModuleID] { [.clock, .timer, .shelf, .media, .audio, .calendar, .clipboard, .system, .launcher, .activities, .pet, .notes, .capture, .stopwatch] }'),
              ('var title: String { rawValue == "shelf" ? "File shelf" : rawValue.capitalized }',
               'var title: String { rawValue == "shelf" ? "File shelf" : (self == .pet ? "Halo Pet" : rawValue.capitalized) }'),
              ('case .developer: return "chevron.left.forwardslash.chevron.right"',
               'case .pet: return "pawprint.fill"\n        case .developer: return "chevron.left.forwardslash.chevron.right"'),
              ('if id == .clock { style.fontSize = 30; style.fontFamily = .rounded; style.weight = .light; style.showTitle = false }',
               'if id == .clock { style.fontSize = 30; style.fontFamily = .rounded; style.weight = .light; style.showTitle = false }\n        if id == .pet { style.showTitle = false }'),
          ]
          for old, new in replacements:
              if old not in workspace:
                  raise SystemExit('Missing WorkspaceModels anchor: ' + old)
              workspace = workspace.replace(old, new, 1)
          workspace_path.write_text(workspace)

          # Existing exhaustive ModuleID switches all know about .developer. Let Pixel Pet use
          # that generic fallback unless it has explicit behavior of its own.
          for path in Path('Halo').rglob('*.swift'):
              if path in (workspace_path, Path('Halo/Views/PixelPetWidget.swift')):
                  continue
              text = path.read_text()
              out = []
              for line in text.splitlines(keepends=True):
                  stripped = line.lstrip()
                  if stripped.startswith('case ') and '.developer' in line and '.pet' not in line:
                      colon = line.find(':')
                      if colon >= 0:
                          line = line[:colon].rstrip() + ', .pet' + line[colon:]
                  out.append(line)
              path.write_text(''.join(out))

          module_path = Path('Halo/Views/ModuleViews.swift')
          module = module_path.read_text()
          old = '''        case .stopwatch:\n            if gridColumnSpan != nil, gridRowSpan != nil { VisualWorkspaceAdaptiveModuleView(module: .stopwatch, store: store, workspace: workspace) }\n            else { stopwatchContent }\n        default: EmptyView()'''
          new = '''        case .stopwatch:\n            if gridColumnSpan != nil, gridRowSpan != nil { VisualWorkspaceAdaptiveModuleView(module: .stopwatch, store: store, workspace: workspace) }\n            else { stopwatchContent }\n        case .pet:\n            HaloPixelPetWidget(store: store, workspace: workspace)\n        default: EmptyView()'''
          if old not in module:
              raise SystemExit('Missing IntegrationModuleView anchor')
          module_path.write_text(module.replace(old, new, 1))

          # Handle any exhaustive ModuleID switches that live in WorkspaceModels itself, while
          # preserving the dedicated pawprint branch in ModuleID.symbol.
          workspace = workspace_path.read_text()
          out = []
          for line in workspace.splitlines(keepends=True):
              stripped = line.lstrip()
              if stripped.startswith('case ') and '.developer' in line and '.pet' not in line and 'chevron.left.forwardslash.chevron.right' not in line:
                  colon = line.find(':')
                  if colon >= 0:
                      line = line[:colon].rstrip() + ', .pet' + line[colon:]
              out.append(line)
          workspace_path.write_text(''.join(out))

          project_path = Path('Halo.xcodeproj/project.pbxproj')
          project = project_path.read_text()
          build_id = 'A11C0F1A0000000000000371'
          ref_id = 'A11C0F1A0000000000000372'
          anchors = [
              ('\t\t0000000000000000000002E4 /* Views/CompanionSprite.swift in Sources */ = {isa = PBXBuildFile; fileRef = 0000000000000000000002E5 /* Views/CompanionSprite.swift */; };',
               '\t\t0000000000000000000002E4 /* Views/CompanionSprite.swift in Sources */ = {isa = PBXBuildFile; fileRef = 0000000000000000000002E5 /* Views/CompanionSprite.swift */; };\n\t\t' + build_id + ' /* Views/PixelPetWidget.swift in Sources */ = {isa = PBXBuildFile; fileRef = ' + ref_id + ' /* Views/PixelPetWidget.swift */; };'),
              ('\t\t0000000000000000000002E5 /* Views/CompanionSprite.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Views/CompanionSprite.swift; sourceTree = "<group>"; };',
               '\t\t0000000000000000000002E5 /* Views/CompanionSprite.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Views/CompanionSprite.swift; sourceTree = "<group>"; };\n\t\t' + ref_id + ' /* Views/PixelPetWidget.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Views/PixelPetWidget.swift; sourceTree = "<group>"; };'),
              ('\t\t\t\t0000000000000000000002E5 /* Views/CompanionSprite.swift */,',
               '\t\t\t\t0000000000000000000002E5 /* Views/CompanionSprite.swift */,\n\t\t\t\t' + ref_id + ' /* Views/PixelPetWidget.swift */,'),
              ('\t\t\t\t0000000000000000000002E4 /* Views/CompanionSprite.swift in Sources */,',
               '\t\t\t\t0000000000000000000002E4 /* Views/CompanionSprite.swift in Sources */,\n\t\t\t\t' + build_id + ' /* Views/PixelPetWidget.swift in Sources */,'),
          ]
          for old, new in anchors:
              if project.count(old) != 1:
                  raise SystemExit('Unexpected Xcode project anchor count: ' + str(project.count(old)))
              project = project.replace(old, new, 1)
          project_path.write_text(project)
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Run Halo core tests
        run: swift test

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-pixel-pet-build.log

      - name: Commit integration
        run: |
          rm -f .github/pixel-pet-widget-trigger.txt
          rm -f .github/pixel-pet-widget-v2-trigger.txt
          rm -f .github/workflows/apply-pixel-pet-widget.yml
          rm -f .github/workflows/apply-pixel-pet-widget-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate adaptive Halo Pixel Pet widget'
          git push origin HEAD:main
