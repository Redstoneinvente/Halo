name: One-time Drop CI polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-drop-ci-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/scripts/one_time_drop_ci_polish.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'summonFinderFallbackIfNeeded' Halo/NotchEngine/DisplayClock.swift
          ! grep -q 'HaloContextRetroCompanionMascot' Halo/Core/PersonalizationModels.swift
          ! grep -q 'Show EI companion mascot' Halo/Core/PersonalizationModels.swift
          grep -q 'struct HaloDropZoneSettingsEditor' Halo/NotchEngine/DisplayClock.swift
          grep -q 'HaloDropZoneSettingsEditor()' Halo/Views/WorkspaceSettingsView.swift
          git diff --check
          xcrun swiftc -parse Halo/NotchEngine/DisplayClock.swift Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift Halo/Core/PersonalizationModels.swift

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/one_time_drop_ci_polish.py
          rm .github/workflows/one-time-drop-ci-polish.yml
          git config user.name 'Redstoneinvente'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add -A
          git commit -m 'Polish Drop CI and fix drag detection'
          git push origin HEAD:main
