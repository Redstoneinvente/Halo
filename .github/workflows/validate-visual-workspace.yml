name: Validate Visual Workspace

on:
  push:
    branches:
      - chatgpt/visual-workspace-adaptive-widgets

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo
        run: xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
