name: One-time Rollback Drop CI Zone Background

on:
  push:
    paths:
      - 'Scripts/one_time_rollback_zone_background.py'
      - '.github/workflows/one-time-rollback-zone-background.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove duplicate zone background layer
        run: python3 Scripts/one_time_rollback_zone_background.py

      - name: Validate Swift syntax
        run: xcrun swiftc -parse Halo/NotchEngine/DisplayClock.swift

      - name: Validate diff
        run: git diff --check

      - name: Commit rollback and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/NotchEngine/DisplayClock.swift
          git rm Scripts/one_time_rollback_zone_background.py
          git rm .github/workflows/one-time-rollback-zone-background.yml
          git commit -m 'Restore Drop CI zone overlay'
          git push origin HEAD:main
