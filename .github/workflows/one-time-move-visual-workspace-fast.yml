name: One-time Opened Space Appearance Fast Apply

on:
  push:
    paths:
      - '.github/workflows/one-time-move-visual-workspace-fast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply opened-space Appearance migration
        run: python3 Scripts/one_time_move_visual_workspace_to_appearance.py

      - name: Validate patch structure
        run: |
          git diff --check
          grep -q 'case openedSpace = "Opened Space"' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Picker("Layout system"' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Picker("Space behavior"' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Open Visual Workspace Editor' Halo/Views/WorkspaceSettingsView.swift
          ! grep -q 'Use Custom Workspace Layout' Halo/Views/WidgetSettingsView.swift
          grep -q '^struct OpenedNotchWorkspaceEditor: View' Halo/Views/WidgetSettingsView.swift

      - name: Commit implementation and clean one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift Halo/Views/WidgetSettingsView.swift
          git rm -f Scripts/one_time_move_visual_workspace_to_appearance.py
          git rm -f .github/workflows/one-time-move-visual-workspace-to-appearance.yml
          git rm -f .github/workflows/one-time-move-visual-workspace-fast.yml
          git commit -m 'Move visual workspace controls into Appearance'
          git push origin HEAD:main
