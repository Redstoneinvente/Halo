name: Apply Halo release fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-halo-release-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Halo release UX
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/apply-halo-release-fixes.yml
          git config user.name "Halo Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Wire What's New and About update controls"
          git push origin HEAD:main
