name: Closed Notch Fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/closed-notch-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/audit_closed_notch_layout.py
      - run: git diff --check
      - run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/SurfaceModels.swift Halo/Core/WidgetModels.swift Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift Halo/Views/WidgetSettingsView.swift
          git commit -m 'fix: rebuild closed notch spacing and sizing'
          git push origin main
