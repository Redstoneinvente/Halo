name: Apply Visual Workspace Settings Navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/visual-workspace-settings-navigation-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch settings navigation
        run: python3 .github/scripts/patch_visual_workspace_settings_navigation.py

      - name: Verify Visual Workspace navigation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/WorkspaceSettingsView.swift').read_text()
          required = [
              'items.append("Visual Workspace Editor")',
              'visualWorkspaceActive && (name == "Modules" || name == "Widgets")',
              'Text("Default")',
              'Image(systemName: "lock.fill")',
              '.disabled(isSectionUnavailable(name))',
              'OpenedNotchWorkspaceEditor(layout: $workspace.settings.layout)',
              'case "Visual Workspace Editor": return "rectangle.3.group"',
              'section = "Visual Workspace Editor"',
          ]
          missing = [m for m in required if m not in s]
          if missing:
              raise SystemExit(f'Missing Visual Workspace navigation markers: {missing}')
          print('Visual Workspace navigation contract verified.')
          PY

      - name: Parse settings source
        run: swiftc -parse Halo/Views/WorkspaceSettingsView.swift

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/halo-build.log

      - name: Commit navigation update
        run: |
          if git diff --quiet -- Halo/Views/WorkspaceSettingsView.swift; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/WorkspaceSettingsView.swift
          git commit -m "Route Visual Workspace settings to its editor"
          git pull --rebase origin main
          git push origin HEAD:main
