name: Apply EI Pet Sprite Renderer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ei-pet-sprites.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical pet renderer patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_ei_pet_sprites.py')
          text = path.read_text()
          text = text.replace(
              'enum HaloPetPose: String, CaseIterable, Identifiable {',
              'enum HaloPetPose: String, CaseIterable, Identifiable, Hashable {'
          )
          path.write_text(text)
          PY
          python3 .github/scripts/apply_ei_pet_sprites.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Compile and validate EI pet sources
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          grep -E 'SwiftCompile normal arm64 .*CompanionSprite\.swift|SwiftCompile normal arm64 .*ExtensionContracts\.swift|error:' /tmp/halo-build.log | tail -120 || true
          if grep -Eq '(CompanionSprite|ExtensionContracts)\.swift:[0-9]+:[0-9]+: error:' /tmp/halo-build.log; then
            echo 'EI pet source compilation failed.'
            exit 65
          fi
          if ! grep -Eq 'SwiftCompile normal arm64 .*/CompanionSprite\.swift' /tmp/halo-build.log; then
            echo 'CompanionSprite.swift was not compiled; refusing to commit.'
            exit 66
          fi
          if ! grep -Eq 'SwiftCompile normal arm64 .*/ExtensionContracts\.swift' /tmp/halo-build.log; then
            echo 'ExtensionContracts.swift was not compiled; refusing to commit.'
            exit 67
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full target still has unrelated compile errors; EI pet source files themselves compiled without errors.'
          fi

      - name: Commit validated renderer
        shell: bash
        run: |
          if git diff --quiet -- Halo/Views/CompanionSprite.swift Halo/Core/ExtensionContracts.swift; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "Halo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Halo/Views/CompanionSprite.swift Halo/Core/ExtensionContracts.swift
          git commit -m "feat: use canonical sprite sheets for EI pets"
          git push origin HEAD:main
