name: Apply EI Pet Sprite Renderer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ei-pet-sprites.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical pet renderer patch
        run: python3 .github/scripts/apply_ei_pet_sprites.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Build Halo
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Commit validated renderer
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "Halo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Halo/Views/CompanionSprite.swift Halo/Core/ExtensionContracts.swift
          git commit -m "feat: use canonical sprite sheets for EI pets"
          git push origin HEAD:main
