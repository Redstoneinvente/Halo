name: Update Animation Sidebar
on: workflow_dispatch
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/move_update_animation_settings.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Halo/Views/WorkspaceSettingsView.swift Halo/Views/AccountLicenseSettingsView.swift
          git commit -m "Move Update Animation to dedicated settings page"
          git push
