name: Fix Closed Notch HUD Edge
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-closed-notch-hud-edge.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_closed_notch_hud_edge.py
      - run: git diff --check
      - run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift
          git commit -m 'fix: keep HUD replacement aligned to notch edge'
          git push origin main
