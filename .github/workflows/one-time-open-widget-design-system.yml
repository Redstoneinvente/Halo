name: One-time Opened Widget Design System

on:
  push:
    paths:
      - 'Scripts/one_time_open_widget_design_system.py'
      - '.github/workflows/one-time-open-widget-design-system.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply opened widget design system patch
        run: python3 Scripts/one_time_open_widget_design_system.py

      - name: Validate Swift syntax
        run: |
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift

      - name: Validate diff
        run: git diff --check

      - name: Check changed files for compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 140 /tmp/halo-build.log
          if grep -E '(^|/)(WidgetModels|WidgetViews|ModuleViews|WidgetSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in a changed file.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated existing failure; changed files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Views/WidgetViews.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift
          git rm Scripts/one_time_open_widget_design_system.py
          git rm .github/workflows/one-time-open-widget-design-system.yml
          git commit -m 'Add per-widget opened notch design system'
          git push origin HEAD:main
