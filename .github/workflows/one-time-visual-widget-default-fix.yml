name: One-time Visual Workspace Block Default Fix

on:
  push:
    paths:
      - '.github/workflows/one-time-visual-widget-default-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 Scripts/one_time_visual_widget_default_fix.py
      - name: Validate
        run: |
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          git diff --check
          grep -q 'WidgetCardBackgroundStyle.none' Halo/Core/WidgetModels.swift
          grep -q 'WidgetOutlineStyle.none' Halo/Core/WidgetModels.swift
      - name: Commit and clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift
          git rm -f --ignore-unmatch Scripts/one_time_visual_widget_default_fix.py
          git rm -f --ignore-unmatch .github/workflows/one-time-visual-widget-default-fix.yml
          git commit -m 'Fix Visual Workspace integrated block defaults'
          git push origin HEAD:main
