name: Validate Live Activities final

on:
  push:
    branches:
      - codex/live-activities-v1
    paths:
      - 'Halo/**'
      - 'Tests/**'
      - 'Package.swift'
      - '.github/workflows/validate-live-activities-final.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo app target
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
      - name: Run Swift package core tests
        run: swift test
