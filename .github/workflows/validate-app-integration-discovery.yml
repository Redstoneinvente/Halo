name: Validate App Integration Discovery

on:
  push:
    branches:
      - codex/implementation-of-custom-ci-v2
    paths:
      - 'Halo/Core/HaloIntegration.swift'
      - 'Halo/Views/WorkspaceSettingsView.swift'
      - 'Halo.xcodeproj/project.pbxproj'
      - 'Tests/HaloCoreTests.swift'
      - 'Docs/AppIntegrations.md'
      - '.github/workflows/validate-app-integration-discovery.yml'
  pull_request:
    paths:
      - 'Halo/Core/HaloIntegration.swift'
      - 'Halo/Views/WorkspaceSettingsView.swift'
      - 'Halo.xcodeproj/project.pbxproj'
      - 'Tests/HaloCoreTests.swift'
      - 'Docs/AppIntegrations.md'
      - '.github/workflows/validate-app-integration-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build | tee xcodebuild.log

      - name: Test Halo
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            test | tee xcodetest.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-integration-discovery-xcode-logs
          path: |
            xcodebuild.log
            xcodetest.log
