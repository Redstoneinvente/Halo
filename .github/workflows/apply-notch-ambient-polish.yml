name: Apply Notch Ambient Polish
on:
  push:
    branches: [chatgpt/notch-ambient-polish]
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, typecheck and publish Ambient repair
        shell: bash
        run: |
          set -euo pipefail
          cp .github/notch_ambient_compile_fix.py /tmp/notch_ambient_compile_fix.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/notch_ambient_compile_fix.py

          echo '=== Repair scope ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'Halo/Views/DecorationsView.swift'}
          if changed != expected:
              raise SystemExit(f'Unexpected repair scope: {sorted(changed)}')
          print('Notch Ambient repair scope verified.')
          PY

          git diff --check
          xcrun swiftc -parse Halo/Views/DecorationsView.swift

          # Prime Xcode's generated Swift asset symbols. The repository has unrelated
          # compiler-complexity failures, so this preflight is allowed to fail.
          echo '=== Prime generated sources ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > /tmp/ambient-preflight.log 2>&1
          set -e

          GENERATED=$(find build -path '*DerivedSources/GeneratedAssetSymbols.swift' -print -quit)
          if [[ -z "$GENERATED" ]]; then
              echo 'GeneratedAssetSymbols.swift was not produced.' >&2
              exit 1
          fi

          echo '=== Primary-file typecheck: DecorationsView.swift ==='
          PRIMARY="$PWD/Halo/Views/DecorationsView.swift"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          declare -a SWIFT_SOURCES=()
          while IFS= read -r source; do
              absolute="$PWD/$source"
              if [[ "$absolute" == "$PRIMARY" ]]; then
                  continue
              fi
              SWIFT_SOURCES+=("$absolute")
          done < <(find Halo -type f -name '*.swift' | sort)

          set +e
          xcrun swiftc -frontend -typecheck \
            "${SWIFT_SOURCES[@]}" \
            -primary-file "$PRIMARY" \
            "$PWD/$GENERATED" \
            -target arm64-apple-macos13.0 \
            -sdk "$SDK" \
            -module-name Halo \
            -swift-version 5 \
            -D DEBUG \
            -enable-testing \
            -enable-bare-slash-regex \
            -enable-experimental-feature DebugDescriptionMacro \
            -I "$PWD/build/Debug" \
            -F "$PWD/build/Debug" \
            2>&1 | tee /tmp/ambient-primary-typecheck.log
          ambient_status=${PIPESTATUS[0]}
          set -e

          if [[ $ambient_status -ne 0 ]]; then
              echo 'DecorationsView primary-file typecheck failed.' >&2
              grep -E 'DecorationsView\.swift:[0-9]+:[0-9]+: (error|warning):' /tmp/ambient-primary-typecheck.log || true
              exit 1
          fi
          if grep -E 'DecorationsView\.swift:[0-9]+:[0-9]+: error:' /tmp/ambient-primary-typecheck.log; then
              echo 'DecorationsView still has compiler errors.' >&2
              exit 1
          fi
          echo 'DecorationsView primary-file typecheck passed with no errors.'

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/DecorationsView.swift
          git commit -m 'Fix Notch Ambient compiler errors'
          git push origin HEAD:main
