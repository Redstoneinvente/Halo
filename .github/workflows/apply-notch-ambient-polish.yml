name: Apply Notch Ambient Polish
on:
  push:
    branches: [chatgpt/notch-ambient-polish]
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, validate and publish polish
        shell: bash
        run: |
          set -euo pipefail
          cp .github/notch_ambient_polish_v2.py /tmp/notch_ambient_polish.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/notch_ambient_polish.py

          echo '=== Polish scope ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'Halo/Views/DecorationsView.swift'}
          if changed != expected:
              raise SystemExit(f'Unexpected polish scope: {sorted(changed)}')
          print('Notch Ambient polish scope verified.')
          PY

          git diff --check
          xcrun swiftc -parse Halo/Views/DecorationsView.swift

          echo '=== Interaction audit ==='
          grep -q 'case christmasOrnaments = "Christmas Ornaments"' Halo/Views/DecorationsView.swift
          grep -q 'static func placedNotch' Halo/Views/DecorationsView.swift
          grep -q 'let exponent = max(0.35' Halo/Views/DecorationsView.swift
          grep -q 'drawEdgeGlow.*cursor: cursor' Halo/Views/DecorationsView.swift
          grep -q 'ornaments: true' Halo/Views/DecorationsView.swift
          grep -q 'let interaction=cursorInfluence(cursor,point:center,settings:s).strength' Halo/Views/DecorationsView.swift
          grep -q 'let span = n.width.*s.spacing' Halo/Views/DecorationsView.swift
          grep -q 'let react=cursorInfluence(cursor,point:tip,settings:s)' Halo/Views/DecorationsView.swift
          echo 'Placement, cursor falloff, hanging variants, moss bending and portal proximity are wired.'

          echo '=== Xcode validation ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee /tmp/notch-ambient-polish-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if grep -E 'Halo/Views/DecorationsView\.swift:[0-9]+:[0-9]+: error:' /tmp/notch-ambient-polish-build.log; then
              echo 'Notch Ambient polish introduced a compiler error.' >&2
              exit 1
          fi
          if grep -q 'SwiftCompile.*DecorationsView.swift' /tmp/notch-ambient-polish-build.log; then
              echo 'Compiler reached DecorationsView.swift with no errors.'
          else
              echo 'Warning: build stopped before a dedicated DecorationsView compile line.'
          fi
          if [[ $build_status -ne 0 ]]; then
              echo 'Full target still has unrelated repository errors; Notch Ambient polish reported no compiler errors.'
              grep -E 'error:' /tmp/notch-ambient-polish-build.log | tail -n 20 || true
          else
              echo 'Full target build succeeded.'
          fi

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/DecorationsView.swift
          git commit -m 'Polish Notch Ambient interactions'
          git push origin HEAD:main
