name: Apply Notch Ambient Polish
on:
  push:
    branches: [chatgpt/notch-ambient-polish]
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, compile and publish Ambient repair
        shell: bash
        run: |
          set -euo pipefail
          cp .github/notch_ambient_compile_fix.py /tmp/notch_ambient_compile_fix.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/notch_ambient_compile_fix.py

          echo '=== Repair scope ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'Halo/Views/DecorationsView.swift'}
          if changed != expected:
              raise SystemExit(f'Unexpected repair scope: {sorted(changed)}')
          print('Notch Ambient repair scope verified.')
          PY

          git diff --check
          xcrun swiftc -parse Halo/Views/DecorationsView.swift

          echo '=== Xcode non-batch validation ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_BATCH_MODE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee /tmp/notch-ambient-compile-fix.log
          build_status=${PIPESTATUS[0]}
          set -e

          ambient_errors=$(grep -E 'Halo/Views/DecorationsView\.swift:[0-9]+:[0-9]+: error:' /tmp/notch-ambient-compile-fix.log || true)
          if [[ -n "$ambient_errors" ]]; then
              echo 'DecorationsView still has compiler errors.' >&2
              echo "$ambient_errors" >&2
              exit 1
          fi

          if grep -qE 'SwiftCompile normal arm64 .*DecorationsView\.swift|SwiftCompile normal arm64 /.*DecorationsView\.swift' /tmp/notch-ambient-compile-fix.log; then
              echo 'DecorationsView compiled independently with no errors.'
          else
              echo 'Non-batch build did not schedule DecorationsView before stopping.' >&2
              grep -E 'error:' /tmp/notch-ambient-compile-fix.log | tail -n 20 || true
              exit 1
          fi

          if [[ $build_status -ne 0 ]]; then
              echo 'Full target still has unrelated repository errors; DecorationsView is clean.'
              grep -E 'error:' /tmp/notch-ambient-compile-fix.log | tail -n 20 || true
          else
              echo 'Full target build succeeded.'
          fi

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/DecorationsView.swift
          git commit -m 'Fix Notch Ambient compiler errors'
          git push origin HEAD:main
