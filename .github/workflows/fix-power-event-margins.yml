name: Fix Power Event Margins

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-power-event-margins.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix_power_event_margins.py
      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'resolvedNotchMargin' Halo/Core/WidgetModels.swift
          grep -q 'Extra event space' Halo/Views/WidgetSettingsView.swift
          grep -q 'notchMargin: powerNotchMargin' Halo/Views/ClosedNotchView.swift
          grep -q 'power.notchMargin + power.badgeWidth + power.extraSpace' Halo/NotchEngine/WindowManager.swift
      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep -E 'error:' /tmp/halo-build.log | grep -v -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected build error(s):'
              echo "$unexpected"
              exit "$code"
            fi
            grep -q -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Views/WidgetSettingsView.swift Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: tighten power event sizing and margins'
          git push origin main
