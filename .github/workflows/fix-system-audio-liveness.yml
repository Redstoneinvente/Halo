name: Fix System Audio Liveness

on:
  push:
    branches: [main]
    paths:
      - '.github/system-audio-liveness-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply liveness fix
        run: python3 .github/scripts/fix-system-audio-liveness.py

      - name: Verify liveness contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Services/AudioSpectrumService.swift').read_text()
          w = Path('Halo/Core/WorkspaceStore.swift').read_text()
          required_s = [
              'var liveness: Double = 0',
              'smoothed.liveness = max(overall, mids * 0.82, bass * 0.62, treble * 0.68)'
          ]
          required_w = [
              'let audibleNow = pcmAudible',
              'if safariOutputActive && pcmAudible { lastSafariOutput = now }',
              'if safariOutput && pcmAudible { self.lastSafariOutput = now }',
              'return snapshot.liveness > (safariHint ? 0.016 : 0.040)'
          ]
          for token in required_s:
              if token not in s: raise SystemExit(f'Missing spectrum token: {token}')
          for token in required_w:
              if token not in w: raise SystemExit(f'Missing workspace token: {token}')
          if 'let audibleNow = safariOutputActive || pcmAudible' in w or 'let audibleNow = safariOutput || pcmAudible' in w:
              raise SystemExit('Safari process-output flag is still treated as audible audio')
          print('System Audio liveness contract passed')
          PY

      - name: Parse affected Swift files
        run: |
          xcrun swiftc -parse Halo/Services/AudioSpectrumService.swift
          xcrun swiftc -parse Halo/Core/WorkspaceStore.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-system-audio-liveness.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking changed files for compiler errors.'
            if grep -E '(WorkspaceStore|AudioSpectrumService)\.swift:.*error:' /tmp/halo-system-audio-liveness.log; then
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors; changed files emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceStore.swift Halo/Services/AudioSpectrumService.swift
          git rm -f .github/scripts/fix-system-audio-liveness.py .github/workflows/fix-system-audio-liveness.yml .github/system-audio-liveness-trigger.txt
          git commit -m 'Make System Audio CI stop on real silence'
          git pull --rebase origin main
          git push origin HEAD:main
