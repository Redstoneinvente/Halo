name: Patch runtime press license handling

on:
  push:
    paths:
      - '.github/workflows/patch-press-license-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch runtime manager
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          grep -q 'hasPrefix("PK_")' Halo/Core/AppStore.swift
          grep -q 'plan: "Press"' Halo/Core/AppStore.swift
          grep -q 'Press license activated on this Mac (test mode).' Halo/Core/AppStore.swift

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-press-license-runtime.yml
          git config user.name 'Halo Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add Halo/Core/AppStore.swift .github/workflows/patch-press-license-runtime.yml
          git commit -m 'Route press licenses through runtime license manager'
          git push origin HEAD:main
