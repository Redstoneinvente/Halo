name: Fix Clipboard CI Actor Isolation

on:
  push:
    paths:
      - '.github/clipboard-ci-actor-fix-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply actor isolation fix
        run: python3 scripts/fix_clipboard_ci_actor_isolation.py
      - name: Verify patch
        run: |
          grep -A2 -B1 '@MainActor' Halo/Views/SurfaceView.swift | grep 'closedPreferredWidth' >/dev/null
      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/SurfaceView.swift
          git commit -m 'Fix Clipboard CI main actor isolation'
          git pull --rebase origin main
          git push origin main
