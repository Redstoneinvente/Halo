name: Apply Halo Widget Size System

on:
  push:
    branches: [main]
    paths:
      - '.github/widget-size-system-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 8x4 widget size system
        run: python3 scripts/apply_widget_size_system.py

      - name: Verify canonical geometry and source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          models = Path('Halo/Core/WorkspaceModels.swift').read_text()
          widgets = Path('Halo/Core/WidgetModels.swift').read_text()
          adaptive = Path('Halo/Views/VisualWorkspaceAdaptiveWidgets.swift').read_text()
          required = [
              'case eightByFour = "8×4"',
              'var resolvedGridColumns: Int { min(8,',
              'var resolvedGridRows: Int { min(4,',
              'struct VisualWidgetFootprint:',
              'case .shelf: return ["files"]',
              'private struct VisualAdaptiveShelfView: View',
          ]
          haystack = models + widgets + adaptive
          missing = [item for item in required if item not in haystack]
          if missing:
              raise SystemExit('Missing widget-size contract: ' + ', '.join(missing))
          if 'grid(8, 6' in models:
              raise SystemExit('Legacy 8x6 workspace preset still present')
          PY

      - name: Parse changed Swift sources
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/VisualWorkspaceAdaptiveWidgets.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Core/WidgetModels.swift Halo/Views/VisualWorkspaceAdaptiveWidgets.swift Halo/Views/SurfaceView.swift Docs/WidgetCustomization.md
          git commit -m 'Implement complete 8x4 widget size system'
          git push origin HEAD:main

      - name: Full Xcode build diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-widget-size-build.log
