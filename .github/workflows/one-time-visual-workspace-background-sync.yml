name: One-time Visual Workspace Background Sync

on:
  push:
    paths:
      - 'Scripts/one_time_visual_workspace_background_sync.py'
      - '.github/workflows/one-time-visual-workspace-background-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply background sync
        run: python3 Scripts/one_time_visual_workspace_background_sync.py

      - name: Validate Swift syntax and structure
        run: |
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          git diff --check
          grep -q 'visualWorkspaceBackground' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Glass blur' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'let kind = b.wrappedValue.appearance.background' Halo/Views/WidgetSettingsView.swift
          grep -q 'glassStrengthLayer' Halo/Views/SurfaceView.swift

      - name: Require no compiler errors in changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 260 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceSettingsView|WidgetSettingsView|SurfaceView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in Visual Workspace background files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated existing failure; changed background files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift Halo/Views/WidgetSettingsView.swift Halo/Views/SurfaceView.swift
          git rm -f --ignore-unmatch Scripts/one_time_visual_workspace_background_sync.py
          git rm -f --ignore-unmatch .github/workflows/one-time-visual-workspace-background-sync.yml
          git commit -m 'Sync Visual Workspace background controls'
          git push origin HEAD:main
