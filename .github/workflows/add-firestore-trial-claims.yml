name: Add Firestore Trial Claims

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-firestore-trial-claims.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration
        run: python3 .github/scripts/add_firestore_trial_claims.py

      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'claimFirestoreTrial' Halo/Core/AppStore.swift
          grep -q 'firestore.googleapis.com/v1/projects' Halo/Core/AppStore.swift
          grep -q 'ALREADY_EXISTS' Halo/Core/AppStore.swift
          grep -q 'email_verified == true' firestore.rules
          grep -q 'allow update, delete: if false' firestore.rules
          grep -q 'firestore.rules' firebase.json

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' | grep -q .; then
              echo 'Unexpected build error(s):'
              grep -E 'error:' /tmp/halo-build.log
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add -A
          git commit -m 'feat: check Firestore before starting trials'
          git push origin main
