name: Add First Run Setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-first-run-setup.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply migration
        run: python3 .github/scripts/add_first_run_setup.py

      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'HaloFirstRunSetupView' Halo/App/HaloApp.swift
          grep -q 'forceSetupEveryLaunch = true' Halo/App/HaloApp.swift
          grep -q 'What do you mostly do on this Mac?' Halo/App/HaloApp.swift
          grep -q 'displayDrafts.count > 1' Halo/App/HaloApp.swift
          grep -q 'Halo Setup Profile' Halo/App/HaloApp.swift

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected build error(s):'
              echo "$unexpected"
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/App/HaloApp.swift
          git commit -m 'feat: add first-run Halo setup experience'
          git push origin main
