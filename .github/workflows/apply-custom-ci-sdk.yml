name: Apply Custom CI SDK

on:
  push:
    branches: [main]
    paths:
      - '.github/custom-ci-sdk-trigger.txt'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patch script
        shell: bash
        run: |
          : > /tmp/apply_custom_ci.py
          for part in $(find scripts/custom-ci-patch -type f -name 'part*' | sort); do
            perl -0pe 's/\n\z//' "$part" >> /tmp/apply_custom_ci.py
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/apply_custom_ci.py')
          lines = path.read_text().splitlines()
          repaired = []
          changed = 0
          start = re.compile(r"^([A-Z][A-Z0-9_]*) = '")
          for index, line in enumerate(lines, 1):
              match = start.match(line)
              if not match:
                  repaired.append(line)
                  continue
              first = line.find("'", match.end() - 1)
              last = line.rfind("'")
              if first < 0 or last <= first:
                  raise SystemExit(f'Could not identify staged literal boundaries on line {index}: {line[:80]!r}')
              tail = line[last + 1:]
              if tail.strip():
                  raise SystemExit(f'Unexpected staged literal suffix on line {index}: {tail!r}')
              repaired.append(line[:first] + '"' + line[first + 1:last] + '"' + tail)
              changed += 1
              print(f'Repaired {match.group(1)} ({len(line):,} characters)')
          path.write_text('\n'.join(repaired) + '\n')
          print(f'Repaired {changed} staged source literals total')
          if changed == 0:
              print('First physical lines:')
              for index, line in enumerate(lines[:8], 1):
                  print(index, repr(line[:100]), '...', repr(line[-40:]), len(line))
              raise SystemExit('No staged source literals were repaired')
          PY

          python3 -m py_compile /tmp/apply_custom_ci.py

      - name: Apply Custom CI SDK
        run: python3 /tmp/apply_custom_ci.py

      - name: Verify required Custom CI UX
        shell: bash
        run: |
          grep -q 'Disable custom CI' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Import .haloCI' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloCustomCIRuntimeStore' Halo/Core/WorkspaceStore.swift
          grep -q 'HaloCIPackageValidator' Halo/Core/WorkspaceModels.swift
          grep -q 'custom' Halo/Views/SurfaceView.swift
          test -f Examples/HelloWorld.haloCI/manifest.json
          test -f Examples/HelloWorld.haloCI/interface.json

      - name: Run Swift package tests
        run: swift test

      - name: Build Halo
        shell: bash
        run: |
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Remove temporary patch staging
        shell: bash
        run: |
          rm -rf scripts/custom-ci-patch
          rm -f .github/custom-ci-sdk-trigger.txt
          rm -f .github/workflows/apply-custom-ci-sdk.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add declarative Custom CI SDK and import flow'
          git pull --rebase origin main
          git push origin HEAD:main
