name: Apply Custom CI SDK

on:
  push:
    branches: [main]
    paths:
      - '.github/custom-ci-sdk-trigger.txt'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patch script
        shell: bash
        run: |
          : > /tmp/apply_custom_ci.raw
          for part in $(find scripts/custom-ci-patch -type f -name 'part*' | sort); do
            # Each staged chunk acquired one separator newline. The chunks themselves
            # already encode intended generator newlines as literal \n sequences.
            perl -0pe 's/\n\z//' "$part" >> /tmp/apply_custom_ci.raw
          done

          # Decode literal \n sequences ONLY while outside Python string literals.
          # Payload strings keep their escaped newlines exactly as authored.
          python3 - <<'PY'
          from pathlib import Path

          raw = Path('/tmp/apply_custom_ci.raw').read_text()
          out = []
          quote = None
          escaped = False
          decoded = 0
          i = 0
          while i < len(raw):
              ch = raw[i]
              if quote is not None:
                  out.append(ch)
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == quote:
                      quote = None
                  i += 1
                  continue

              if ch in ("'", '"'):
                  quote = ch
                  out.append(ch)
                  i += 1
                  continue

              if ch == '\\' and i + 1 < len(raw) and raw[i + 1] == 'n':
                  out.append('\n')
                  decoded += 1
                  i += 2
                  continue

              out.append(ch)
              i += 1

          if quote is not None:
              raise SystemExit(f'Unterminated staged Python string ({quote})')
          repaired = ''.join(out)
          Path('/tmp/apply_custom_ci.py').write_text(repaired)
          print(f'Decoded {decoded} generator line breaks outside payload strings')
          if decoded == 0:
              raise SystemExit('No encoded generator line breaks found')
          PY

          python3 -m py_compile /tmp/apply_custom_ci.py

      - name: Apply Custom CI SDK
        run: python3 /tmp/apply_custom_ci.py

      - name: Verify required Custom CI UX
        shell: bash
        run: |
          grep -q 'Disable custom CI' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Import .haloCI' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloCustomCIRuntimeStore' Halo/Core/WorkspaceStore.swift
          grep -q 'HaloCIPackageValidator' Halo/Core/WorkspaceModels.swift
          grep -q 'custom' Halo/Views/SurfaceView.swift
          test -f Examples/HelloWorld.haloCI/manifest.json
          test -f Examples/HelloWorld.haloCI/interface.json

      - name: Run Swift package tests
        run: swift test

      - name: Build Halo
        shell: bash
        run: |
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Remove temporary patch staging
        shell: bash
        run: |
          rm -rf scripts/custom-ci-patch
          rm -f .github/custom-ci-sdk-trigger.txt
          rm -f .github/workflows/apply-custom-ci-sdk.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add declarative Custom CI SDK and import flow'
          git pull --rebase origin main
          git push origin HEAD:main
