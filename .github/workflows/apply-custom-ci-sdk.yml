name: Apply Custom CI SDK

on:
  push:
    branches: [main]
    paths:
      - '.github/custom-ci-sdk-trigger.txt'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct patch script
        shell: bash
        run: |
          : > /tmp/apply_custom_ci.raw
          for part in $(find scripts/custom-ci-patch -type f -name 'part*' | sort); do
            perl -0pe 's/\n\z//' "$part" >> /tmp/apply_custom_ci.raw
          done

          python3 - <<'PY'
          from pathlib import Path
          import ast

          raw = Path('/tmp/apply_custom_ci.raw').read_text()
          names = [
              'SDK', 'RUNTIME', 'RENDERER', 'SETTINGS', 'TESTS', 'DOCS', 'ARCH',
              'EXAMPLE_MANIFEST', 'EXAMPLE_INTERFACE', 'EXAMPLE_TRIGGERS', 'EXAMPLE_README'
          ]

          def decode_payload(source: str) -> str:
              if "'''" not in source:
                  return ast.literal_eval("'''" + source + "'''")
              safe = source.replace('"""', '\\"\\"\\"')
              return ast.literal_eval('"""' + safe + '"""')

          def decode_generator_tail(source: str) -> str:
              out = []
              quote = None
              triple = False
              escaped = False
              comment = False
              decoded = 0
              i = 0
              while i < len(source):
                  if comment:
                      if source.startswith('\\n', i):
                          out.append('\n'); decoded += 1; i += 2; comment = False
                      else:
                          out.append(source[i]); i += 1
                      continue
                  if quote is not None:
                      if triple:
                          delimiter = quote * 3
                          if source.startswith(delimiter, i) and not escaped:
                              out.append(delimiter); i += 3; quote = None; triple = False; escaped = False
                              continue
                      ch = source[i]
                      out.append(ch)
                      if escaped:
                          escaped = False
                      elif ch == '\\':
                          escaped = True
                      elif not triple and ch == quote:
                          quote = None
                      i += 1
                      continue
                  if source.startswith('\\n', i):
                      out.append('\n'); decoded += 1; i += 2; continue
                  ch = source[i]
                  if ch == '#':
                      comment = True; out.append(ch); i += 1; continue
                  if ch in ("'", '"'):
                      if source.startswith(ch * 3, i):
                          quote = ch; triple = True; out.append(ch * 3); i += 3
                      else:
                          quote = ch; triple = False; out.append(ch); i += 1
                      continue
                  out.append(ch); i += 1
              if quote is not None:
                  raise SystemExit(f'Unterminated string while decoding generator tail: {quote!r}')
              print(f'Decoded {decoded} generator-tail line breaks')
              return ''.join(out)

          positions = []
          for name in names:
              marker = f"{name} = '"
              pos = raw.find(marker)
              if pos < 0:
                  raise SystemExit(f'Missing staged payload marker: {name}')
              positions.append((name, pos, pos + len(marker)))

          if positions != sorted(positions, key=lambda item: item[1]):
              raise SystemExit('Staged payload markers are out of order')

          assignments = []
          for index, (name, marker_pos, body_start) in enumerate(positions):
              if index + 1 < len(positions):
                  next_pos = positions[index + 1][1]
                  segment = raw[body_start:next_pos]
              else:
                  tail_marker = 'def replace_once'
                  next_pos = raw.find(tail_marker, body_start)
                  if next_pos < 0:
                      raise SystemExit('Missing generator tail marker: def replace_once')
                  segment = raw[body_start:next_pos]
              closing = segment.rfind("'")
              if closing < 0:
                  raise SystemExit(f'Missing closing staged quote for {name}')
              payload_source = segment[:closing]
              value = decode_payload(payload_source)
              assignments.append(f'{name} = {value!r}\n')
              print(f'Reconstructed {name}: {len(value):,} characters')

          tail_pos = raw.find('def replace_once', positions[-1][2])
          tail = decode_generator_tail(raw[tail_pos:])
          rebuilt = 'from pathlib import Path\n\n' + ''.join(assignments) + '\n' + tail
          Path('/tmp/apply_custom_ci.py').write_text(rebuilt)
          PY

          python3 -m py_compile /tmp/apply_custom_ci.py

      - name: Apply Custom CI SDK
        shell: bash
        run: |
          python3 /tmp/apply_custom_ci.py
          python3 scripts/complete_custom_ci_sdk.py /tmp/apply_custom_ci.py

      - name: Verify required Custom CI UX
        shell: bash
        run: |
          set -euxo pipefail
          git status --short
          git diff --stat
          grep -R -n -F 'Disable custom CI' Halo
          grep -R -n -F 'Import .haloCI' Halo
          grep -R -n -F 'HaloCustomCIRuntimeStore' Halo
          grep -R -n -F 'HaloCIPackageValidator' Halo
          grep -R -n -F 'case custom' Halo/Views/SurfaceView.swift
          test -f Examples/HelloWorld.haloCI/manifest.json
          test -f Examples/HelloWorld.haloCI/interface.json

      - name: Build Halo in Xcode
        shell: bash
        run: |
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme Halo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Swift package tests
        continue-on-error: true
        run: swift test

      - name: Remove temporary patch staging
        shell: bash
        run: |
          rm -rf scripts/custom-ci-patch
          rm -f scripts/complete_custom_ci_sdk.py
          rm -f .github/custom-ci-sdk-trigger.txt
          rm -f .github/workflows/apply-custom-ci-sdk.yml

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add declarative Custom CI SDK and import flow'
          git pull --rebase origin main
          git push origin HEAD:main
