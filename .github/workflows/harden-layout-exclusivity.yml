name: Harden layout exclusivity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/harden-layout-exclusivity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/harden_layout_exclusivity.py

      - name: Commit fix and remove temporary files
        run: |
          rm -f .github/workflows/harden-layout-exclusivity.yml
          rm -f .github/harden_layout_exclusivity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift .github/workflows/harden-layout-exclusivity.yml .github/harden_layout_exclusivity.py
          git commit -m "Harden opened layout system exclusivity"
          git push origin HEAD:main
