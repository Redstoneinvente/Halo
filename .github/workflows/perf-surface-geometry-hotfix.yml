name: Lock Screen Presence Delivery Repair

on:
  push:
    paths:
      - '.github/workflows/perf-surface-geometry-hotfix.yml'

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair Lock Screen Presence delivery
        shell: python
        run: |
          from pathlib import Path
          path = Path('Halo/NotchEngine/WindowManager.swift')
          text = path.read_text()

          replacements = [
              (
                  '    private var lockScreenPresenceRefreshWork: DispatchWorkItem?\n    private var lastLockScreenPresenceSignature = ""\n',
                  '    private var lockScreenPresenceRefreshWork: DispatchWorkItem?\n    private var lockScreenPresenceReadyAt = Date.distantPast\n    private var lastLockScreenPresenceSignature = ""\n',
                  'presence ready state'
              ),
              (
                  '        lockScreenSessionSuspended = true\n        lockScreenUnlockWork?.cancel()\n',
                  '        lockScreenSessionSuspended = true\n        // Keep every notification refresh out of the desktop -> secure-session handoff.\n        // The notification daemon can then present it after the Lock Screen is actually visible.\n        lockScreenPresenceReadyAt = Date().addingTimeInterval(1.0)\n        lockScreenUnlockWork?.cancel()\n',
                  'lock handoff readiness'
              ),
              (
                  '        lockScreenSessionSuspended = false\n        clearLockScreenPresence()\n',
                  '        lockScreenSessionSuspended = false\n        lockScreenPresenceReadyAt = .distantPast\n        clearLockScreenPresence()\n',
                  'unlock readiness reset'
              ),
              (
                  '''    private func refreshLockScreenPresenceIfNeeded(force: Bool = false, preview: Bool = false) {\n        let preferences = LockScreenPresencePreferences.current()\n        guard preferences.enabled else {\n            clearLockScreenPresence()\n            return\n        }\n        guard preview || lockScreenSessionSuspended else { return }\n\n        UNUserNotificationCenter.current().getNotificationSettings { [weak self] settings in\n            let authorized = settings.authorizationStatus == .authorized || settings.authorizationStatus == .provisional\n            guard authorized else { return }\n            Task { @MainActor [weak self] in\n                self?.deliverLockScreenPresence(preferences: preferences, force: force, preview: preview)\n            }\n        }\n    }\n\n    private func deliverLockScreenPresence(\n        preferences: LockScreenPresencePreferences,\n        force: Bool,\n        preview: Bool\n    ) {''',
                  '''    private func refreshLockScreenPresenceIfNeeded(force: Bool = false, preview: Bool = false) {\n        let preferences = LockScreenPresencePreferences.current()\n        guard preferences.enabled else {\n            clearLockScreenPresence()\n            return\n        }\n        guard preview || lockScreenSessionSuspended else { return }\n\n        let deliveryDelay = preview ? 0 : max(0, lockScreenPresenceReadyAt.timeIntervalSinceNow)\n        UNUserNotificationCenter.current().getNotificationSettings { [weak self] settings in\n            let authorized = settings.authorizationStatus == .authorized || settings.authorizationStatus == .provisional\n            let lockScreenAllowed = settings.lockScreenSetting == .enabled\n            guard authorized, preview || lockScreenAllowed else { return }\n            Task { @MainActor [weak self] in\n                self?.deliverLockScreenPresence(\n                    preferences: preferences,\n                    force: force,\n                    preview: preview,\n                    deliveryDelay: deliveryDelay\n                )\n            }\n        }\n    }\n\n    private func deliverLockScreenPresence(\n        preferences: LockScreenPresencePreferences,\n        force: Bool,\n        preview: Bool,\n        deliveryDelay: TimeInterval\n    ) {''',
                  'permission and delayed delivery flow'
              ),
              (
                  '''        center.add(UNNotificationRequest(\n            identifier: Self.lockScreenPresenceNotificationID,\n            content: content,\n            trigger: nil\n        ))''',
                  '''        let trigger: UNNotificationTrigger?\n        if deliveryDelay > 0 {\n            trigger = UNTimeIntervalNotificationTrigger(\n                timeInterval: max(0.1, deliveryDelay),\n                repeats: false\n            )\n        } else {\n            trigger = nil\n        }\n        center.add(UNNotificationRequest(\n            identifier: Self.lockScreenPresenceNotificationID,\n            content: content,\n            trigger: trigger\n        ))''',
                  'notification trigger'
              )
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Parse WindowManager
        run: xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift

      - name: Typecheck notification APIs
        run: |
          cat > /tmp/HaloLockScreenNotificationProbe.swift <<'EOF'
          import Foundation
          import UserNotifications

          func probe(_ settings: UNNotificationSettings) {
              _ = settings.lockScreenSetting == .enabled
              let trigger: UNNotificationTrigger = UNTimeIntervalNotificationTrigger(timeInterval: 1.0, repeats: false)
              _ = trigger
          }
          EOF
          xcrun swiftc -typecheck -target arm64-apple-macos13.0 /tmp/HaloLockScreenNotificationProbe.swift

      - name: Validate patch
        run: |
          git diff --check
          grep -q 'lockScreenPresenceReadyAt' Halo/NotchEngine/WindowManager.swift
          grep -q 'lockScreenSetting == .enabled' Halo/NotchEngine/WindowManager.swift
          grep -q 'UNTimeIntervalNotificationTrigger' Halo/NotchEngine/WindowManager.swift

      - name: Commit repair and restore original workflow
        run: |
          git show f160df00d8615f5dbf5f64cec503e9608c18817f:.github/workflows/perf-surface-geometry-hotfix.yml > .github/workflows/perf-surface-geometry-hotfix.yml
          rm -f .github/LOCKSCREEN_FIX_BACKUP_REF.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/NotchEngine/WindowManager.swift .github/workflows/perf-surface-geometry-hotfix.yml
          git rm -f --ignore-unmatch .github/LOCKSCREEN_FIX_BACKUP_REF.txt
          git commit -m "Fix Lock Screen Presence delivery timing [skip ci]"
          git push origin HEAD:main
