name: Add Transfer CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Finalize Notch Skins cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore maintenance workflows and remove helpers
        run: |
          set -e
          git show d78495b975654d09a2a700ec81d1886b4a420680:.github/workflows/add-transfer-ci.yml > .github/workflows/add-transfer-ci.yml
          git show 11abf796823d5c1497aebcb49a070d33d68eac1e:.github/workflows/fix-pixel-pet-cookie-rescue-workflow.yml > .github/workflows/fix-pixel-pet-cookie-rescue-workflow.yml
          rm -f .github/scripts/add-notch-skins.py
          rm -f .github/scripts/fix-notch-skins-build.py
          rm -f .github/workflows/add-notch-skins.yml
          rm -f .github/notch-skins-trigger.txt

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github
          git commit -m 'Clean up Notch Skins maintenance files'
          git pull --rebase origin main
          git push origin HEAD:main
