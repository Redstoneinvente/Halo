name: Add Transfer CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix closed notch widget centering and scaling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/ClosedNotchView.swift')
          s = p.read_text()

          replacements = [
              (
                  '.frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: side == .left ? .trailing : .leading)\n        .padding(.vertical, layoutMetrics.verticalPadding)',
                  '.frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: .center)\n        .padding(.vertical, layoutMetrics.verticalPadding)'
              ),
              (
                  'HStack(spacing: elementSpacing) { standardElements }\n            .frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: side == .left ? .trailing : .leading)',
                  'HStack(spacing: elementSpacing) { standardElements }\n            .frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: .center)'
              ),
              (
                  '                .frame(\n                    width: CGFloat(widgetContentWidth),\n                    height: CGFloat(widgetContentHeight)\n                )\n                .clipped()',
                  '                .frame(\n                    maxWidth: CGFloat(widgetContentWidth),\n                    maxHeight: CGFloat(widgetContentHeight),\n                    alignment: .center\n                )\n                .clipped()'
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          s = s.replace(
              '// Give the compact clock the exact slot proposal. Its internal compact\n                // layout can now shrink as a last resort when the display edge prevents\n                // the notch from growing any farther.',
              '// Keep the clock centered inside the adaptive slot while allowing\n                // its real typography to grow with the configured widget text size.',
              1
          )

          p.write_text(s)
          PY

      - name: Parse repaired Swift source
        run: xcrun swiftc -parse Halo/Views/ClosedNotchView.swift

      - name: Restore one-shot workflows and commit source fix
        run: |
          git checkout 2eca2ecf159159cd301bd14e5094a638b0df1fbe -- .github/workflows/add-transfer-ci.yml .github/workflows/apply-micro-widget-design.yml .github/micro-widget-design-trigger.txt
          rm -f .github/workflows/fix-closed-notch-widget-layout.yml
          rm -f .github/fix-closed-notch-widget-layout-trigger.txt
          rm -f .github/closed-notch-active-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift .github/workflows/add-transfer-ci.yml .github/workflows/apply-micro-widget-design.yml .github/micro-widget-design-trigger.txt .github/workflows/fix-closed-notch-widget-layout.yml .github/fix-closed-notch-widget-layout-trigger.txt .github/closed-notch-active-trigger.txt
          git commit -m 'Fix closed notch widget centering and scaling'
          git push origin HEAD:main

      - name: Full build diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-build.log
