name: Repair Closed Notch Clock Typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Prepare closed notch clock typography repair'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make closed clock sizing authoritative
        run: |
          python3 <<'PY'
          from pathlib import Path

          closed = Path('Halo/Views/ClosedNotchView.swift')
          s = closed.read_text()
          old = '''        if itemStyle.fontSize != nil {
              value.clock.automaticTypography = false
          }
          '''
          new = '''        // Closed-notch sizing is authoritative, whether it comes from the
          // global closed-notch font size or a widget-specific override.
          value.clock.automaticTypography = false
          '''
          if s.count(old) != 1:
              raise SystemExit(f'ClosedNotchView expected one typography gate, found {s.count(old)}')
          closed.write_text(s.replace(old, new, 1))

          manager = Path('Halo/NotchEngine/WindowManager.swift')
          s = manager.read_text()

          old = '                if style.fontSize != nil { clock.automaticTypography = false }'
          new = '                clock.automaticTypography = false'
          if s.count(old) != 1:
              raise SystemExit(f'WindowManager preferred-height gate expected once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                if closedClockStyle.fontSize != nil {
                      style.clock.automaticTypography = false
                  }
          '''
          new = '''                style.clock.automaticTypography = false
          '''
          if s.count(old) != 1:
              raise SystemExit(f'WindowManager dynamic-width gate expected once, found {s.count(old)}')
          manager.write_text(s.replace(old, new, 1))
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Views/ClosedNotchView.swift
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift

      - name: Restore workflow and push fix
        run: |
          git checkout HEAD^ -- .github/workflows/add-transfer-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift .github/workflows/add-transfer-ci.yml
          git commit -m 'Fix closed clock font sizing contract'
          git push origin HEAD:main
