name: Repair Closed Notch Clock Typography

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Prepare closed notch clock typography repair'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make closed clock sizing authoritative
        run: |
          python3 <<'PY'
          from pathlib import Path

          def indent_of(line):
              return line[:len(line) - len(line.lstrip())]

          closed = Path('Halo/Views/ClosedNotchView.swift')
          lines = closed.read_text().splitlines(keepends=True)
          replacements = 0
          out = []
          i = 0
          while i < len(lines):
              if (
                  i + 2 < len(lines)
                  and lines[i].strip() == 'if itemStyle.fontSize != nil {'
                  and lines[i + 1].strip() == 'value.clock.automaticTypography = false'
                  and lines[i + 2].strip() == '}'
              ):
                  indent = indent_of(lines[i])
                  out.append(indent + '// Closed-notch sizing is authoritative, whether it comes from the\n')
                  out.append(indent + '// global closed-notch font size or a widget-specific override.\n')
                  out.append(indent + 'value.clock.automaticTypography = false\n')
                  replacements += 1
                  i += 3
                  continue
              out.append(lines[i])
              i += 1
          if replacements != 1:
              raise SystemExit(f'ClosedNotchView expected one typography gate, found {replacements}')
          closed.write_text(''.join(out))

          manager = Path('Halo/NotchEngine/WindowManager.swift')
          lines = manager.read_text().splitlines(keepends=True)
          single_replacements = 0
          block_replacements = 0
          out = []
          i = 0
          while i < len(lines):
              stripped = lines[i].strip()
              if stripped == 'if style.fontSize != nil { clock.automaticTypography = false }':
                  indent = indent_of(lines[i])
                  out.append(indent + 'clock.automaticTypography = false\n')
                  single_replacements += 1
                  i += 1
                  continue
              if (
                  i + 2 < len(lines)
                  and stripped == 'if closedClockStyle.fontSize != nil {'
                  and lines[i + 1].strip() == 'style.clock.automaticTypography = false'
                  and lines[i + 2].strip() == '}'
              ):
                  indent = indent_of(lines[i])
                  out.append(indent + 'style.clock.automaticTypography = false\n')
                  block_replacements += 1
                  i += 3
                  continue
              out.append(lines[i])
              i += 1
          if single_replacements != 1:
              raise SystemExit(f'WindowManager preferred-height gate expected once, found {single_replacements}')
          if block_replacements != 1:
              raise SystemExit(f'WindowManager dynamic-width gate expected once, found {block_replacements}')
          manager.write_text(''.join(out))
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Views/ClosedNotchView.swift
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift

      - name: Restore workflow and push fix
        run: |
          git checkout 67d75755c5319540ac18968e4a560d3502886c42 -- .github/workflows/add-transfer-ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift .github/workflows/add-transfer-ci.yml
          git commit -m 'Fix closed clock font sizing contract'
          git push origin HEAD:main
