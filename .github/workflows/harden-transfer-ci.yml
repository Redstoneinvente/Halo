name: Harden Transfer CI

on:
  push:
    paths:
      - '.github/harden-transfer-ci-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Transfer CI sizing hardening
        run: python3 scripts/harden_transfer_ci_sizing.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift Halo/NotchEngine/WindowManager.swift
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Harden Transfer CI customization and adaptive sizing"
          git push
