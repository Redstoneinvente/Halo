name: Repair Micro Widget Build

on:
  push:
    branches: [main]
    paths:
      - '.github/micro-widget-design-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair micro widget compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Halo/Views/VisualWorkspaceAdaptiveWidgets.swift')
          s = p.read_text()

          replacements = {
              'ForEach(orderedMetrics.prefix(8)) { item in': 'ForEach(Array(orderedMetrics.prefix(8).enumerated()), id: \\.offset) { _, item in',
              'Text(itemValue.value).monospacedDigit().foregroundStyle(.secondary)': 'Text(itemValue.text).monospacedDigit().foregroundStyle(.secondary)',
              'micro(region: true)': 'captureMicroVisual',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected source: {old}')
              s = s.replace(old, new, 1)

          anchor = '    private var compactActions: some View { HStack(spacing: context.spacing) { captureButton; ocrButton }.disabled(service.busy) }'
          micro = '''    private var captureMicroVisual: some View {
              let region = context.settings.capturePrimaryAction == .region
              return ZStack {
                  RoundedRectangle(cornerRadius: 13, style: .continuous)
                      .fill(style.accentColor.color.opacity(0.055))
                  RoundedRectangle(cornerRadius: 13, style: .continuous)
                      .stroke(style.accentColor.color.opacity(0.42), style: StrokeStyle(lineWidth: 1, dash: [4, 3]))
                  VStack(spacing: 4) {
                      if service.busy {
                          ProgressView().controlSize(.small)
                      } else {
                          Image(systemName: region ? "viewfinder" : "text.viewfinder")
                              .font(.system(size: 22, weight: .semibold))
                              .foregroundStyle(style.accentColor.color)
                      }
                      Text(region ? "CAPTURE" : "OCR")
                          .font(.system(size: 7, weight: .bold, design: .rounded))
                          .foregroundStyle(.secondary)
                  }
              }
              .padding(3)
          }

'''
          if anchor not in s:
              raise SystemExit('Missing capture insertion anchor')
          s = s.replace(anchor, micro + anchor, 1)
          p.write_text(s)
          PY

      - name: Parse repaired Swift source
        run: xcrun swiftc -parse Halo/Views/VisualWorkspaceAdaptiveWidgets.swift

      - name: Build Halo strictly
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-build.log

      - name: Commit compile fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/VisualWorkspaceAdaptiveWidgets.swift
          git commit -m 'Fix deliberate 1x1 widget compile errors'
          git push origin HEAD:main
