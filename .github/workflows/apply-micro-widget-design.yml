name: Repair Micro Widget Build

on:
  push:
    branches: [main]
    paths:
      - '.github/micro-widget-design-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix closed notch widget centering and scaling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/ClosedNotchView.swift')
          s = p.read_text()

          replacements = [
              (
                  '.frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: side == .left ? .trailing : .leading)\n        .padding(.vertical, layoutMetrics.verticalPadding)',
                  '.frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: .center)\n        .padding(.vertical, layoutMetrics.verticalPadding)'
              ),
              (
                  'HStack(spacing: elementSpacing) { standardElements }\n            .frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: side == .left ? .trailing : .leading)',
                  'HStack(spacing: elementSpacing) { standardElements }\n            .frame(maxWidth: .infinity, maxHeight: innerHeight, alignment: .center)'
              ),
              (
                  '''                // Give the compact clock the exact slot proposal. Its internal compact
                // layout can now shrink as a last resort when the display edge prevents
                // the notch from growing any farther.
                .frame(
                    width: CGFloat(widgetContentWidth),
                    height: CGFloat(widgetContentHeight)
                )
                .clipped()''',
                  '''                // Keep the clock centered inside the adaptive slot while allowing
                // its real typography to grow with the configured widget text size.
                .frame(
                    maxWidth: CGFloat(widgetContentWidth),
                    maxHeight: CGFloat(widgetContentHeight),
                    alignment: .center
                )
                .clipped()'''
              ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:90]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Parse repaired Swift source
        run: xcrun swiftc -parse Halo/Views/ClosedNotchView.swift

      - name: Restore repair workflow and commit source fix
        run: |
          git checkout 2eca2ecf159159cd301bd14e5094a638b0df1fbe -- .github/workflows/apply-micro-widget-design.yml .github/micro-widget-design-trigger.txt
          rm -f .github/workflows/fix-closed-notch-widget-layout.yml
          rm -f .github/fix-closed-notch-widget-layout-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift .github/workflows/apply-micro-widget-design.yml .github/micro-widget-design-trigger.txt .github/workflows/fix-closed-notch-widget-layout.yml .github/fix-closed-notch-widget-layout-trigger.txt
          git commit -m 'Fix closed notch widget centering and scaling'
          git push origin HEAD:main

      - name: Full build diagnostic
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-build.log
