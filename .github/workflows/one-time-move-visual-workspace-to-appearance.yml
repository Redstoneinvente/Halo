name: One-time Opened Space Appearance Migration

on:
  push:
    paths:
      - 'Scripts/one_time_move_visual_workspace_to_appearance.py'
      - '.github/workflows/one-time-move-visual-workspace-to-appearance.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move workspace controls into Appearance
        run: python3 Scripts/one_time_move_visual_workspace_to_appearance.py

      - name: Validate Swift syntax and diff
        run: |
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check

      - name: Build and require no changed-file compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 240 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceSettingsView|WidgetSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in opened-space appearance files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated existing failure; changed appearance files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift Halo/Views/WidgetSettingsView.swift
          git rm Scripts/one_time_move_visual_workspace_to_appearance.py
          git rm .github/workflows/one-time-move-visual-workspace-to-appearance.yml
          git commit -m 'Move visual workspace controls into Appearance'
          git push origin HEAD:main
