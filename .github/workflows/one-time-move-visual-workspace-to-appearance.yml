name: One-time Opened Space Appearance Migration

on:
  push:
    paths:
      - 'Scripts/one_time_move_visual_workspace_to_appearance.py'
      - '.github/workflows/one-time-move-visual-workspace-to-appearance.yml'
      - '.github/trigger-opened-space'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move workspace controls into Appearance
        run: python3 Scripts/one_time_move_visual_workspace_to_appearance.py
      - name: Validate patch structure
        run: |
          git diff --check
          grep -q 'case openedSpace = "Opened Space"' Halo/Views/WorkspaceSettingsView.swift
          grep -q '@State private var page: HaloAppearancePage = .openedSpace' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Picker("Layout system"' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Picker("Space behavior"' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'Open Visual Workspace Editor' Halo/Views/WorkspaceSettingsView.swift
          ! grep -q 'Use Custom Workspace Layout' Halo/Views/WidgetSettingsView.swift
          grep -q '^struct OpenedNotchWorkspaceEditor: View' Halo/Views/WidgetSettingsView.swift
      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift Halo/Views/WidgetSettingsView.swift
          git rm -f --ignore-unmatch Scripts/one_time_move_visual_workspace_to_appearance.py
          git rm -f --ignore-unmatch .github/workflows/one-time-move-visual-workspace-to-appearance.yml
          git rm -f --ignore-unmatch .github/workflows/one-time-move-visual-workspace-fast.yml
          git rm -f --ignore-unmatch .github/trigger-opened-space
          git commit -m 'Move visual workspace controls into Appearance'
          git push origin HEAD:main
