name: Finalize Pixel Pal Square Sizing

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-pixel-pal-square.yml'
      - '.github/scripts/finalize_pixel_pal_square.py'
      - '.github/pixel-pal-square-trigger.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce square-only Pixel Pal footprints
        run: python3 .github/scripts/finalize_pixel_pal_square.py

      - name: Parse Pixel Pal source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit verified square-only integration
        run: |
          rm -f .github/workflows/finalize-pixel-pal-square.yml
          rm -f .github/scripts/finalize_pixel_pal_square.py
          rm -f .github/pixel-pal-square-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce square-only Pixel Pal sizing'
          git push origin HEAD:main
