name: Fix CI Surface Ownership

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run CI surface ownership repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply CI ownership repair
        run: python3 scripts/fix_ci_surface_ownership.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift
          git commit -m "Make Context Interfaces own the notch surface"
          git push origin main
