name: Validate Bluetooth device icons
on:
  push:
    branches: [main, codex/bluetooth-device-icons]
    paths:
      - 'Halo/Core/PersonalizationModels.swift'
      - 'Halo/Core/WorkspaceModels.swift'
      - 'Halo/Core/WorkspaceStore.swift'
      - 'Halo/Views/ClosedNotchView.swift'
      - 'Halo/Views/SurfaceView.swift'
      - 'Tests/HaloCoreTests.swift'
      - '.github/workflows/validate-bluetooth-icons.yml'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Halo
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build test
