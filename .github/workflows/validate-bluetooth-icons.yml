name: Validate Bluetooth device icons
on:
  push:
    branches: [main, codex/bluetooth-device-icons]
    paths:
      - 'Halo/Core/PersonalizationModels.swift'
      - 'Halo/Core/WorkspaceModels.swift'
      - 'Halo/Core/WorkspaceStore.swift'
      - 'Halo/Views/ClosedNotchView.swift'
      - 'Halo/Views/SurfaceView.swift'
      - 'Tests/HaloCoreTests.swift'
      - '.github/workflows/validate-bluetooth-icons.yml'
      - 'Scripts/validate_bluetooth_icons.py'
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile Bluetooth production code and run regression tests
        run: python3 Scripts/validate_bluetooth_icons.py
      - name: Build and test Halo
        id: full
        if: always()
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build test
      - name: Compare unchanged baseline when full build fails
        if: failure() && steps.full.outcome == 'failure'
        run: |
          git fetch --depth=1 origin 08ea78dfef2a16243689cda979fc26838a45bffb
          git worktree add /tmp/halo-baseline 08ea78dfef2a16243689cda979fc26838a45bffb
          cd /tmp/halo-baseline
          xcodebuild -quiet -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
