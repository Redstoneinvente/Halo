name: One-time Widget Aesthetic Calendar Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-widget-aesthetic-calendar.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply widget polish
        run: python3 Scripts/one_time_widget_aesthetic_calendar.py

      - name: Validate Swift syntax and patch structure
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Services/Integrations.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check
          grep -q 'if let openNotch { return openNotch }' Halo/Core/WorkspaceModels.swift
          grep -q 'enum CalendarWidgetViewStyle' Halo/Core/WidgetModels.swift
          grep -q 'case split = "Split"' Halo/Core/WidgetModels.swift
          grep -q 'private var miniMonth' Halo/Views/ModuleViews.swift
          grep -q 'This workspace is intentionally empty' Halo/Views/WidgetSettingsView.swift

      - name: Require no compiler errors in changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-widget-build.log 2>&1
          status=$?
          set -e
          tail -n 320 /tmp/halo-widget-build.log
          if grep -E '(^|/)(WorkspaceModels|WidgetModels|Integrations|SurfaceView|ModuleViews|WidgetSettingsView)\.swift:.*error:' /tmp/halo-widget-build.log; then
            echo 'Compiler error found in widget/calendar files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated failure; changed widget/calendar files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Core/WidgetModels.swift Halo/Services/Integrations.swift Halo/Views/SurfaceView.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift
          git rm -f --ignore-unmatch Scripts/one_time_widget_aesthetic_calendar.py
          git rm -f --ignore-unmatch .github/workflows/one-time-widget-aesthetic-calendar.yml
          git commit -m 'Fix empty Visual Workspace and enrich widgets'
          git push origin HEAD:main
