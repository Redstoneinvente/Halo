name: One-time Visual Workspace Widget Blocks

on:
  push:
    paths:
      - 'Scripts/one_time_visual_widget_blocks.py'
      - '.github/workflows/one-time-visual-widget-blocks.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply widget block patch
        run: python3 Scripts/one_time_visual_widget_blocks.py

      - name: Validate Swift syntax and structure
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check
          grep -q 'var widgetStyle: WidgetStyle?' Halo/Core/WorkspaceModels.swift
          grep -q 'visualWorkspacePolished' Halo/Core/WidgetModels.swift
          grep -q 'standardBlocks: true' Halo/Views/SurfaceView.swift
          grep -q 'Displayed Content' Halo/Views/WidgetSettingsView.swift
          grep -q 'Reset Block to Visual Workspace Defaults' Halo/Views/WidgetSettingsView.swift

      - name: Require no compiler errors in changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 280 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceModels|WidgetModels|WidgetViews|SurfaceView|ModuleViews|WidgetSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in Visual Workspace widget block files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated existing failure; changed widget-block files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Core/WidgetModels.swift Halo/Views/WidgetViews.swift Halo/Views/SurfaceView.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift
          git rm -f --ignore-unmatch Scripts/one_time_visual_widget_blocks.py
          git rm -f --ignore-unmatch .github/workflows/one-time-visual-widget-blocks.yml
          git commit -m 'Polish Visual Workspace widget blocks'
          git push origin HEAD:main
