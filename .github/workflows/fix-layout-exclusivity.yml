name: Fix layout exclusivity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-layout-exclusivity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make layout systems mutually exclusive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          surface = Path("Halo/Views/SurfaceView.swift")
          text = surface.read_text()
          old = "        case .none: return keepClosedContentsWhenOpen\n"
          new = "        case .none:\n            // Visual Workspace owns the entire opened surface. Never layer the\n            // Default/closed-notch strip over it, even if the legacy preference\n            // was enabled before the user switched layout systems.\n            return layout.resolvedUsesCustomOpenNotchWorkspace ? false : keepClosedContentsWhenOpen\n"
          if old not in text:
              raise SystemExit("SurfaceView exclusivity anchor not found")
          surface.write_text(text.replace(old, new, 1))

          settings = Path("Halo/Views/WorkspaceSettingsView.swift")
          text = settings.read_text()
          old = '                set: { workspace.settings.layout.setCustomOpenNotchWorkspaceEnabled($0 == "visual") }\n'
          new = '                set: { value in\n                    let useVisualWorkspace = value == "visual"\n                    workspace.settings.layout.setCustomOpenNotchWorkspaceEnabled(useVisualWorkspace)\n                    // These are alternate opened-surface systems. Visual Workspace\n                    // must never inherit the Default layout top-strip overlay.\n                    if useVisualWorkspace { keepClosedContentsWhenOpen = false }\n                }\n'
          if old not in text:
              raise SystemExit("WorkspaceSettings exclusivity anchor not found")
          settings.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-layout-exclusivity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift .github/workflows/fix-layout-exclusivity.yml
          git commit -m "Make Visual Workspace and default layout mutually exclusive"
          git push origin HEAD:main
