name: Apply UI Stability Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/ui-stability-cleanup-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply settings cleanup and hover delay
        run: python3 .github/scripts/apply_ui_stability_cleanup.py

      - name: Verify UI cleanup contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          models = Path('Halo/Core/Models.swift').read_text()
          settings = Path('Halo/Views/WorkspaceSettingsView.swift').read_text()
          activation = Path('Halo/Views/ActivationSequence.swift').read_text()
          ambient = Path('Halo/Views/DecorationsView.swift').read_text()
          manager = Path('Halo/NotchEngine/WindowManager.swift').read_text()
          surface = Path('Halo/Views/SurfaceView.swift').read_text()

          required = [
              (models, 'var hoverOpenDelay: Double? = nil'),
              (models, 'var resolvedHoverOpenDelay: Double'),
              (settings, 'LabeledContent("Hover delay")'),
              (manager, 'var hoverExpandTask: Task<Void, Never>?'),
              (manager, 'func hover(_ inside: Bool, enabled: Bool, openDelay: Double = 0)'),
              (surface, 'openDelay: store.configuration.hoverToExpand ? store.configuration.resolvedHoverOpenDelay : 0'),
          ]
          missing = [needle for text, needle in required if needle not in text]
          if missing:
              raise SystemExit(f'Missing required UI cleanup markers: {missing}')

          forbidden = [
              (settings, 'Manage LicenseSeat account'),
              (settings, 'Your Halo account and your software license are separate credentials.'),
              (settings, 'Automation is requested when detecting or controlling Apple Music or Spotify.'),
              (settings, 'This direct-distribution build is not sandboxed.'),
              (settings, 'Halo uses Sparkle 2 to securely check, verify, download, and install signed updates.'),
              (settings, "This is Halo's existing persisted Surface blur"),
              (activation, 'Sound is off by default.'),
              (activation, 'Section("Accessibility & performance")'),
              (ambient, 'DisclosureGroup("Decoration Studio architecture")'),
          ]
          present = [needle for text, needle in forbidden if needle in text]
          if present:
              raise SystemExit(f'UI text that should have been removed is still present: {present}')

          print('UI stability cleanup contract passed')
          PY

      - name: Parse changed Swift source
        run: |
          xcrun swiftc -parse Halo/Core/Models.swift
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          xcrun swiftc -parse Halo/Views/ActivationSequence.swift
          xcrun swiftc -parse Halo/Views/DecorationsView.swift
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift

      - name: Build regression check
        run: |
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build

      - name: Commit source cleanup and remove temporary helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/ui-stability-cleanup-trigger.txt
          rm -f .github/scripts/apply_ui_stability_cleanup.py
          rm -f .github/workflows/apply-ui-stability-cleanup.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Polish settings UI and add hover open delay [skip ci]'
          git push origin HEAD:main
