name: Fix Local Configuration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-secret-config.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply configuration fix
        run: python3 .github/scripts/fix_secret_config.py
      - name: Verify mappings
        run: |
          git check-ignore -q Halo/Config/Secrets.xcconfig
          grep -q '#include? "Secrets.xcconfig"' Halo/Config/Base.xcconfig
          grep -q 'baseConfigurationReference = A11C0F1A0000000000000001' Halo.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c 'Print :HaloFirebaseAPIKey' Halo/Info.plist | grep -Fx '$(HALO_FIREBASE_API_KEY)'
          /usr/libexec/PlistBuddy -c 'Print :HaloLicenseSeatPublishableKey' Halo/Info.plist | grep -Fx '$(HALO_LICENSESEAT_PUBLISHABLE_KEY)'
          /usr/libexec/PlistBuddy -c 'Print :HaloLicenseSeatProductSlug' Halo/Info.plist | grep -Fx '$(HALO_LICENSESEAT_PRODUCT_SLUG)'
      - name: Simulate local configuration
        run: |
          cat > Halo/Config/Secrets.xcconfig <<'EOF'
          HALO_FIREBASE_API_KEY = FIREBASE_VALIDATION_VALUE
          HALO_LICENSESEAT_PUBLISHABLE_KEY = LICENSESEAT_VALIDATION_VALUE
          HALO_LICENSESEAT_PRODUCT_SLUG = halo-validation
          EOF
          git check-ignore -q Halo/Config/Secrets.xcconfig
      - name: Verify Xcode receives local values
        run: |
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -showBuildSettings > /tmp/halo-settings.txt
          grep -E '^ *HALO_FIREBASE_API_KEY = FIREBASE_VALIDATION_VALUE$' /tmp/halo-settings.txt
          grep -E '^ *HALO_LICENSESEAT_PUBLISHABLE_KEY = LICENSESEAT_VALIDATION_VALUE$' /tmp/halo-settings.txt
          grep -E '^ *HALO_LICENSESEAT_PRODUCT_SLUG = halo-validation$' /tmp/halo-settings.txt
      - name: Build Halo
        run: |
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO build
          BUILT_PLIST=/tmp/HaloDerived/Build/Products/Debug/Halo.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :HaloFirebaseAPIKey' "$BUILT_PLIST" | grep -Fx 'FIREBASE_VALIDATION_VALUE'
          /usr/libexec/PlistBuddy -c 'Print :HaloLicenseSeatPublishableKey' "$BUILT_PLIST" | grep -Fx 'LICENSESEAT_VALIDATION_VALUE'
          /usr/libexec/PlistBuddy -c 'Print :HaloLicenseSeatProductSlug' "$BUILT_PLIST" | grep -Fx 'halo-validation'
      - name: Commit corrected configuration
        run: |
          rm -f Halo/Config/Secrets.xcconfig
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Info.plist Halo/Config/Base.xcconfig Halo/Config/Secrets.xcconfig.example Halo.xcodeproj/project.pbxproj
          git commit -m 'fix: wire local commercial config correctly'
          git push origin main
