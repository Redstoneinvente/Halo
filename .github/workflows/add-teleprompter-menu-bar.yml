name: Add Teleprompter Menu Bar Replacement

on:
  push:
    paths:
      - '.github/teleprompter-menu-bar-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Teleprompter menu bar patch
        run: python3 scripts/add_teleprompter_menu_bar.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Services/CaptureService.swift
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add Teleprompter menu bar replacement mode"
          git push
