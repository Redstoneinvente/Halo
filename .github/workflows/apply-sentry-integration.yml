name: Apply Sentry integration

on:
  push:
    paths:
      - 'scripts/patch_sentry.py'
      - '.github/workflows/apply-sentry-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Sentry project patch
        run: python3 scripts/patch_sentry.py

      - name: Verify focused integration contract
        run: |
          grep -q 'sentry-cocoa.git' Halo.xcodeproj/project.pbxproj
          grep -q 'productName = SentrySPM;' Halo.xcodeproj/project.pbxproj
          grep -q 'import Sentry' Halo/App/HaloApp.swift
          grep -q 'sendDefaultPii = false' Halo/App/HaloApp.swift
          grep -q 'HaloSentryDSN' Halo/Info.plist

      - name: Resolve packages
        id: resolve
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -resolvePackageDependencies 2>&1 | tee /tmp/sentry-resolve.log

      - name: Build Halo
        id: build
        if: steps.resolve.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/sentry-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentry-integration-logs
          path: |
            /tmp/sentry-resolve.log
            /tmp/sentry-build.log
          if-no-files-found: ignore

      - name: Fail if validation failed
        if: steps.resolve.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1

      - name: Commit integration and clean helper files
        run: |
          rm -f scripts/patch_sentry.py .github/workflows/apply-sentry-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Sentry crash monitoring' || exit 0
          git push origin HEAD:main
