name: Apply Sentry integration

on:
  push:
    paths:
      - 'scripts/patch_sentry.py'
      - '.github/workflows/apply-sentry-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Sentry project patch
        run: python3 scripts/patch_sentry.py

      - name: Verify focused integration contract
        run: |
          grep -q 'sentry-cocoa.git' Halo.xcodeproj/project.pbxproj
          grep -q 'productName = SentrySPM;' Halo.xcodeproj/project.pbxproj
          grep -q 'import SentrySwift' Halo/App/HaloApp.swift
          grep -q 'sendDefaultPii = false' Halo/App/HaloApp.swift
          grep -q 'HaloSentryDSN' Halo/Info.plist

      - name: Resolve packages
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -resolvePackageDependencies

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit integration and clean helper files
        run: |
          rm -f scripts/patch_sentry.py .github/workflows/apply-sentry-integration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Sentry crash monitoring' || exit 0
          git push origin HEAD:main
