name: Fix Power Event Layout

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-power-event-layout.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply power event fix
        run: python3 .github/scripts/fix_power_event_layout.py

      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'powerUsesEventContainer' Halo/Views/ClosedNotchView.swift
          grep -q 'let centered: Bool' Halo/Views/ClosedNotchView.swift
          grep -q 'NSFont.monospacedDigitSystemFont' Halo/NotchEngine/WindowManager.swift
          grep -q 'settings.expandForEvent && !hasSibling' Halo/NotchEngine/WindowManager.swift

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep -E 'error:' /tmp/halo-build.log | grep -v -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected build error(s):'
              echo "$unexpected"
              exit "$code"
            fi
            grep -q -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift
          git commit -m 'fix: align and size power events'
          git push origin main
