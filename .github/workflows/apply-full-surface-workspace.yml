name: Apply Full Surface Workspace
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-full-surface-workspace.yml'
jobs:
  apply:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct helper target and apply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Scripts/one_time_full_surface_adaptive_workspace.py')
          text = path.read_text()
          needle = '# Make compact System composition reflow instead of crushing three metrics horizontally.\nreplace_once(surface,'
          replacement = "# Make compact System composition reflow instead of crushing three metrics horizontally.\nmodule_views = 'Halo/Views/ModuleViews.swift'\nreplace_once(module_views,"
          if needle not in text:
              raise SystemExit('System patch target marker not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          python3 Scripts/one_time_full_surface_adaptive_workspace.py
      - name: Parse changed Swift
        run: |
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          git diff --check
      - name: Compile-check changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-adaptive-workspace.log 2>&1
          status=$?
          set -e
          if grep -E '(^|/)(SurfaceView|WidgetViews|ModuleViews)\.swift:.*error:' /tmp/halo-adaptive-workspace.log; then
            tail -n 260 /tmp/halo-adaptive-workspace.log
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated failure; changed files have no reported compiler errors.'
          fi
      - name: Commit source and remove helpers
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Halo/Views/SurfaceView.swift Halo/Views/WidgetViews.swift Halo/Views/ModuleViews.swift
          git commit -m 'Make Visual Workspace full surface and adaptive'
          git push origin main
          git pull --rebase origin main
          rm Scripts/one_time_full_surface_adaptive_workspace.py .github/workflows/apply-full-surface-workspace.yml
          git add -A
          git commit -m 'Remove one-time workspace patch helpers'
          git push origin main
