name: Apply Full Surface Workspace
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-full-surface-workspace.yml'
jobs:
  apply:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 Scripts/one_time_full_surface_adaptive_workspace.py
      - run: xcrun swiftc -parse Halo/Views/SurfaceView.swift && xcrun swiftc -parse Halo/Views/WidgetViews.swift && git diff --check
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Halo/Views/SurfaceView.swift Halo/Views/WidgetViews.swift
          git commit -m 'Make Visual Workspace full surface and adaptive'
          git push
