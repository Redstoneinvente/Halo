name: Fix Teleprompter Studio Header Visibility
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare Teleprompter Studio header visibility fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Move profile controls below title bar
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('Halo/Services/CaptureService.swift')
          s = p.read_text()
          old = '''            HStack { TextField("Profile name", text: $profile.name).font(.title2.bold()).textFieldStyle(.plain); Toggle("Enabled", isOn: $profile.enabled).toggleStyle(.switch); Button("Preview") { TeleprompterCoordinator.shared.show(profile: profile) } }.padding(18)\n            Divider(); Picker("Section", selection: $section) { ForEach(sections, id: \\.self) { Text($0) } }.pickerStyle(.segmented).padding(14)'''
          new = '''            HStack { TextField("Profile name", text: $profile.name).font(.title2.bold()).textFieldStyle(.plain); Toggle("Enabled", isOn: $profile.enabled).toggleStyle(.switch); Button("Preview") { TeleprompterCoordinator.shared.show(profile: profile) } }\n                .padding(.horizontal, 18)\n                .padding(.top, 52)\n                .padding(.bottom, 18)\n            Divider(); Picker("Section", selection: $section) { ForEach(sections, id: \\.self) { Text($0) } }.pickerStyle(.segmented).padding(14)'''
          if old not in s:
              raise SystemExit('Teleprompter profile header anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Halo/Services/CaptureService.swift
          git commit -m 'Fix hidden Teleprompter Studio header controls'
          git push origin main
