name: Add Clipboard CI

on:
  push:
    paths:
      - '.github/clipboard-ci-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply Clipboard CI patch
        run: python3 scripts/add_clipboard_ci.py
      - name: Commit Clipboard CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add contextual Clipboard CI"
          git push origin HEAD:main
