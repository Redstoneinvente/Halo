name: Validate Capture Service

on:
  push:
    branches:
      - chatgpt/capture-suite

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Parse and compile capture service
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc -parse Halo/Services/CaptureService.swift
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > /tmp/capture-build.log 2>&1
          STATUS=$?
          set -e
          grep -E 'CaptureService.swift:.*(error:|warning:)' /tmp/capture-build.log || true
          if grep -q 'CaptureService.swift:.*error:' /tmp/capture-build.log; then exit 1; fi
          SOURCE_LIST=$(find build -path '*Objects-normal/arm64/Halo.SwiftFileList' -print -quit)
          test -n "$SOURCE_LIST"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          PRIMARY="$PWD/Halo/Services/CaptureService.swift"
          declare -a SOURCES=()
          while IFS= read -r source; do test "$source" = "$PRIMARY" || SOURCES+=("$source"); done < "$SOURCE_LIST"
          xcrun swiftc -frontend -typecheck "${SOURCES[@]}" -primary-file "$PRIMARY" -target arm64-apple-macos13.0 -sdk "$SDK" -module-name Halo -swift-version 5 -D DEBUG -enable-testing -enable-bare-slash-regex -enable-experimental-feature DebugDescriptionMacro -I "$PWD/build/Debug" -F "$PWD/build/Debug"
          echo "full build status: $STATUS"
