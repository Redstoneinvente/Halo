name: Inspect Capture Platform

on:
  push:
    branches:
      - chatgpt/capture-suite

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native capture capabilities
        shell: bash
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          echo '=== SCRecordingOutput ==='
          sed -n '20,115p' "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework/Versions/A/Headers/SCRecordingOutput.h"
          echo '=== SCContentFilter ==='
          grep -n -A8 -B4 "initWithDisplay\|initWithDesktopIndependentWindow" "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework/Versions/A/Headers/SCContentFilter.h" || true
          echo '=== SCStream configuration audio ==='
          sed -n '250,370p' "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework/Versions/A/Headers/SCStream.h"
          echo '=== Screen objects ==='
          grep -n -A8 -B4 "@interface SCDisplay\|displayID\|width\|height" "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework/Versions/A/Headers/SCShareableContent.h" | head -100 || true
