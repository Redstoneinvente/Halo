name: Inspect Capture Platform

on:
  push:
    branches:
      - chatgpt/capture-suite

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Inspect native capture capabilities
        shell: bash
        run: |
          echo '=== screencapture help ==='
          /usr/sbin/screencapture -h 2>&1 || true
          echo '=== sdk ==='
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx --show-sdk-version
          echo '=== ScreenCaptureKit module files ==='
          find "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework/Modules" -maxdepth 4 -type f -print || true
          echo '=== ScreenCaptureKit audio APIs ==='
          grep -R -n -E "capturesAudio|captureMicrophone|SCRecordingOutput|SCStreamOutputType|SCStreamConfiguration|SCShareableContent|sourceRect" "$SDK/System/Library/Frameworks/ScreenCaptureKit.framework" 2>/dev/null | head -260 || true
