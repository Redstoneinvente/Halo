name: Apply installed app exclusion picker

on:
  push:
    paths:
      - '.github/workflows/temp-installed-app-exclusion-picker.yml'
      - '.github/temp/patch_installed_app_picker.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch app exclusion UI
        run: python3 .github/temp/patch_installed_app_picker.py

      - name: Verify source contract
        shell: bash
        run: |
          grep -q 'InstalledAppExclusionPicker(bundleIDs: $workspace.settings.clipboardExcludedApps)' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'InstalledAppExclusionPicker(bundleIDs: $excludedApps)' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloInstalledApplicationCatalog' Halo/Views/WorkspaceSettingsView.swift
          if grep -q 'TextField("Excluded app bundle IDs, comma-separated"' Halo/Views/WorkspaceSettingsView.swift; then exit 1; fi

      - name: Build Halo
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -derivedDataPath /tmp/HaloDerivedData CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-build.log

      - name: Commit source change and clean temporary helpers
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-installed-app-exclusion-picker.yml .github/temp/patch_installed_app_picker.py
          git add Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'Add installed app picker for clipboard exclusions'
          git push origin HEAD:main
