name: Enhance Transfer CI

on:
  push:
    paths:
      - '.github/enhance-transfer-ci-trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Transfer CI enhancements
        run: python3 scripts/enhance_transfer_ci.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift
          git diff --cached --quiet && exit 0
          git commit -m "Add Transfer CI indicator modes and adaptive sizing"
          git push
