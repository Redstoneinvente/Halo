name: Fix Pixel Pal Eye Styles

on:
  push:
    paths:
      - '.github/pixelpal-eye-style-trigger.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply eye-style renderer fix
        run: python3 .github/scripts/fix_pixelpal_eye_styles.py

      - name: Parse Pixel Pal
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-pixelpal-eyes-build.log

      - name: Commit verified result
        run: |
          rm -f .github/pixelpal-eye-style-trigger.txt
          rm -f .github/workflows/fix-pixelpal-eye-styles.yml
          rm -f .github/scripts/fix_pixelpal_eye_styles.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Pixel Pal eye styles and expression previews'
          git push origin HEAD:main
