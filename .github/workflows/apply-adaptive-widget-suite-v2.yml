name: Apply Adaptive Visual Workspace Widgets V2

on:
  push:
    branches:
      - chatgpt/adaptive-widget-suite

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch, audit, typecheck and publish
        shell: bash
        run: |
          set -euo pipefail
          cp .github/adaptive_widgets_patch.py /tmp/adaptive_widgets_patch.py
          cp .github/adaptive_override_patch.py /tmp/adaptive_override_patch.py
          cp Halo/Views/VisualWorkspaceAdaptiveWidgets.swift /tmp/VisualWorkspaceAdaptiveWidgets.swift

          # Halo keeps source file references directly in the Halo group rather than a nested Views PBXGroup.
          # Rewrite only that project-file fragment in the temporary patcher.
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('/tmp/adaptive_widgets_patch.py')
          s = p.read_text()
          pattern = re.compile(r"\n    # Add to Views group\..*?\n    # Add only to the Halo app source phase\.", re.S)
          replacement = '''
    # Add to the Halo group beside the existing ModuleViews file reference.
    group_anchor = '\\t\\t\\t\\t00000000000000000000006C /* Views/ModuleViews.swift */,\\n'
    if group_anchor not in project: raise SystemExit('Halo group ModuleViews anchor missing')
    project = project.replace(group_anchor, group_anchor + f'\\t\\t\\t\\t{file_id} /* Views/VisualWorkspaceAdaptiveWidgets.swift */,\\n', 1)

    # Add only to the Halo app source phase.'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('Could not rewrite PBXGroup patch block')
          p.write_text(s)
          print('Temporary project patcher adapted to Halo PBXGroup structure')
          PY

          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/VisualWorkspaceAdaptiveWidgets.swift Halo/Views/VisualWorkspaceAdaptiveWidgets.swift
          python3 /tmp/adaptive_widgets_patch.py
          python3 /tmp/adaptive_override_patch.py

          echo '=== Scope ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {
              'Halo/Core/WidgetModels.swift',
              'Halo/Views/VisualWorkspaceAdaptiveWidgets.swift',
              'Halo/Views/ModuleViews.swift',
              'Halo/Views/SurfaceView.swift',
              'Halo/Core/AppStore.swift',
              'Halo/Core/WorkspaceStore.swift',
              'Halo/Services/CaptureService.swift',
              'Halo/Services/Integrations.swift',
              'Halo/Views/WidgetSettingsView.swift',
              'Halo.xcodeproj/project.pbxproj',
          }
          if changed != expected:
              raise SystemExit(f'Unexpected production scope: {sorted(changed)}')
          print('Production scope verified.')
          PY

          git diff --check

          for file in \
            Halo/Core/WidgetModels.swift \
            Halo/Views/VisualWorkspaceAdaptiveWidgets.swift \
            Halo/Views/ModuleViews.swift \
            Halo/Views/SurfaceView.swift \
            Halo/Core/AppStore.swift \
            Halo/Core/WorkspaceStore.swift \
            Halo/Services/CaptureService.swift \
            Halo/Services/Integrations.swift \
            Halo/Views/WidgetSettingsView.swift; do
            echo "Parsing $file"
            xcrun swiftc -parse "$file"
          done

          echo '=== 10 widgets × 32 footprints audit ==='
          python3 <<'PY'
          widgets = ['timer','media','audio','clipboard','system','launcher','activities','notes','capture','stopwatch']
          def family(c, r):
              c=max(1,min(8,c)); r=max(1,min(4,r))
              if c == 1 and r == 1: return 'micro'
              if r == 1: return 'compact' if c == 2 else 'horizontal'
              if c == 1: return 'vertical'
              if c == 2 and r == 2: return 'compact'
              if c <= 3 and r <= 2: return 'standard'
              if c <= 2 and r >= 3: return 'vertical'
              if c >= 7 and r == 4: return 'hero'
              if c >= 6 and r >= 3: return 'dashboard'
              if c >= 4 and r >= 3: return 'expanded'
              if c >= 4 and r == 2: return 'expanded'
              if c >= 3 and r >= 3: return 'expanded'
              return 'standard'
          expected = {(c,r) for c in range(1,9) for r in range(1,5)}
          for widget in widgets:
              seen = {(c,r): family(c,r) for c,r in expected}
              assert len(seen) == 32
              assert seen[(1,1)] == 'micro'
              assert seen[(2,1)] == 'compact'
              assert seen[(4,1)] == 'horizontal'
              assert seen[(1,4)] == 'vertical'
              assert seen[(2,2)] == 'compact'
              assert seen[(8,4)] == 'hero'
              assert len({seen[(4,1)], seen[(2,2)], seen[(1,4)]}) == 3
              print(widget, ', '.join(f'{c}x{r}:{seen[(c,r)]}' for c,r in [(1,1),(2,1),(4,1),(1,4),(2,2),(4,2),(4,4),(8,4)]))
          print('320 footprint cases covered; key aspect-ratio distinctions verified.')
          PY

          # Guard the user's hard scope: Clock and Calendar keep their dedicated paths.
          grep -F 'VisualWorkspaceCalendarView(service: workspace.calendar)' Halo/Views/ModuleViews.swift >/dev/null
          ! grep -q 'VisualWorkspaceAdaptiveModuleView(module: .calendar' Halo/Views/ModuleViews.swift
          ! grep -q 'VisualWorkspaceAdaptiveModuleView(module: .clock' Halo/Views/ModuleViews.swift

          echo '=== Xcode preflight ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            > /tmp/adaptive-preflight.log 2>&1
          BUILD_STATUS=$?
          set -e
          tail -n 120 /tmp/adaptive-preflight.log || true

          python3 <<'PY'
          from pathlib import Path
          log = Path('/tmp/adaptive-preflight.log').read_text(errors='replace')
          changed = [
              'WidgetModels.swift','VisualWorkspaceAdaptiveWidgets.swift','ModuleViews.swift','SurfaceView.swift',
              'AppStore.swift','WorkspaceStore.swift','CaptureService.swift','Integrations.swift','WidgetSettingsView.swift'
          ]
          bad=[]
          for line in log.splitlines():
              if ' error:' in line and any('/'+name+':' in line for name in changed): bad.append(line)
          if bad:
              print('\n'.join(bad))
              raise SystemExit('Compiler error reported in adaptive-widget production scope')
          print('No preflight compiler errors reported in changed Swift files.')
          PY

          SOURCE_LIST=$(find build -path '*Objects-normal/arm64/Halo.SwiftFileList' -print -quit)
          if [[ -z "$SOURCE_LIST" ]]; then
            echo 'Xcode did not produce Halo.SwiftFileList.' >&2
            exit 1
          fi
          SDK=$(xcrun --sdk macosx --show-sdk-path)

          typecheck_primary() {
            local rel="$1"
            local label="$2"
            local primary="$PWD/$rel"
            declare -a sources=()
            declare -A seen=()
            while IFS= read -r source; do
              [[ -z "$source" ]] && continue
              [[ "$source" == "$primary" ]] && continue
              [[ -n "${seen[$source]:-}" ]] && continue
              seen[$source]=1
              sources+=("$source")
            done < "$SOURCE_LIST"
            echo "=== Primary typecheck: $label ==="
            xcrun swiftc -frontend -typecheck \
              "${sources[@]}" \
              -primary-file "$primary" \
              -target arm64-apple-macos13.0 \
              -sdk "$SDK" \
              -module-name Halo \
              -swift-version 5 \
              -D DEBUG \
              -enable-testing \
              -enable-bare-slash-regex \
              -enable-experimental-feature DebugDescriptionMacro \
              -I "$PWD/build/Debug" \
              -F "$PWD/build/Debug"
          }

          typecheck_primary 'Halo/Views/VisualWorkspaceAdaptiveWidgets.swift' 'adaptive widget renderer'
          typecheck_primary 'Halo/Core/WidgetModels.swift' 'adaptive widget model'
          typecheck_primary 'Halo/Views/WidgetSettingsView.swift' 'adaptive widget inspector'
          typecheck_primary 'Halo/Services/CaptureService.swift' 'capture recent-state integration'

          if [[ $BUILD_STATUS -ne 0 ]]; then
            echo 'Full target did not complete; changed-file primary typechecks passed.'
          fi

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add \
            Halo/Core/WidgetModels.swift \
            Halo/Views/VisualWorkspaceAdaptiveWidgets.swift \
            Halo/Views/ModuleViews.swift \
            Halo/Views/SurfaceView.swift \
            Halo/Core/AppStore.swift \
            Halo/Core/WorkspaceStore.swift \
            Halo/Services/CaptureService.swift \
            Halo/Services/Integrations.swift \
            Halo/Views/WidgetSettingsView.swift \
            Halo.xcodeproj/project.pbxproj
          git commit -m 'Upgrade adaptive Visual Workspace widgets'
          git push origin HEAD:main
