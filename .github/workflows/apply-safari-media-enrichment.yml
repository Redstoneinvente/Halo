name: Apply Safari Media Enrichment

on:
  push:
    branches: [main]
    paths:
      - '.github/safari-media-enrichment-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Safari media enrichment
        run: python3 .github/scripts/apply_safari_media_enrichment.py

      - name: Verify enrichment contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          checks = {
            'Halo/Services/AudioSpectrumService.swift': [
              'import ShazamKit', 'recognizeCurrentAudio', 'matchStreamingBuffer', 'AudioRecognitionMatch'
            ],
            'Halo/Services/Integrations.swift': [
              'acceptExternalMedia', 'requestExternalArtwork', 'externalArtworkData', '(!automatic && isPlaying)'
            ],
            'Halo/Core/WorkspaceStore.swift': [
              'kMRMediaRemoteNowPlayingInfoArtworkData', 'requestRecognitionIfNeeded',
              'SafariAudioProcessDetector.isProducingOutput()', 'contextNeedsArtwork'
            ],
            'Halo/Views/SurfaceView.swift': [
              'activeArtwork', 'media.duration', 'media.position', 'Synced Safari lyrics remain fluid'
            ]
          }
          for path, markers in checks.items():
              text = Path(path).read_text()
              missing = [m for m in markers if m not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')
          print('Safari media enrichment contract passed')
          PY

      - name: Parse changed Swift sources
        run: |
          xcrun swiftc -parse Halo/Services/AudioSpectrumService.swift
          xcrun swiftc -parse Halo/Services/Integrations.swift
          xcrun swiftc -parse Halo/Core/WorkspaceStore.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift

      - name: Build Halo media enrichment regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-media-build.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking whether the changed files introduced compiler errors.'
            grep -E 'AudioSpectrumService\.swift:.*error:|Integrations\.swift:.*error:|WorkspaceStore\.swift:.*error:|SurfaceView\.swift:.*error:' /tmp/halo-media-build.log && exit 1 || true
            echo 'Build failed only on unrelated baseline errors; changed media files emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit Safari media enrichment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Services/AudioSpectrumService.swift Halo/Services/Integrations.swift Halo/Core/WorkspaceStore.swift Halo/Views/SurfaceView.swift
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Enrich Safari media with artwork and lyrics metadata'
          git push origin HEAD:main
