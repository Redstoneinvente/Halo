name: Apply Lock Screen capability correction

on:
  push:
    branches:
      - fix-lock-screen-capability
    paths:
      - '.github/workflows/fix-lock-screen-capability.yml'

permissions:
  contents: write

jobs:
  patch-validate-push:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-lock-screen-capability
          fetch-depth: 0

      - name: Apply source patch
        run: python3 .github/fix-lock-screen-capability.py

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift

      - name: Commit source correction and remove helpers
        run: |
          rm .github/workflows/fix-lock-screen-capability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/WorkspaceSettingsView.swift Halo/NotchEngine/WindowManager.swift
          git rm .github/fix-lock-screen-capability.py .github/workflows/fix-lock-screen-capability.yml
          git commit -m "Correct Lock Screen feature behavior [skip ci]"
          git push origin HEAD:fix-lock-screen-capability
