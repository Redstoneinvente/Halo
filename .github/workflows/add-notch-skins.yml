name: Add Notch Skins

on:
  push:
    branches: [main]
    paths:
      - '.github/notch-skins-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Notch Skins feature
        run: python3 .github/scripts/add-notch-skins.py

      - name: Verify feature contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          models = Path('Halo/Core/WorkspaceModels.swift').read_text()
          surface = Path('Halo/Views/SurfaceView.swift').read_text()
          settings = Path('Halo/Views/WorkspaceSettingsView.swift').read_text()

          required_models = [
              'enum NotchSkinPreset:',
              'struct NotchSkinOptions:',
              'var skin = NotchSkinOptions()',
              'case grain, backgroundSchedule, surface, background, skin,',
          ]
          required_surface = [
              'NotchSkinLayer(options: layout.appearance.skin, theme: theme, expanded: state.expanded)',
              'struct NotchSkinLayer: View',
              'case .carbonWeave:',
              'case .neonCircuit:',
              'case .pixelMatrix:',
              'case .custom:',
          ]
          required_settings = [
              'items: ["Appearance", "Notch Skins",',
              'case "Notch Skins": return "square.3.layers.3d"',
              'case "Notch Skins": NotchSkinSettingsPane(',
              'private struct NotchSkinSettingsPane: View',
              'Button("Choose Image…")',
              'Picker("Blend mode"',
              'Picker("Show skin"',
          ]
          for token in required_models:
              if token not in models: raise SystemExit(f'Missing model token: {token}')
          for token in required_surface:
              if token not in surface: raise SystemExit(f'Missing renderer token: {token}')
          for token in required_settings:
              if token not in settings: raise SystemExit(f'Missing settings token: {token}')

          background_index = surface.index('surfaceBackgroundLayer\n                NotchSkinLayer')
          content_index = surface.index('.clipShape(contour)', background_index)
          if not background_index < content_index:
              raise SystemExit('Skin layer is not positioned in the background stack')
          print('Notch Skins contract passed')
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-notch-skins.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking changed files for compiler errors.'
            if grep -E '(WorkspaceModels|SurfaceView|WorkspaceSettingsView)\.swift:.*error:' /tmp/halo-notch-skins.log; then
              echo '--- Relevant compiler errors ---'
              grep -E '(WorkspaceModels|SurfaceView|WorkspaceSettingsView)\.swift:.*error:' /tmp/halo-notch-skins.log
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors; changed files emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift
          git rm -f .github/scripts/add-notch-skins.py .github/workflows/add-notch-skins.yml .github/notch-skins-trigger.txt
          git commit -m 'Add customizable notch skins'
          git pull --rebase origin main
          git push origin HEAD:main
