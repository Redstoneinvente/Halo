name: Fix Media Presentation Lifetime

on:
  push:
    branches: [main]
    paths:
      - '.github/media-presentation-lifetime-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply media presentation lifetime fix
        run: python3 .github/scripts/fix_media_presentation_lifetime.py

      - name: Verify presentation contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          integrations = Path('Halo/Services/Integrations.swift').read_text()
          surface = Path('Halo/Views/SurfaceView.swift').read_text()
          closed = Path('Halo/Views/ClosedNotchView.swift').read_text()
          checks = {
              'MediaService presentation property': 'var hasNowPlayingPresentation: Bool' in integrations,
              'Music CI candidate uses presentation lifetime': 'workspace.media.hasNowPlayingPresentation' in surface,
              'Context visualizer uses presentation lifetime': 'playing: media.hasNowPlayingPresentation' in surface,
              'Closed music item uses presentation lifetime': 'if isMusicItem { return media.hasNowPlayingPresentation }' in closed,
              'Closed visualizer no oversized width': 'visualizerContentWidth' not in closed and 'v.width = Double.greatestFiniteMagnitude' not in closed,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('contract failed: ' + ', '.join(failed))
          print('Media presentation lifetime contract passed')
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Services/Integrations.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ClosedNotchView.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-media-presentation-lifetime.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking changed files for compiler errors.'
            if grep -E '(Integrations|SurfaceView|ClosedNotchView)\.swift:.*error:' /tmp/halo-media-presentation-lifetime.log; then
              grep -E '(Integrations|SurfaceView|ClosedNotchView)\.swift:.*error:' /tmp/halo-media-presentation-lifetime.log
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors; changed files emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit media presentation lifetime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Services/Integrations.swift Halo/Views/SurfaceView.swift Halo/Views/ClosedNotchView.swift
          git rm -f .github/scripts/fix_media_presentation_lifetime.py .github/workflows/fix-media-presentation-lifetime.yml .github/media-presentation-lifetime-trigger.txt
          git commit -m 'Stabilize Audio CI visualizer presentation lifetime'
          git pull --rebase origin main
          git push origin HEAD:main
