name: Fix Account macOS 13 Compatibility

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-account-macos13.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply compatibility fix
        run: python3 .github/scripts/fix_account_macos13.py
      - name: Verify macOS 14-only content types are gone
        run: |
          ! grep -q '\.textContentType(\.emailAddress)' Halo/Views/WorkspaceSettingsView.swift
          ! grep -q '\.newPassword' Halo/Views/WorkspaceSettingsView.swift
      - name: Build Halo
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/halo-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log && \
               ! grep -E 'Halo/Views/WorkspaceSettingsView\.swift:.*error:' /tmp/halo-build.log; then
              echo 'Accepting known pre-existing ClosedNotchView compiler timeout; WorkspaceSettingsView compiled without errors.'
            else
              exit "$status"
            fi
          fi
      - name: Commit source change
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'fix: support account UI on macOS 13'
          git push origin main
