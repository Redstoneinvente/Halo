name: One-time Direct Visual Workspace Grid
on:
  push:
    paths:
      - '.github/workflows/one-time-direct-widget-grid.yml'
jobs:
  patch:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct editor generator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Scripts/one_time_direct_widget_grid.py')
          lines = p.read_text().splitlines()
          needle = '        Menu("Lightweight element") { ForEach(OpenNotchElementKind.allCases) { element in Button(element.title) { addElement(element) } }'
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'Expected one malformed add-menu line, found {len(matches)}')
          lines[matches[0]] += ' }'
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Apply direct-grid architecture
        run: python3 Scripts/one_time_direct_widget_grid.py
      - name: Validate Swift syntax
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check
      - name: Compiler gate for changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-direct-grid.log 2>&1
          status=$?
          set -e
          if grep -E '(^|/)(WorkspaceModels|SurfaceView|ModuleViews|WidgetSettingsView)\.swift:.*error:' /tmp/halo-direct-grid.log; then
            tail -n 340 /tmp/halo-direct-grid.log
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated failure; changed files have no reported compiler errors.'
          fi
      - name: Commit source
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Halo/Core/WorkspaceModels.swift Halo/Views/SurfaceView.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift
          git commit -m 'Replace Visual Workspace regions with adaptive widget grid'
          git push origin main
