name: Roll Back First Run Setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rollback-first-run-setup.yml

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-onboarding app entry point
        run: |
          git show 39952c756911e279683aeeb458f0162da50ec658:Halo/App/HaloApp.swift > Halo/App/HaloApp.swift
          git diff --check
          git diff --stat

      - name: Commit rollback
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/App/HaloApp.swift
          git commit -m 'fix: roll back first-run setup regression'
          git push origin main
