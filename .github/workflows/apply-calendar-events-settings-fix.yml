# Calendar repair validation workflow
name: Apply Calendar Event and Settings Fix
on:
  push:
    branches: [chatgpt/calendar-events-settings-fix]
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Calendar repair
        shell: bash
        run: |
          set -euo pipefail
          cp .github/calendar_events_settings_fix.py /tmp/calendar_events_settings_fix.py
          git fetch origin main
          git checkout -B main origin/main
          python3 /tmp/calendar_events_settings_fix.py

          echo '=== Calendar-only scope ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          allowed = {
              'Halo/Core/WidgetModels.swift',
              'Halo/Services/Integrations.swift',
              'Halo/Views/ModuleViews.swift',
              'Halo/Views/WidgetSettingsView.swift',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Unexpected files changed: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Expected Calendar files not changed: {sorted(missing)}')
          print('Calendar repair source scope verified.')
          PY

          git diff --check
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Services/Integrations.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift

          echo '=== Behavioral wiring audit ==='
          grep -q 'case holidaysFestivals = "Holidays & Festivals"' Halo/Core/WidgetModels.swift
          grep -q 'selectedCalendarIdentifiers' Halo/Core/WidgetModels.swift
          grep -q 'visualDayEvents' Halo/Services/Integrations.swift
          grep -q 'visualUpcomingEvents' Halo/Services/Integrations.swift
          grep -q 'calendarRevision' Halo/Services/Integrations.swift
          grep -q 'calendarAccessState' Halo/Views/ModuleViews.swift
          grep -q 'case .holidaysFestivals' Halo/Views/ModuleViews.swift
          grep -q 'case .selected' Halo/Views/ModuleViews.swift
          grep -q 'resolvedIndicatorStyle' Halo/Views/ModuleViews.swift
          grep -q 'todayHeroNumber' Halo/Views/ModuleViews.swift
          grep -q 'dateFont' Halo/Views/ModuleViews.swift
          grep -q 'VisualCalendarSourceBrowser' Halo/Views/WidgetSettingsView.swift
          grep -q 'Detected calendars' Halo/Views/WidgetSettingsView.swift
          grep -q 'calendarSourceSelectionBinding' Halo/Views/WidgetSettingsView.swift
          echo 'Calendar access, source discovery, filters, Today styles, indicators and typography are wired.'

          echo '=== Build validation ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee /tmp/calendar-fix-build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if grep -E 'Halo/(Core/WidgetModels|Services/Integrations|Views/ModuleViews|Views/WidgetSettingsView)\.swift:[0-9]+:[0-9]+: error:' /tmp/calendar-fix-build.log; then
              echo 'A modified Calendar source file has a compiler error.' >&2
              exit 1
          fi
          if [[ $build_status -ne 0 ]]; then
              echo 'Full target still has unrelated repository errors; modified Calendar files reported no compiler errors.'
              grep -E 'error:' /tmp/calendar-fix-build.log | tail -n 30 || true
          else
              echo 'Full target build succeeded.'
          fi

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Services/Integrations.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift
          git commit -m 'Fix Visual Workspace Calendar events and settings'
          git push origin HEAD:main
