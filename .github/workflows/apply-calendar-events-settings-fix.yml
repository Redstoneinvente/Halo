name: Diagnose Surface Blur and Calendar Access
on:
  push:
    branches: [chatgpt/calendar-events-settings-fix]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B inspect origin/main
          echo '=== SurfaceBackground definition ==='
          grep -R -n -A120 -B10 'struct SurfaceBackground' Halo || true
          echo '=== appearance.blur usages ==='
          grep -R -n -B4 -A8 'appearance\.blur\|\.blur = entry\.blur\|fallback\.blur' Halo || true
          echo '=== Calendar authorization ==='
          grep -n -A130 -B10 'final class CalendarService' Halo/Services/Integrations.swift || true
          echo '=== Calendar privacy keys ==='
          grep -n -i 'calendar' Halo/Info.plist || true
