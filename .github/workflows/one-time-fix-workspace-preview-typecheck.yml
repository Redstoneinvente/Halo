name: One-time Fix Workspace Preview Typecheck
on:
  push:
    paths:
      - '.github/workflows/one-time-fix-workspace-preview-typecheck.yml'
jobs:
  patch:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 Scripts/one_time_fix_workspace_preview_typecheck.py
      - name: Validate Swift syntax
        run: |
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check
      - name: Compiler gate
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-preview-typecheck.log 2>&1
          status=$?
          set -e
          if grep -E '(^|/)WidgetSettingsView\.swift:.*error:' /tmp/halo-preview-typecheck.log; then
            tail -n 300 /tmp/halo-preview-typecheck.log
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated failure; WidgetSettingsView has no reported compiler errors.'
          fi
      - name: Commit source and cleanup
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Halo/Views/WidgetSettingsView.swift
          git commit -m 'Fix Visual Workspace editor type-check timeout'
          git push origin main
