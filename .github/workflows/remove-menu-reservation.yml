name: Remove Invisible Menu Reservation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-menu-reservation.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove invisible menu reservation
        run: python3 .github/scripts/remove_menu_reservation.py
      - name: Verify reservation is gone
        run: |
          ! grep -q 'menuReservation' Halo/App/HaloApp.swift
          ! grep -q 'updateMenuBarReservation' Halo/App/HaloApp.swift
          ! grep -q 'haloPanelResized' Halo/App/HaloApp.swift
          ! grep -q 'haloPanelMoved' Halo/App/HaloApp.swift
          ! grep -q 'haloPanelGeometryChanged' Halo/App/HaloApp.swift
          grep -q 'status = NSStatusBar.system.statusItem' Halo/App/HaloApp.swift
      - name: Build Halo
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/halo-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log && \
               ! grep -E 'Halo/App/HaloApp\.swift:.*error:' /tmp/halo-build.log; then
              echo 'Accepting known pre-existing ClosedNotchView compiler timeout; HaloApp compiled without errors.'
            else
              exit "$status"
            fi
          fi
      - name: Commit source change
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/App/HaloApp.swift
          git commit -m 'fix: remove invisible menu-bar reservation'
          git push origin main
