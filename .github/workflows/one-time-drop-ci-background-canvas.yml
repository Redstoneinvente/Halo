name: One-time Drop CI background canvas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-drop-ci-background-canvas.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Drop CI background cleanup
        run: |
          python3 Scripts/one_time_drop_ci_background_canvas.py
          xcrun swiftc -parse Halo/NotchEngine/DisplayClock.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          git diff --check

      - name: Validate Drop CI compiler output
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E '(DisplayClock|SurfaceView)\.swift:[0-9]+:[0-9]+: error:' build.log; then
            echo 'Drop CI introduced a compiler error.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full build still has unrelated project errors; Drop CI files have no compiler errors.'
          fi

      - name: Commit cleanup
        run: |
          git config user.name "Redstoneinvente"
          git config user.email "45894815+Redstoneinvente@users.noreply.github.com"
          git add Halo/NotchEngine/DisplayClock.swift Halo/Views/SurfaceView.swift
          git rm Scripts/one_time_drop_ci_background_canvas.py .github/workflows/one-time-drop-ci-background-canvas.yml
          git commit -m "Make Drop CI background a clean customizable canvas"
          git push origin main
