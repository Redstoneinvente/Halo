name: Apply Clock Showcase

on:
  push:
    branches:
      - chatgpt/clock-showcase
    paths:
      - '.github/workflows/apply-clock-showcase.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate Clock-only changes
        shell: bash
        run: |
          set -euo pipefail
          cp .github/clock_showcase_patch.py /tmp/clock_showcase_patch.py
          git fetch origin main
          git checkout -B main origin/main

          python3 /tmp/clock_showcase_patch.py

          # Repair one generated exhaustive switch into conventional Swift formatting.
          python3 <<'PY'
          from pathlib import Path
          p = Path('Halo/Views/WidgetViews.swift')
          t = p.read_text()
          old = 'switch style.fontFamily { case .rounded: design = .rounded; case .serif: design = .serif; case .monospaced: design = .monospaced; default: design = .default; case .custom: design = .default }'
          new = '''switch style.fontFamily {
                      case .rounded: design = .rounded
                      case .serif: design = .serif
                      case .monospaced: design = .monospaced
                      case .system, .custom: design = .default
                      }'''
          if old not in t:
              raise SystemExit('Expected generated font-family switch was not found')
          p.write_text(t.replace(old, new, 1))
          PY

          echo '=== Scope guard ==='
          git diff --name-only
          python3 <<'PY'
          import subprocess
          allowed = {
              'Halo/Core/WidgetModels.swift',
              'Halo/Views/WidgetViews.swift',
              'Halo/Views/WidgetSettingsView.swift',
              'Halo/Views/SurfaceView.swift',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          missing = allowed - changed
          if unexpected:
              raise SystemExit(f'Clock patch touched unexpected files: {sorted(unexpected)}')
          if missing:
              raise SystemExit(f'Clock patch did not update expected files: {sorted(missing)}')
          print('Clock-only source scope verified.')
          PY

          git diff --check
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift

          echo '=== 1x1 through 8x4 adaptive family audit ==='
          python3 <<'PY'
          def family(c, r):
              c=max(1,c); r=max(1,r)
              if c == 1 and r == 1: return 'micro'
              if r == 1: return 'horizontalCompact' if c <= 3 else 'wide'
              if c == 1: return 'verticalCompact' if r <= 2 else 'tall'
              if c >= 7 and r >= 4: return 'hero'
              if (c >= 5 and r >= 3) or c*r >= 16: return 'large'
              if c >= 4 and r == 2: return 'wide'
              if r >= 3 and c <= 2: return 'tall'
              if c >= 3 and r >= 3: return 'large'
              return 'standard'
          expected = {'micro','horizontalCompact','verticalCompact','standard','wide','tall','large','hero'}
          seen=set()
          for r in range(1,5):
              row=[]
              for c in range(1,9):
                  f=family(c,r); seen.add(f); row.append(f'{c}x{r}:{f}')
              print(' | '.join(row))
          assert seen == expected, (seen, expected)
          assert family(4,1) != family(2,2) != family(1,4)
          assert family(8,4) == 'hero'
          print('All 32 dimensions covered; aspect-ratio distinctions verified.')
          PY

          echo '=== Build validation ==='
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee /tmp/clock-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if grep -E 'Halo/(Core/WidgetModels|Views/WidgetViews|Views/WidgetSettingsView|Views/SurfaceView)\.swift:[0-9]+:[0-9]+: error:' /tmp/clock-build.log; then
              echo 'A modified Clock-related source file has a compiler error.' >&2
              exit 1
          fi

          if [[ $build_status -ne 0 ]]; then
              echo 'Full target build still has unrelated repository errors; modified Clock files reported no compiler errors.'
              grep -E 'error:' /tmp/clock-build.log | tail -n 30 || true
          else
              echo 'Full target build succeeded.'
          fi

          git diff --stat
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Views/WidgetViews.swift Halo/Views/WidgetSettingsView.swift Halo/Views/SurfaceView.swift
          git commit -m 'Upgrade Visual Workspace Clock'
          git push origin HEAD:main
