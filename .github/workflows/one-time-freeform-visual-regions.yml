name: One-time Freeform Visual Workspace Regions

on:
  push:
    paths:
      - 'Scripts/one_time_freeform_regions.py'
      - '.github/workflows/one-time-freeform-visual-regions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply freeform region patch
        run: python3 Scripts/one_time_freeform_regions.py

      - name: Validate Swift syntax and structure
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          git diff --check
          grep -q 'struct OpenNotchRegionFrame' Halo/Core/WorkspaceModels.swift
          grep -q 'materializeRegionFrames' Halo/Core/WorkspaceModels.swift
          grep -q 'Merge Into' Halo/Views/WidgetSettingsView.swift
          grep -q 'Quick Size & Position' Halo/Views/WidgetSettingsView.swift
          grep -q 'freeformCanvas' Halo/Views/SurfaceView.swift

      - name: Require no compiler errors in changed files
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 260 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceModels|WidgetSettingsView|SurfaceView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in freeform region files.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build has an unrelated existing failure; changed freeform-region files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Views/WidgetSettingsView.swift Halo/Views/SurfaceView.swift
          git rm -f --ignore-unmatch Scripts/one_time_freeform_regions.py
          git rm -f --ignore-unmatch .github/workflows/one-time-freeform-visual-regions.yml
          git commit -m 'Add freeform Visual Workspace regions'
          git push origin HEAD:main
