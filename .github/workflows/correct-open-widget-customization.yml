name: Correct Open Widget Customization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/correct-open-widget-customization.yml
permissions:
  contents: write
jobs:
  apply-and-validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove mistaken Closed Notch widget customization
        run: |
          git checkout '847378053e3d174dcf50d62723ee7e637600460f^' -- \
            Halo/Core/WidgetModels.swift \
            Halo/Views/WidgetSettingsView.swift \
            Halo/Views/ClosedNotchView.swift \
            Halo/NotchEngine/WindowManager.swift
      - name: Apply opened widget customization
        run: python3 .github/scripts/correct_open_widget_customization.py
      - name: Check patch
        run: git diff --check
      - name: Parse changed Swift
        run: |
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift
      - name: Build and reject new compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Build succeeded.'
            exit 0
          fi
          grep -E 'error:' /tmp/halo-build.log > /tmp/halo-errors.log || true
          cat /tmp/halo-errors.log
          grep -Ev 'ClosedNotchView\.swift:.*compiler is unable to type-check this expression in reasonable time' /tmp/halo-errors.log > /tmp/halo-new-errors.log || true
          if [ -s /tmp/halo-new-errors.log ]; then
            echo 'New compiler errors detected:'
            cat /tmp/halo-new-errors.log
            exit 1
          fi
          if ! grep -Eq 'ClosedNotchView\.swift:.*compiler is unable to type-check this expression in reasonable time' /tmp/halo-errors.log; then
            echo 'Build failed without the known ClosedNotchView baseline error.'
            tail -120 /tmp/halo-build.log
            exit 1
          fi
          echo 'Only the known ClosedNotchView type-check timeout remains.'
      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Views/WidgetViews.swift Halo/Views/ModuleViews.swift Halo/Views/SurfaceView.swift Halo/Views/WidgetSettingsView.swift Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift Docs/WidgetCustomization.md
          git commit -m 'feat: deepen opened notch widget customization'
          git push origin main
