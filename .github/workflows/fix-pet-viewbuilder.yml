name: Fix Pet ViewBuilder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-pet-viewbuilder.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix_pet_viewbuilder.py
      - name: Verify source changes
        run: |
          grep -q 'centralRevealSize' Halo/Core/ExtensionContracts.swift
          git diff --check
      - name: Build Halo
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          cat /tmp/halo-build.log
          if grep -E 'ExtensionContracts.swift:.*error:' /tmp/halo-build.log; then
            exit 1
          fi
          if [ $status -ne 0 ]; then
            if grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log; then
              echo 'Known baseline ClosedNotchView type-check timeout encountered; pet ViewBuilder fix compiled cleanly.'
            else
              exit $status
            fi
          fi
      - name: Commit source fix
        run: |
          git config user.name "Doshagyasing Gowardun"
          git config user.email "45894815+Redstoneinvente@users.noreply.github.com"
          git add Halo/Core/ExtensionContracts.swift
          if ! git diff --cached --quiet; then
            git commit -m "fix: resolve pet reveal ViewBuilder compile error"
            git push origin main
          fi
