name: Refine Onboarding Profiles Appearance

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-onboarding-profiles-appearance.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 .github/scripts/refine_onboarding_profiles_appearance.py

      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'case shared, independent' Halo/App/HaloApp.swift
          grep -q 'How should your displays work together?' Halo/App/HaloApp.swift
          grep -q 'applyLivePreview()' Halo/App/HaloApp.swift
          grep -q 'Halo Display Profile:' Halo/App/HaloApp.swift
          grep -q 'var profileID: UUID?' Halo/Core/WorkspaceModels.swift
          grep -q 'displayProfile?.theme' Halo/NotchEngine/WindowManager.swift
          grep -q 'AppearanceSettingsPane' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'scope: .geometry' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'enum SurfaceAppearanceScope' Halo/Views/SurfaceAppearanceView.swift

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected build error(s):'
              echo "$unexpected"
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/App/HaloApp.swift Halo/Core/WorkspaceModels.swift Halo/Core/WorkspaceStore.swift Halo/NotchEngine/WindowManager.swift Halo/Views/SurfaceAppearanceView.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'feat: refine onboarding display profiles and live preview'
          git push origin main
