name: Add Halo Trials

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-halo-trials.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Apply trial migration
        run: python3 .github/scripts/add_halo_trials.py

      - name: Verify source and backend
        shell: bash
        run: |
          git diff --check
          grep -q 'func startTrial() async' Halo/Core/AppStore.swift
          grep -q 'Start 14-Day Trial' Halo/Core/ExtensionContracts.swift
          grep -q 'Start 14-Day Free Trial' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloTrialEndpoint' Halo/Info.plist
          grep -q 'HALO_TRIAL_ENDPOINT' Halo/Config/Base.xcconfig
          grep -q 'LICENSESEAT_SECRET_KEY' functions/index.js
          grep -q 'demo-14d' functions/index.js
          grep -q 'email_verified' functions/index.js
          grep -q 'haloTrialClaims' firestore.rules
          python3 -m json.tool firebase.json >/dev/null
          python3 -m json.tool functions/package.json >/dev/null
          node --check functions/index.js

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' | grep -q .; then
              echo 'Unexpected build error(s):'
              grep -E 'error:' /tmp/halo-build.log
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit trial implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add .gitignore Halo/Core/AppStore.swift Halo/Core/ExtensionContracts.swift Halo/Views/WorkspaceSettingsView.swift Halo/Info.plist Halo/Config/Base.xcconfig Halo/Config/Secrets.xcconfig.example firebase.json firestore.rules functions/package.json functions/index.js functions/README.md
          git commit -m 'feat: add account-bound 14-day trials'
          git push origin main
