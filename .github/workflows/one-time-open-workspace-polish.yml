name: One-time Opened Notch Workspace Polish

on:
  push:
    paths:
      - 'Scripts/one_time_open_workspace_polish.py'
      - '.github/workflows/one-time-open-workspace-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final opened-notch polish
        run: python3 Scripts/one_time_open_workspace_polish.py
      - name: Validate syntax and diff
        run: |
          xcrun swiftc -parse Halo/Services/Integrations.swift
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          git diff --check
      - name: Build and require no opened-notch compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 220 /tmp/halo-build.log
          if grep -E '(^|/)(Integrations|WorkspaceModels|SurfaceView|ModuleViews|WidgetSettingsView|WorkspaceSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in an opened-notch polish file.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated existing failure; opened-notch polish files have no reported compiler errors.'
          fi
      - name: Commit polish and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Services/Integrations.swift Halo/Core/WorkspaceModels.swift Halo/Views/SurfaceView.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift Halo/Views/WorkspaceSettingsView.swift
          git rm Scripts/one_time_open_workspace_polish.py
          git rm .github/workflows/one-time-open-workspace-polish.yml
          git commit -m 'Polish opened notch editor and lightweight elements'
          git push origin HEAD:main
