name: Apply Halo Pixel Pet Widget

on:
  push:
    branches: [main]
    paths:
      - '.github/pixel-pet-widget-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Implement adaptive Pixel Pet widget
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = r'''import SwiftUI
import AppKit

// MARK: - Halo Pixel Pet
//
// A normal opened-notch widget, deliberately separate from Halo's dormant Environmental Interface.
// The pet grows in *world complexity* with the 1x1...8x4 footprint instead of merely scaling up.

enum HaloPixelPetSpecies: String, Codable, CaseIterable, Identifiable {
    case cat = "Cat"
    case dog = "Dog"
    case fox = "Fox"
    case rabbit = "Rabbit"
    case robot = "Robot"
    case slime = "Slime"
    case ghost = "Ghost"
    var id: String { rawValue }
}

enum HaloPixelPetPersonality: String, Codable, CaseIterable, Identifiable {
    case sleepy = "Sleepy"
    case playful = "Playful"
    case chaotic = "Chaotic"
    case curious = "Curious"
    case affectionate = "Affectionate"
    case independent = "Independent"
    var id: String { rawValue }
}

enum HaloPixelPetNeedsMode: String, Codable, CaseIterable, Identifiable {
    case off = "Off"
    case casual = "Casual"
    case full = "Full"
    var id: String { rawValue }
}

enum HaloPixelPetEnvironment: String, Codable, CaseIterable, Identifiable {
    case cozy = "Cozy Bedroom"
    case cyberpunk = "Cyberpunk"
    case japanese = "Japanese Room"
    case arcade = "Arcade"
    case space = "Space Station"
    case forest = "Forest Cabin"
    case minimal = "Minimal Mac"
    case developer = "Developer Cave"
    var id: String { rawValue }
}

enum HaloPixelPetPalette: String, Codable, CaseIterable, Identifiable {
    case classic = "Classic"
    case gameBoy = "Game Boy"
    case monochrome = "Monochrome"
    case amber = "Amber CRT"
    case neon = "Neon"
    case custom = "Custom"
    var id: String { rawValue }
}

enum HaloPixelPetLEDMode: String, Codable, CaseIterable, Identifiable {
    case off = "Off"
    case status = "Pet Status"
    case breathing = "Breathing"
    case music = "Music"
    case environment = "Environment"
    var id: String { rawValue }
}

enum HaloPixelPetActivity: String, Codable {
    case idle, walk, sleep, eat, play, dance, working, gaming, charging, timer, greet, celebrate, concerned
}

struct HaloPixelPetRGB: Codable, Equatable {
    var red: Double
    var green: Double
    var blue: Double

    var color: Color {
        Color(red: min(1, max(0, red)), green: min(1, max(0, green)), blue: min(1, max(0, blue)))
    }
}

struct HaloPixelPetPreferences: Codable, Equatable {
    var version = 1
    var name = "Pixel"
    var species: HaloPixelPetSpecies = .cat
    var personality: HaloPixelPetPersonality = .curious
    var needsMode: HaloPixelPetNeedsMode = .casual
    var environment: HaloPixelPetEnvironment = .cozy
    var palette: HaloPixelPetPalette = .classic
    var customPrimary = HaloPixelPetRGB(red: 0.93, green: 0.64, blue: 0.34)
    var customAccent = HaloPixelPetRGB(red: 0.98, green: 0.92, blue: 0.72)
    var autonomy = 0.78
    var animationSpeed = 1.0
    var interactionFrequency = 0.62
    var dayNightCycle = true
    var soundEffects = false
    var showWindow = true
    var showFurniture = true
    var showAmbientEvents = true
    var ledMode: HaloPixelPetLEDMode = .status
    var ledSize = 4.0
    var ledBrightness = 0.82
    var ledBloom = 3.0

    func normalized() -> HaloPixelPetPreferences {
        var value = self
        value.version = 1
        value.name = String(name.trimmingCharacters(in: .whitespacesAndNewlines).prefix(24))
        if value.name.isEmpty { value.name = "Pixel" }
        value.autonomy = min(1, max(0, autonomy))
        value.animationSpeed = min(2, max(0.35, animationSpeed))
        value.interactionFrequency = min(1, max(0, interactionFrequency))
        value.ledSize = min(9, max(2, ledSize))
        value.ledBrightness = min(1, max(0.15, ledBrightness))
        value.ledBloom = min(12, max(0, ledBloom))
        value.customPrimary.red = min(1, max(0, value.customPrimary.red))
        value.customPrimary.green = min(1, max(0, value.customPrimary.green))
        value.customPrimary.blue = min(1, max(0, value.customPrimary.blue))
        value.customAccent.red = min(1, max(0, value.customAccent.red))
        value.customAccent.green = min(1, max(0, value.customAccent.green))
        value.customAccent.blue = min(1, max(0, value.customAccent.blue))
        return value
    }

    var primaryColor: Color {
        switch palette {
        case .classic:
            switch species {
            case .cat: return Color(red: 0.92, green: 0.64, blue: 0.36)
            case .dog: return Color(red: 0.73, green: 0.48, blue: 0.27)
            case .fox: return Color(red: 0.96, green: 0.39, blue: 0.16)
            case .rabbit: return Color(red: 0.84, green: 0.82, blue: 0.86)
            case .robot: return Color(red: 0.44, green: 0.72, blue: 0.86)
            case .slime: return Color(red: 0.33, green: 0.84, blue: 0.52)
            case .ghost: return Color(red: 0.76, green: 0.78, blue: 0.94)
            }
        case .gameBoy: return Color(red: 0.39, green: 0.48, blue: 0.22)
        case .monochrome: return Color(white: 0.82)
        case .amber: return Color(red: 1.0, green: 0.58, blue: 0.12)
        case .neon: return Color(red: 0.24, green: 0.92, blue: 0.90)
        case .custom: return customPrimary.color
        }
    }

    var accentColor: Color {
        switch palette {
        case .classic: return Color(red: 1.0, green: 0.91, blue: 0.67)
        case .gameBoy: return Color(red: 0.72, green: 0.78, blue: 0.42)
        case .monochrome: return .white
        case .amber: return Color(red: 1.0, green: 0.82, blue: 0.36)
        case .neon: return Color(red: 1.0, green: 0.27, blue: 0.75)
        case .custom: return customAccent.color
        }
    }
}

struct HaloPixelPetState: Codable, Equatable {
    var hunger = 0.88
    var energy = 0.82
    var affection = 0.72
    var lastInteraction = Date()
    var lastCareUpdate = Date()
}

struct HaloPixelPetNeedsSnapshot {
    let hunger: Double
    let energy: Double
    let affection: Double
    var needsAttention: Bool { hunger < 0.34 || energy < 0.28 }
}

@MainActor
final class HaloPixelPetStore: ObservableObject {
    static let shared = HaloPixelPetStore()

    @Published var preferences: HaloPixelPetPreferences {
        didSet { persistPreferences() }
    }
    @Published private(set) var state: HaloPixelPetState {
        didSet { persistState() }
    }
    @Published private(set) var transientActivity: HaloPixelPetActivity?

    private let defaults: UserDefaults
    private let preferencesKey = "HaloPixelPet.preferences.v1"
    private let stateKey = "HaloPixelPet.state.v1"
    private var clearActivityWork: DispatchWorkItem?

    init(defaults: UserDefaults = .standard) {
        self.defaults = defaults
        if let data = defaults.data(forKey: preferencesKey),
           let decoded = try? JSONDecoder().decode(HaloPixelPetPreferences.self, from: data),
           decoded.version == 1 {
            preferences = decoded.normalized()
        } else {
            preferences = HaloPixelPetPreferences()
        }
        if let data = defaults.data(forKey: stateKey),
           let decoded = try? JSONDecoder().decode(HaloPixelPetState.self, from: data) {
            state = decoded
        } else {
            state = HaloPixelPetState()
        }
    }

    func update<T>(_ keyPath: WritableKeyPath<HaloPixelPetPreferences, T>, _ value: T) {
        var next = preferences
        next[keyPath: keyPath] = value
        preferences = next.normalized()
    }

    func reset() {
        preferences = HaloPixelPetPreferences()
        state = HaloPixelPetState()
        transientActivity = nil
    }

    func needs(at date: Date) -> HaloPixelPetNeedsSnapshot {
        let hours = max(0, date.timeIntervalSince(state.lastCareUpdate) / 3600)
        switch preferences.needsMode {
        case .off:
            return HaloPixelPetNeedsSnapshot(hunger: 1, energy: 1, affection: max(0.65, state.affection))
        case .casual:
            return HaloPixelPetNeedsSnapshot(
                hunger: max(0.45, state.hunger - hours * 0.010),
                energy: max(0.42, state.energy - hours * 0.007),
                affection: max(0.42, state.affection - hours * 0.004)
            )
        case .full:
            // Full still never punishes the user with death or irreversible state.
            return HaloPixelPetNeedsSnapshot(
                hunger: max(0.20, state.hunger - hours * 0.022),
                energy: max(0.18, state.energy - hours * 0.016),
                affection: max(0.28, state.affection - hours * 0.008)
            )
        }
    }

    func feed() {
        applyCare(hunger: 0.28, energy: 0.04, affection: 0.03, activity: .eat)
    }

    func pet() {
        applyCare(hunger: 0, energy: 0.01, affection: 0.16, activity: .greet)
    }

    func play() {
        applyCare(hunger: -0.02, energy: -0.04, affection: 0.14, activity: .play)
    }

    func quickReaction() {
        show(.greet, seconds: 1.2)
    }

    private func applyCare(hunger: Double, energy: Double, affection: Double, activity: HaloPixelPetActivity) {
        let current = needs(at: Date())
        state.hunger = min(1, max(0, current.hunger + hunger))
        state.energy = min(1, max(0, current.energy + energy))
        state.affection = min(1, max(0, current.affection + affection))
        state.lastCareUpdate = Date()
        state.lastInteraction = Date()
        show(activity, seconds: 2.1)
        if preferences.soundEffects {
            NSSound(named: NSSound.Name("Tink"))?.play()
        }
    }

    func show(_ activity: HaloPixelPetActivity, seconds: Double) {
        clearActivityWork?.cancel()
        transientActivity = activity
        let work = DispatchWorkItem { [weak self] in self?.transientActivity = nil }
        clearActivityWork = work
        DispatchQueue.main.asyncAfter(deadline: .now() + seconds, execute: work)
    }

    private func persistPreferences() {
        if let data = try? JSONEncoder().encode(preferences.normalized()) {
            defaults.set(data, forKey: preferencesKey)
        }
    }

    private func persistState() {
        if let data = try? JSONEncoder().encode(state) {
            defaults.set(data, forKey: stateKey)
        }
    }
}

private struct HaloPixelPetContext {
    let activity: HaloPixelPetActivity
    let detail: String

    static func resolve(store: AppStore,
                        media: MediaService,
                        system: SystemService,
                        pet: HaloPixelPetStore,
                        date: Date) -> HaloPixelPetContext {
        if let forced = pet.transientActivity {
            return HaloPixelPetContext(activity: forced, detail: "Interacting")
        }
        let needs = pet.needs(at: date)
        if store.finished { return HaloPixelPetContext(activity: .celebrate, detail: "Focus complete") }
        if store.deadline != nil || store.pausedSeconds > 0 {
            return HaloPixelPetContext(activity: .timer, detail: "Keeping time")
        }
        if system.charging { return HaloPixelPetContext(activity: .charging, detail: "Charging together") }
        if let battery = system.battery, battery <= 15 {
            return HaloPixelPetContext(activity: .concerned, detail: "Battery is low")
        }
        if media.isPlaying { return HaloPixelPetContext(activity: .dance, detail: "Listening to music") }

        let app = NSWorkspace.shared.frontmostApplication
        let bundle = app?.bundleIdentifier?.lowercased() ?? ""
        let appName = app?.localizedName?.lowercased() ?? ""
        if bundle == "com.apple.dt.xcode" || appName == "xcode" {
            return HaloPixelPetContext(activity: .working, detail: "Coding with you")
        }
        let gameHints = ["steam", "minecraft", "roblox", "retroarch", "whisky", "crossover"]
        if gameHints.contains(where: { bundle.contains($0) || appName.contains($0) }) {
            return HaloPixelPetContext(activity: .gaming, detail: "Game mode")
        }
        if needs.energy < 0.34 { return HaloPixelPetContext(activity: .sleep, detail: "Taking a nap") }
        if needs.hunger < 0.34 { return HaloPixelPetContext(activity: .concerned, detail: "Could use a snack") }

        let hour = Calendar.autoupdatingCurrent.component(.hour, from: date)
        if hour >= 23 || hour < 6 { return HaloPixelPetContext(activity: .sleep, detail: "Late-night nap") }

        let phase = Int(date.timeIntervalSinceReferenceDate / max(12, 42 - pet.preferences.autonomy * 26)) % 6
        switch pet.preferences.personality {
        case .sleepy where phase <= 1: return HaloPixelPetContext(activity: .sleep, detail: "Dozing")
        case .playful where phase <= 2: return HaloPixelPetContext(activity: .play, detail: "Playing")
        case .chaotic where phase <= 2: return HaloPixelPetContext(activity: phase == 0 ? .dance : .walk, detail: "Causing tiny trouble")
        case .curious where phase <= 2: return HaloPixelPetContext(activity: .walk, detail: "Exploring")
        case .affectionate where phase == 0: return HaloPixelPetContext(activity: .greet, detail: "Checking in")
        case .independent: break
        default: break
        }
        return HaloPixelPetContext(activity: phase == 0 ? .walk : .idle, detail: "Hanging out")
    }
}

struct HaloPixelPetWidget: View {
    @Environment(\.openNotchAvailableWidth) private var availableWidth
    @Environment(\.openNotchAvailableHeight) private var availableHeight
    @Environment(\.openNotchGridColumnSpan) private var gridColumnSpan
    @Environment(\.openNotchGridRowSpan) private var gridRowSpan
    @Environment(\.accessibilityReduceMotion) private var reduceMotion

    @ObservedObject var store: AppStore
    @ObservedObject var workspace: WorkspaceStore
    @ObservedObject private var pet = HaloPixelPetStore.shared
    @ObservedObject private var media: MediaService
    @ObservedObject private var system: SystemService

    @State private var cursor = CGPoint.zero
    @State private var hovering = false
    @State private var dragPetting = false

    init(store: AppStore, workspace: WorkspaceStore) {
        self.store = store
        self.workspace = workspace
        _media = ObservedObject(wrappedValue: workspace.media)
        _system = ObservedObject(wrappedValue: workspace.system)
    }

    var body: some View {
        TimelineView(.animation(minimumInterval: reduceMotion ? 0.8 : 1.0 / 12.0, paused: false)) { timeline in
            GeometryReader { proxy in
                let columns = min(8, max(1, gridColumnSpan ?? estimateColumns(proxy.size.width)))
                let rows = min(4, max(1, gridRowSpan ?? estimateRows(proxy.size.height)))
                let resolved = HaloPixelPetContext.resolve(store: store, media: media, system: system, pet: pet, date: timeline.date)
                let needs = pet.needs(at: timeline.date)
                HaloPixelPetHabitat(
                    columns: columns,
                    rows: rows,
                    size: proxy.size,
                    date: timeline.date,
                    activity: resolved.activity,
                    activityDetail: resolved.detail,
                    needs: needs,
                    preferences: pet.preferences,
                    musicPlaying: media.isPlaying,
                    cursor: cursor,
                    cursorActive: hovering,
                    reduceMotion: reduceMotion
                )
            }
        }
        .contentShape(Rectangle())
        .onTapGesture(count: 2) { pet.pet() }
        .onTapGesture { pet.quickReaction() }
        .simultaneousGesture(
            DragGesture(minimumDistance: 8)
                .onChanged { _ in dragPetting = true }
                .onEnded { _ in
                    if dragPetting { pet.pet() }
                    dragPetting = false
                }
        )
        .onContinuousHover { phase in
            switch phase {
            case .active(let point):
                cursor = point
                hovering = true
            case .ended:
                hovering = false
            }
        }
        .contextMenu {
            Button("Feed \(pet.preferences.name)") { pet.feed() }
            Button("Pet \(pet.preferences.name)") { pet.pet() }
            Button("Play") { pet.play() }
            Divider()
            Button("Pixel Pet Settings…") { HaloPixelPetSettingsWindowController.shared.show() }
        }
        .help("Click to greet · double-click or drag to pet · right-click for care and settings")
        .accessibilityElement(children: .combine)
        .accessibilityLabel("Halo Pixel Pet, \(pet.preferences.name)")
    }

    private func estimateColumns(_ width: CGFloat) -> Int {
        min(8, max(1, Int((width / 96).rounded())))
    }

    private func estimateRows(_ height: CGFloat) -> Int {
        min(4, max(1, Int((height / 84).rounded())))
    }
}

private struct HaloPixelPetHabitat: View {
    let columns: Int
    let rows: Int
    let size: CGSize
    let date: Date
    let activity: HaloPixelPetActivity
    let activityDetail: String
    let needs: HaloPixelPetNeedsSnapshot
    let preferences: HaloPixelPetPreferences
    let musicPlaying: Bool
    let cursor: CGPoint
    let cursorActive: Bool
    let reduceMotion: Bool

    private var tiny: Bool { columns == 1 && rows == 1 }
    private var strip: Bool { rows == 1 && columns > 1 }
    private var vertical: Bool { columns == 1 && rows > 1 }
    private var worldTier: Int {
        if tiny { return 0 }
        if strip || vertical { return 1 }
        if columns <= 2 && rows <= 2 { return 2 }
        if columns <= 3 && rows <= 2 { return 3 }
        if columns <= 4 && rows <= 2 { return 4 }
        if columns <= 6 && rows <= 3 { return 5 }
        if columns >= 7 && rows >= 3 && !(columns == 8 && rows == 4) { return 6 }
        if columns == 8 && rows == 4 { return 7 }
        return 5
    }

    var body: some View {
        ZStack {
            HaloPixelPetBackdrop(environment: preferences.environment,
                                 dayNight: preferences.dayNightCycle,
                                 date: date,
                                 tier: worldTier)

            if tiny {
                tinyPet
            } else {
                if preferences.showWindow && (vertical || rows >= 2) {
                    HaloPixelWindow(date: date, dayNight: preferences.dayNightCycle)
                        .frame(width: min(82, size.width * 0.26), height: min(58, size.height * 0.28))
                        .position(x: vertical ? size.width * 0.5 : size.width * 0.18,
                                  y: vertical ? size.height * 0.20 : size.height * 0.23)
                }
                if preferences.showFurniture { furniture }
                if worldTier >= 6 && preferences.showAmbientEvents { ambientEvent }
                if worldTier == 7 { fullHabitatDividers }
                petInWorld
                if rows >= 2 && columns >= 3 { statusCaption }
            }

            HaloPixelPetLED(mode: preferences.ledMode,
                            activity: activity,
                            needs: needs,
                            musicPlaying: musicPlaying,
                            environment: preferences.environment,
                            size: preferences.ledSize,
                            brightness: preferences.ledBrightness,
                            bloom: preferences.ledBloom,
                            date: date)
                .padding(7)
                .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .topTrailing)
        }
        .clipShape(RoundedRectangle(cornerRadius: tiny ? 10 : 14, style: .continuous))
        .overlay {
            RoundedRectangle(cornerRadius: tiny ? 10 : 14, style: .continuous)
                .stroke(Color.white.opacity(0.055), lineWidth: 1)
                .allowsHitTesting(false)
        }
    }

    private var tinyPet: some View {
        let side = min(size.width, size.height) * 0.76
        return HaloPixelPetSprite(species: preferences.species,
                                  activity: activity,
                                  primary: preferences.primaryColor,
                                  accent: preferences.accentColor,
                                  phase: phase)
            .frame(width: side, height: side)
            .offset(y: activity == .sleep ? 4 : 0)
            .overlay(alignment: .topTrailing) {
                if needs.needsAttention {
                    Text("!")
                        .font(.system(size: 9, weight: .black, design: .monospaced))
                        .foregroundStyle(.orange)
                        .offset(x: 4, y: -3)
                }
            }
    }

    private var petInWorld: some View {
        let sprite = min(max(38, min(size.width / CGFloat(max(2, columns)), size.height * 0.36)), worldTier >= 5 ? 74 : 62)
        let floorY = size.height * (vertical ? 0.80 : 0.73)
        let targetX: CGFloat = {
            if cursorActive && preferences.autonomy > 0.25 && [HaloPixelPetPersonality.curious, .playful, .chaotic].contains(preferences.personality) {
                return min(size.width - sprite * 0.55, max(sprite * 0.55, cursor.x))
            }
            if activity == .walk || activity == .play || activity == .dance {
                let travel = max(0, size.width - sprite - 18)
                return sprite * 0.5 + 9 + travel * CGFloat((sin(phase * 0.72) + 1) * 0.5)
            }
            if activity == .working { return worldTier >= 4 ? size.width * 0.72 : size.width * 0.58 }
            if activity == .charging { return size.width * 0.78 }
            return size.width * 0.5
        }()
        let bounce: CGFloat = reduceMotion ? 0 : CGFloat(activity == .dance ? sin(phase * 3.4) * 5 : activity == .walk ? abs(sin(phase * 2.2)) * -2 : 0)
        return HaloPixelPetSprite(species: preferences.species,
                                  activity: activity,
                                  primary: preferences.primaryColor,
                                  accent: preferences.accentColor,
                                  phase: phase)
            .frame(width: sprite, height: sprite)
            .position(x: targetX, y: floorY - sprite * 0.38 + bounce)
            .animation(reduceMotion ? nil : .easeInOut(duration: 0.18), value: targetX)
    }

    @ViewBuilder private var furniture: some View {
        let floor = size.height * 0.76
        if columns >= 2 {
            HaloPixelBed(accent: preferences.accentColor)
                .frame(width: min(76, size.width * 0.22), height: 34)
                .position(x: size.width * 0.84, y: floor - 8)
        }
        if columns >= 2 && rows >= 2 {
            HaloPixelBowl(color: preferences.primaryColor)
                .frame(width: 28, height: 18)
                .position(x: size.width * 0.34, y: floor + 2)
            HaloPixelToy(color: preferences.accentColor)
                .frame(width: 24, height: 24)
                .position(x: size.width * 0.47, y: floor - 1)
        }
        if columns >= 3 && rows >= 2 {
            HaloPixelPlant()
                .frame(width: 34, height: 52)
                .position(x: size.width * 0.08, y: floor - 22)
        }
        if worldTier >= 4 {
            HaloPixelComputer(active: activity == .working || activity == .gaming || activity == .timer,
                              accent: preferences.accentColor)
                .frame(width: 56, height: 50)
                .position(x: size.width * 0.70, y: floor - 25)
        }
        if worldTier >= 5 {
            HaloPixelLamp(on: isNight, accent: preferences.accentColor)
                .frame(width: 30, height: 58)
                .position(x: size.width * 0.57, y: floor - 29)
        }
        if strip {
            HaloPixelToy(color: preferences.accentColor)
                .frame(width: 20, height: 20)
                .position(x: size.width * 0.22, y: size.height * 0.73)
        }
    }

    private var statusCaption: some View {
        VStack(alignment: .leading, spacing: 1) {
            Text(preferences.name)
                .font(.system(size: 9, weight: .bold, design: .monospaced))
            Text(activityDetail)
                .font(.system(size: 8, weight: .medium, design: .monospaced))
                .foregroundStyle(.secondary)
        }
        .padding(.horizontal, 6)
        .padding(.vertical, 4)
        .background(Color.black.opacity(0.24), in: RoundedRectangle(cornerRadius: 4))
        .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .topLeading)
        .padding(7)
    }

    private var ambientEvent: some View {
        let eventPhase = Int(date.timeIntervalSince1970 / 18) % 4
        return Group {
            switch eventPhase {
            case 0:
                HaloPixelShootingStar(accent: preferences.accentColor)
                    .frame(width: 54, height: 24)
                    .position(x: size.width * 0.72, y: size.height * 0.16)
            case 1:
                HaloPixelButterfly(accent: preferences.primaryColor)
                    .frame(width: 22, height: 18)
                    .position(x: size.width * CGFloat(0.28 + 0.08 * sin(phase)), y: size.height * 0.34)
            case 2:
                HaloPixelParcel(accent: preferences.accentColor)
                    .frame(width: 30, height: 24)
                    .position(x: size.width * 0.91, y: size.height * 0.69)
            default:
                EmptyView()
            }
        }
    }

    private var fullHabitatDividers: some View {
        ZStack {
            Rectangle().fill(Color.white.opacity(0.07)).frame(width: 1).position(x: size.width * 0.50, y: size.height * 0.38)
            Rectangle().fill(Color.white.opacity(0.05)).frame(height: 1).position(x: size.width * 0.50, y: size.height * 0.56)
            Text("BEDROOM").font(.system(size: 7, weight: .bold, design: .monospaced)).foregroundStyle(.secondary)
                .position(x: size.width * 0.30, y: size.height * 0.08)
            Text("LIVING").font(.system(size: 7, weight: .bold, design: .monospaced)).foregroundStyle(.secondary)
                .position(x: size.width * 0.70, y: size.height * 0.08)
        }
        .allowsHitTesting(false)
    }

    private var phase: Double {
        date.timeIntervalSinceReferenceDate * preferences.animationSpeed
    }

    private var isNight: Bool {
