private struct HaloPixelPetSprite: View {
    let species: HaloPixelPetSpecies
    let activity: HaloPixelPetActivity
    let primary: Color
    let accent: Color
    let phase: Double

    var body: some View {
        Canvas { context, size in
            let cell = max(1, floor(min(size.width / 16, size.height / 16)))
            let origin = CGPoint(x: floor((size.width - cell * 16) / 2), y: floor((size.height - cell * 16) / 2))
            func box(_ x: Int, _ y: Int, _ w: Int, _ h: Int, _ color: Color) {
                let rect = CGRect(x: origin.x + CGFloat(x) * cell,
                                  y: origin.y + CGFloat(y) * cell,
                                  width: CGFloat(w) * cell,
                                  height: CGFloat(h) * cell)
                context.fill(Path(rect), with: .color(color))
            }

            let dark = Color.black.opacity(0.62)
            if species == .slime {
                box(3, 6, 10, 6, primary); box(4, 4, 8, 3, primary)
                box(5, 7, 2, activity == .sleep ? 1 : 2, dark); box(10, 7, 2, activity == .sleep ? 1 : 2, dark)
                box(7, 10, 3, 1, accent)
                return
            }
            if species == .ghost {
                box(4, 3, 8, 9, primary); box(3, 5, 10, 6, primary)
                box(4, 12, 2, 2, primary); box(8, 12, 2, 2, primary); box(11, 12, 2, 2, primary)
                box(5, 6, 2, activity == .sleep ? 1 : 2, dark); box(9, 6, 2, activity == .sleep ? 1 : 2, dark)
                return
            }
            if species == .robot {
                box(4, 3, 8, 7, primary); box(5, 10, 6, 4, primary)
                box(7, 1, 2, 2, accent); box(8, 0, 1, 2, accent)
                box(5, 6, 2, 2, activity == .sleep ? dark.opacity(0.7) : accent)
                box(9, 6, 2, 2, activity == .sleep ? dark.opacity(0.7) : accent)
                box(4, 14, 2, 1, dark); box(10, 14, 2, 1, dark)
                return
            }

            // Body and head shared by the animal species.
            box(4, 7, 8, 6, primary)
            box(5, 4, 7, 6, primary)
            box(4, 12, 2, 2, primary); box(10, 12, 2, 2, primary)

            switch species {
            case .cat:
                box(5, 2, 2, 3, primary); box(10, 2, 2, 3, primary); box(6, 3, 1, 1, accent); box(10, 3, 1, 1, accent)
                box(12, 9, 2, 2, primary); box(13, 7, 1, 3, primary)
            case .dog:
                box(4, 3, 2, 5, primary); box(11, 3, 2, 5, primary); box(12, 10, 2, 2, primary)
            case .fox:
                box(4, 2, 3, 4, primary); box(10, 2, 3, 4, primary); box(12, 9, 3, 3, primary); box(14, 10, 1, 2, accent)
            case .rabbit:
                box(5, 0, 2, 5, primary); box(10, 0, 2, 5, primary); box(6, 1, 1, 3, accent); box(10, 1, 1, 3, accent)
            default: break
            }

            if activity == .sleep {
                box(6, 7, 2, 1, dark); box(9, 7, 2, 1, dark)
            } else {
                box(6, 6, 2, 2, dark); box(9, 6, 2, 2, dark)
                if activity == .dance || activity == .celebrate {
                    box(6, 6, 1, 1, accent); box(9, 6, 1, 1, accent)
                }
            }
            box(8, 8, 1, 1, dark)
            if activity == .greet || activity == .celebrate { box(7, 9, 3, 1, accent) }
            if activity == .working { box(3, 10, 2, 1, accent) }
            if activity == .gaming { box(4, 5, 1, 4, accent); box(12, 5, 1, 4, accent) }
            if activity == .charging { box(13, 12, 2, 1, Color.green.opacity(0.9)) }
            if activity == .timer { box(13, 4, 2, 2, accent) }
        }
        .accessibilityHidden(true)
    }
}

private struct HaloPixelPetLED: View {
    let mode: HaloPixelPetLEDMode
    let activity: HaloPixelPetActivity
    let needs: HaloPixelPetNeedsSnapshot
    let musicPlaying: Bool
    let environment: HaloPixelPetEnvironment
    let size: Double
    let brightness: Double
    let bloom: Double
    let date: Date

    private var baseColor: Color {
        switch mode {
        case .off: return .clear
        case .status:
            if needs.needsAttention || activity == .concerned { return .red }
            if needs.hunger < 0.55 { return .orange }
            if activity == .sleep { return .blue }
            return .green
        case .breathing: return activity == .sleep ? .blue : .green
        case .music: return musicPlaying ? .purple : .gray
        case .environment:
            switch environment {
            case .cyberpunk, .arcade: return .pink
            case .space: return .cyan
            case .forest: return .green
            case .developer: return .mint
            default: return .orange
            }
        }
    }

    var body: some View {
        if mode != .off {
            let seconds = date.timeIntervalSinceReferenceDate
            let pulse: Double = {
                switch mode {
                case .breathing: return 0.58 + 0.42 * ((sin(seconds * 2.0) + 1) * 0.5)
                case .music where musicPlaying: return 0.55 + 0.45 * ((sin(seconds * 8.0) + 1) * 0.5)
                default: return 1
                }
            }()
            Rectangle()
                .fill(baseColor.opacity(brightness * pulse))
                .frame(width: size, height: size)
                .shadow(color: baseColor.opacity(0.55 * brightness * pulse), radius: bloom)
                .accessibilityLabel("Pixel Pet LED")
        }
    }
}

