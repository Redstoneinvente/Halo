          replacements = [
              (build_anchor, build_anchor + f'\n\t\t{build_id} /* Views/PixelPetWidget.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {ref_id} /* Views/PixelPetWidget.swift */; }};'),
              (ref_anchor, ref_anchor + f'\n\t\t{ref_id} /* Views/PixelPetWidget.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = Views/PixelPetWidget.swift; sourceTree = "<group>"; }};'),
              (group_anchor, group_anchor + f'\n\t\t\t\t{ref_id} /* Views/PixelPetWidget.swift */,'),
              (sources_anchor, sources_anchor + f'\n\t\t\t\t{build_id} /* Views/PixelPetWidget.swift in Sources */,'),
          ]
          for old, new in replacements:
              count = project.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one Xcode project anchor, found {count}: {old}')
              project = project.replace(old, new, 1)
          project_path.write_text(project)

          print('Pixel Pet source written and project patched.')
          PY

      - name: Verify Pixel Pet source and core model
        run: |
          xcrun swiftc -parse Halo/Views/PixelPetWidget.swift
          swift test

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-pixel-pet-build.log

      - name: Commit Pixel Pet to main
        run: |
          rm -f .github/pixel-pet-widget-trigger.txt
          rm -f .github/workflows/apply-pixel-pet-widget.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement adaptive Halo Pixel Pet widget'
          git push origin HEAD:main
