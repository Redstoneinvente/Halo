name: Add Commercial Access Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-commercial-gate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migration
        run: python3 .github/scripts/add_commercial_gate.py
      - name: Verify source changes
        run: |
          git diff --check
          grep -q 'func sendVerificationEmail() async' Halo/Core/AppStore.swift
          grep -q 'Activated Macs' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloCommercialWelcomeCompleted' Halo/App/HaloApp.swift
          grep -q 'r.support@redstoneinvente.com' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'r.support@redstoneinvente.com' Halo/App/HaloApp.swift
      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo 'Build failed; checking whether failure is only the known ClosedNotchView compiler timeout.'
            if grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' | grep -q .; then
              echo 'Unexpected build error(s):'
              grep -E 'error:' /tmp/halo-build.log
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi
      - name: Commit source changes
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/AppStore.swift Halo/Views/WorkspaceSettingsView.swift Halo/App/HaloApp.swift
          git commit -m 'feat: gate Halo behind account and license'
          git push origin main
