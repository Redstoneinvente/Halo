name: Sparkle Gate 1 Runpath Only

on:
  push:
    branches:
      - feature/sparkle-2-gate1
    paths:
      - '.github/scripts/fix_sparkle_gate1_runpath.py'
      - '.github/workflows/sparkle-gate1-runpath-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal Sparkle Gate 1 correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/fix_sparkle_gate1_runpath.py
          git diff --check

          xcodebuild -resolvePackageDependencies -project Halo.xcodeproj -scheme Halo
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug -showBuildSettings > /tmp/halo-build-settings.txt

          grep 'LD_RUNPATH_SEARCH_PATHS' /tmp/halo-build-settings.txt | grep -q '@executable_path/../Frameworks'
          grep -q 'Sparkle in Frameworks' Halo.xcodeproj/project.pbxproj
          grep -q 'packageProductDependencies' Halo.xcodeproj/project.pbxproj
          ! grep -q 'Sparkle in Embed Frameworks' Halo.xcodeproj/project.pbxproj
          ! grep -q 'A11C0F1A0000000000000357 /\* Embed Frameworks \*/' Halo.xcodeproj/project.pbxproj

          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > /tmp/halo-sparkle-runpath.log 2>&1
          STATUS=$?
          set -e

          if grep -E 'Sparkle-product|The file .*Sparkle-product.*couldn.t be opened|Multiple commands produce.*Sparkle' /tmp/halo-sparkle-runpath.log; then
            tail -n 300 /tmp/halo-sparkle-runpath.log
            exit 1
          fi

          echo "Halo baseline build status: $STATUS"

          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo.xcodeproj/project.pbxproj
          if ! git diff --cached --quiet; then
            git commit -m 'Use Sparkle SPM with app Frameworks runpath'
            git push origin HEAD:feature/sparkle-2-gate1
          fi
