name: Integrate Halo Pixel Pet Widget v5

on:
  push:
    branches: [main]
    paths:
      - '.github/pixel-pet-widget-v5-trigger.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Pixel Pet integration
        run: python3 .github/scripts/integrate_pixel_pet.py

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Build Halo app
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-pixel-pet-build.log

      - name: Commit successful integration to main
        run: |
          rm -f .github/pixel-pet-widget-trigger.txt
          rm -f .github/pixel-pet-widget-v2-trigger.txt
          rm -f .github/pixel-pet-widget-v3-trigger.txt
          rm -f .github/pixel-pet-widget-v4-trigger.txt
          rm -f .github/pixel-pet-widget-v5-trigger.txt
          rm -f .github/scripts/integrate_pixel_pet.py
          rm -f .github/workflows/apply-pixel-pet-widget.yml
          rm -f .github/workflows/apply-pixel-pet-widget-v2.yml
          rm -f .github/workflows/apply-pixel-pet-widget-v3.yml
          rm -f .github/workflows/apply-pixel-pet-widget-v4.yml
          rm -f .github/workflows/apply-pixel-pet-widget-v5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate adaptive Halo Pixel Pet widget'
          git push origin HEAD:main
