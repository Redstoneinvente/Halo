name: One-time Opened Notch Workspace Architecture

on:
  push:
    paths:
      - 'Scripts/one_time_open_workspace_architecture.py'
      - '.github/workflows/one-time-open-workspace-architecture.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply opened-notch workspace architecture
        run: python3 Scripts/one_time_open_workspace_architecture.py

      - name: Validate Swift syntax
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Core/WidgetModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift

      - name: Validate diff
        run: git diff --check

      - name: Check changed files for compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 180 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceModels|WidgetModels|WidgetViews|SurfaceView|WidgetSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in an opened-notch architecture file.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated existing failure; opened-notch architecture files have no reported compiler errors.'
          fi

      - name: Commit architecture and clean helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Core/WidgetModels.swift Halo/Views/WidgetViews.swift Halo/Views/SurfaceView.swift Halo/Views/WidgetSettingsView.swift
          git rm Scripts/one_time_open_workspace_architecture.py
          git rm .github/workflows/one-time-open-workspace-architecture.yml
          git commit -m 'Build modular opened notch workspace architecture'
          git push origin HEAD:main
