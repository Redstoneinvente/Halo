name: Fix Closed Widget Font Measurement
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-closed-widget-font-measurement.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/fix_closed_widget_font_measurement.py
      - run: git diff --check
      - run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/NotchEngine/WindowManager.swift
          git commit -m 'fix: resolve closed widget font measurement'
          git push origin main
