name: Fix EI Hotkey Sprite Alpha

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-ei-hotkey-sprite-alpha.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fixes
        run: python3 .github/scripts/fix_ei_hotkey_and_sprite_alpha.py

      - name: Verify formatting
        run: git diff --check

      - name: Compile changed sources
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          grep -E 'SwiftCompile normal arm64 .*CompanionSprite\.swift|SwiftCompile normal arm64 .*Integrations\.swift|error:' /tmp/halo-build.log | tail -160 || true
          if grep -Eq '(CompanionSprite|Integrations)\.swift:[0-9]+:[0-9]+: error:' /tmp/halo-build.log; then
            echo 'Changed source compilation failed.'
            exit 65
          fi
          if ! grep -Eq 'SwiftCompile normal arm64 .*/CompanionSprite\.swift' /tmp/halo-build.log; then
            echo 'CompanionSprite.swift was not compiled; refusing to commit.'
            exit 66
          fi
          if ! grep -Eq 'SwiftCompile normal arm64 .*/Integrations\.swift' /tmp/halo-build.log; then
            echo 'Integrations.swift was not compiled; refusing to commit.'
            exit 67
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full target has unrelated errors; changed sources compiled cleanly.'
          fi

      - name: Commit validated fixes
        shell: bash
        run: |
          if git diff --quiet -- Halo/Views/CompanionSprite.swift Halo/Services/Integrations.swift; then
            echo 'No source changes to commit'
            exit 0
          fi
          git config user.name 'Halo Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Halo/Views/CompanionSprite.swift Halo/Services/Integrations.swift
          git commit -m 'fix: EI shortcut dispatch and pet sprite alpha'
          git push origin HEAD:main
