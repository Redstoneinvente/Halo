name: Refine Closed Notch CI Surface

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refine-closed-notch-ci-surface.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinements
        run: python3 .github/scripts/refine_closed_notch_ci_surface.py

      - name: Verify source
        shell: bash
        run: |
          git diff --check
          grep -q 'resolvedHorizontalMargin' Halo/Core/WorkspaceModels.swift
          grep -q 'Content safe margins' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'effectiveVisualizerColor' Halo/Views/SurfaceView.swift
          grep -q 'backgroundGradientColors' Halo/Views/SurfaceView.swift
          grep -q 'options.resolvedBottomMargin' Halo/Views/SurfaceView.swift
          grep -q 'hudReservedWidth <= 0' Halo/Views/ClosedNotchView.swift
          grep -q 'renderedArtworkSize = max(1, min(artwork.size' Halo/NotchEngine/WindowManager.swift
          grep -q 'throttle(for: .milliseconds(33)' Halo/NotchEngine/WindowManager.swift
          grep -q 'debounce(for: .milliseconds(80)' Halo/NotchEngine/WindowManager.swift

      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            unexpected=$(grep -E 'error:' /tmp/halo-build.log | grep -v -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' || true)
            if [ -n "$unexpected" ]; then
              echo 'Unexpected build error(s):'
              echo "$unexpected"
              exit "$code"
            fi
            grep -q -E 'ClosedNotchView.swift:[0-9]+:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi

      - name: Commit implementation
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Views/WorkspaceSettingsView.swift Halo/Views/SurfaceView.swift Halo/Views/ClosedNotchView.swift Halo/NotchEngine/WindowManager.swift
          git commit -m 'fix: refine closed notch and audio CI layout'
          git push origin main
