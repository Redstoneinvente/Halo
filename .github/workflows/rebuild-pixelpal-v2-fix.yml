name: Rebuild Pixel Pal v2 Fix

on:
  push:
    paths:
      - '.github/pixelpal-v2-fix.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode Pixel Pal v2 source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('.github/pixelpal-v2-rebuild.b64').read_text().strip()
          source = gzip.decompress(base64.b64decode(payload))
          Path('Halo/Views/PixelPetWidget.swift').write_bytes(source)
          PY

      - name: Fix legacy preference coding compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Halo/Views/PixelPetWidget.swift')
          source = path.read_text()
          marker = 'struct HaloPixelPalPreferences: Codable, Equatable {'
          if marker not in source:
              raise SystemExit('HaloPixelPalPreferences marker not found')
          if 'var showCheeks:' not in source and 'let showCheeks:' not in source:
              source = source.replace(
                  marker,
                  marker + '\n    // Legacy persisted field retained so Codable stays backward-compatible.\n    var showCheeks: Bool = true',
                  1,
              )
          path.write_text(source)
          PY

      - name: Parse Pixel Pal
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Build Halo
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-pixelpal-v2-build.log

      - name: Commit verified rebuild
        run: |
          rm -f .github/pixelpal-v2-rebuild.b64
          rm -f .github/pixelpal-v2-fix.trigger
          rm -f .github/workflows/rebuild-pixelpal-v2.yml
          rm -f .github/workflows/rebuild-pixelpal-v2-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Pixel Pal v2 sprite renderer'
          git push origin HEAD:main
