name: Polish Halo Trials

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/polish-halo-trials.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply polish
        run: python3 .github/scripts/polish_halo_trials.py
      - name: Verify
        run: |
          git diff --check
          grep -q 'var isTrial: Bool' Halo/Core/AppStore.swift
          grep -q 'Trial remaining' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'account.isSignedIn ? 470 : 390' Halo/Core/ExtensionContracts.swift
          grep -q 'Cache-Control.*no-store' functions/index.js
          node --check functions/index.js
      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' | grep -q .; then
              grep -E 'error:' /tmp/halo-build.log
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi
      - name: Commit
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/AppStore.swift Halo/Views/WorkspaceSettingsView.swift Halo/Core/ExtensionContracts.swift functions/index.js
          git commit -m 'fix: polish 14-day trial UX'
          git push origin main
