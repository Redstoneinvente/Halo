name: Finalize Transfer CI Sizing

on:
  push:
    paths:
      - '.github/finalize-transfer-ci-sizing-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Transfer CI sizing
        run: python3 scripts/finalize_transfer_ci_sizing.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/SurfaceView.swift
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Finalize Transfer CI sizing behavior"
          git push
