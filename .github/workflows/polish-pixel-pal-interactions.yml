name: Polish Pixel Pal Time Reactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply time-of-day Pixel Pal reactions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/PixelPetWidget.swift')
          lines = p.read_text().splitlines()

          def find_line(text, start=0):
              for i in range(start, len(lines)):
                  if lines[i].strip() == text:
                      return i
              raise SystemExit(f'Could not find line: {text}')

          # Add authored Z sprites immediately before the accessory section.
          if not any('static let zSmall' in line for line in lines):
              accessories = find_line('// Accessories')
              z = [
                  '    static let zSmall = HaloPixelPalSprite(rows: [',
                  '        "aaa",',
                  '        "..a",',
                  '        ".a.",',
                  '        "aaa"',
                  '    ])',
                  '    static let zTiny = HaloPixelPalSprite(rows: [',
                  '        "aa",',
                  '        ".a",',
                  '        "aa"',
                  '    ])',
                  '',
              ]
              lines[accessories:accessories] = z

          # Add the sleep FX enum case.
          enum_line = find_line('case none, hearts, sparkle, music, sweat, tears, alert')
          lines[enum_line] = lines[enum_line].replace(
              'case none, hearts, sparkle, music, sweat, tears, alert',
              'case none, hearts, sparkle, music, sweat, tears, alert, sleepZ'
          )

          # Time-of-day mood takes priority over hover/idle so late night remains sleepy.
          hover = find_line('if hovering && p.hoverReaction { return resting }')
          idle = find_line('if p.idleReaction {', hover)
          night = find_line('if p.nightReaction {', idle)
          final_return = find_line('return resting', night)
          indent = '        '
          replacement = [
              indent + 'if p.nightReaction {',
              indent + '    let hour = Calendar.autoupdatingCurrent.component(.hour, from: date)',
              '',
              indent + '    // Late night: settle down, breathe slowly and drift off with floating Zs.',
              indent + '    if hour >= 23 || hour < 5 {',
              indent + '        return .init(expression: .sleepy, accessory: .sleepingCap, fx: .sleepZ)',
              indent + '    }',
              '',
              indent + '    // Early morning: wake up bright and fresh before normal daytime behavior resumes.',
              indent + '    if hour >= 5 && hour < 9 {',
              indent + '        return .init(expression: .happy, accessory: .sprout, fx: .sparkle)',
              indent + '    }',
              indent + '}',
              '',
              indent + 'if hovering && p.hoverReaction { return resting }',
              '',
              indent + 'if p.idleReaction {',
              indent + '    let mouseIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .mouseMoved)',
              indent + '    let keyboardIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .keyDown)',
              indent + '    if min(mouseIdle, keyboardIdle) > 180 {',
              indent + '        return .init(expression: .bored, accessory: nil, fx: .none)',
              indent + '    }',
              indent + '}',
              '',
          ]
          lines[hover:final_return] = replacement

          # Sleepy expressions get Zs even when manually previewed/reacted.
          fx_start = find_line('private static func fx(for expression: HaloPixelPalExpression) -> HaloPixelPalFX {')
          fx_crying = find_line('case .crying: return .tears', fx_start)
          if lines[fx_crying + 1].strip() != 'case .sleepy: return .sleepZ':
              lines.insert(fx_crying + 1, '        case .sleepy: return .sleepZ')

          # Render two drifting Z glyphs at different scales/heights.
          draw_start = find_line('private func drawFX(render: (HaloPixelPalPlacedSprite, Double, Int, Int) -> Void) {')
          alert = find_line('case .alert:', draw_start)
          if not any(lines[i].strip() == 'case .sleepZ:' for i in range(alert, min(alert + 8, len(lines)))):
              lines[alert + 2:alert + 2] = [
                  '        case .sleepZ:',
                  '            render(.init(HaloPixelPalSprites.zTiny, x: 17, y: 7), 0.52, 0, lift)',
                  '            render(.init(HaloPixelPalSprites.zSmall, x: 20, y: 2), 0.88, 0, lift - 1)',
              ]

          # Slow sleepy breathing/bobbing.
          motion_start = find_line('private func logicalMotion() -> (x: Int, y: Int) {')
          bored = find_line('case .bored:', motion_start)
          if lines[bored - 1].strip() != 'return (0, Int(round(sin(t * 1.15))) * one)':
              lines[bored:bored] = [
                  '        case .sleepy:',
                  '            return (0, Int(round(sin(t * 1.15))) * one)',
              ]

          # Settings preview mirrors the real sleepy FX.
          preview_start = find_line('private var previewFX: HaloPixelPalFX {')
          preview_crying = find_line('case .crying: return .tears', preview_start)
          if lines[preview_crying + 1].strip() != 'case .sleepy: return .sleepZ':
              lines.insert(preview_crying + 1, '        case .sleepy: return .sleepZ')

          # Broaden the existing user-facing toggle label without changing persisted keys.
          label = find_line('Toggle("Night / sleep", isOn: bind(\\.nightReaction))')
          lines[label] = lines[label].replace('Night / sleep', 'Time of day (morning / night)')

          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Verify source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'case none, hearts, sparkle, music, sweat, tears, alert, sleepZ',
              'static let zSmall = HaloPixelPalSprite',
              'static let zTiny = HaloPixelPalSprite',
              'if hour >= 23 || hour < 5',
              'if hour >= 5 && hour < 9',
              'expression: .sleepy, accessory: .sleepingCap, fx: .sleepZ',
              'expression: .happy, accessory: .sprout, fx: .sparkle',
              'case .sleepZ:',
              'case .sleepy: return .sleepZ',
              'sin(t * 1.15)',
              'Time of day (morning / night)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing time-reaction contract: ' + ', '.join(missing))
          PY

      - name: Parse Pixel Pal source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/PixelPetWidget.swift
          git commit -m 'Add Pixel Pal time-of-day moods'
          git push origin HEAD:main
