name: Add Pixel Pet Full-Charge Reaction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add full-charge Pixel Pet reaction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          old = '''        if p.lowBatteryReaction, let battery = system.battery, battery <= 15 {
              return .init(expression: .worried, accessory: .bandage, fx: .sweat)
          }
          if p.chargingReaction && system.charging {
              return .init(expression: .love, accessory: .halo, fx: .hearts)
          }
          if p.musicReaction && media.isPlaying {'''

          new = '''        if p.lowBatteryReaction, let battery = system.battery, battery <= 15 {
              return .init(expression: .worried, accessory: .bandage, fx: .sweat)
          }
          if p.chargingReaction, let battery = system.battery, battery >= 100, !system.onBattery {
              return .init(expression: .superHappy, accessory: .crown, fx: .sparkle)
          }
          if p.chargingReaction && system.charging {
              return .init(expression: .love, accessory: .halo, fx: .hearts)
          }
          if p.musicReaction && media.isPlaying {'''

          count = s.count(old)
          if count != 1:
              raise SystemExit(f'full-charge context block: expected one match, found {count}')

          path.write_text(s.replace(old, new, 1))
          PY

      - name: Verify full-charge contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'if p.chargingReaction, let battery = system.battery, battery >= 100, !system.onBattery {',
              'return .init(expression: .superHappy, accessory: .crown, fx: .sparkle)',
              'if p.chargingReaction && system.charging {',
              'return .init(expression: .love, accessory: .halo, fx: .hearts)',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing full-charge Pixel Pet contract: ' + ', '.join(missing))

          full = s.index(required[0])
          charging = s.index(required[2])
          if full >= charging:
              raise SystemExit('Full-charge reaction must take priority over ordinary charging.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/PixelPetWidget.swift
          git commit -m 'Add Pixel Pet full-charge reaction'
          git push origin HEAD:main
