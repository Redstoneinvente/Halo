name: Sequence Pixel Pet Cookie Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sequence shutter open then cookie consumption
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          if 'rescue - 0.55' in s and 'deadline: .now() + 1.02' in s:
              print('Sequential cookie rescue already present; validating.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '        DispatchQueue.main.asyncAfter(deadline: .now() + 0.62, execute: work)\n',
              '        DispatchQueue.main.asyncAfter(deadline: .now() + 1.02, execute: work)\n',
              'happy transition delay',
          )

          replace_once(
              '        if let rescue = cookieRescueElapsed {\n            drawFuryCookie(context: &context, size: size, consumeProgress: min(1.0, rescue / 0.48))\n        } else if elapsed >= 1.05 && elapsed < 2.15 {\n',
              '        if cookieRescueElapsed != nil {\n            drawFuryCookie(context: &context, size: size, consumeProgress: 0)\n        } else if elapsed >= 1.05 && elapsed < 2.15 {\n',
              'keep cookie whole while shutter opens',
          )

          anchor = '''                .allowsHitTesting(false)

                if cookieRescueElapsed == nil, reactionElapsed >= 1.05, reactionElapsed < 2.15, let onCookieTap {
'''
          replacement = '''                .allowsHitTesting(false)

                if let rescue = cookieRescueElapsed, rescue >= 0.55 {
                    Canvas { context, size in
                        drawFuryCookie(
                            context: &context,
                            size: size,
                            consumeProgress: min(1.0, max(0.0, (rescue - 0.55) / 0.40))
                        )
                    }
                    .allowsHitTesting(false)
                }

                if cookieRescueElapsed == nil, reactionElapsed >= 1.05, reactionElapsed < 2.15, let onCookieTap {
'''
          replace_once(anchor, replacement, 'post-open cookie consumption overlay')

          path.write_text(s)
          PY

      - name: Verify sequential cookie rescue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'deadline: .now() + 1.02',
              'if let rescue = cookieRescueElapsed, rescue >= 0.55',
              '(rescue - 0.55) / 0.40',
              'if cookieRescueElapsed != nil',
              'consumeProgress: 0',
              'self.react(.happy, seconds: 2.4)',
          ]
          missing = [marker for marker in required if marker not in s]
          if missing:
              raise SystemExit(f'Missing sequential cookie rescue markers: {missing}')
          if 'min(1.0, rescue / 0.48)' in s:
              raise SystemExit('Cookie is still being consumed while the shutter opens.')
          print('Sequential cookie rescue verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sequence Pixel Pet cookie rescue"
          git pull --rebase origin main
          git push origin HEAD:main
