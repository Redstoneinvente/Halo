name: Add Configurable Pixel Pet Dizzy Threshold

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add configurable dizzy threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          if 'var dizzyRotationThresholdTurns = 0.8' in s:
              print('Configurable dizzy threshold already present; validating existing implementation.')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '    var version = 6\n',
              '    var version = 7\n',
              'schema version property',
          )
          replace_once(
              '    var animationIntensity = 0.85\n\n    // Direct interactions\n',
              '    var animationIntensity = 0.85\n    var dizzyRotationThresholdTurns = 0.8\n\n    // Direct interactions\n',
              'dizzy threshold preference',
          )
          replace_once(
              '        case automaticBlinking, animationSpeed, animationIntensity\n',
              '        case automaticBlinking, animationSpeed, animationIntensity, dizzyRotationThresholdTurns\n',
              'coding key',
          )
          replace_once(
              '        version = 6\n',
              '        version = 7\n',
              'decoded schema version',
          )
          replace_once(
              '        animationIntensity = try c.decodeIfPresent(Double.self, forKey: .animationIntensity) ?? 0.85\n\n        hoverReaction',
              '        animationIntensity = try c.decodeIfPresent(Double.self, forKey: .animationIntensity) ?? 0.85\n        dizzyRotationThresholdTurns = try c.decodeIfPresent(Double.self, forKey: .dizzyRotationThresholdTurns) ?? 0.8\n\n        hoverReaction',
              'decode dizzy threshold',
          )
          replace_once(
              '        value.version = 6\n        value.animationSpeed',
              '        value.version = 7\n        value.animationSpeed',
              'normalized schema version',
          )
          replace_once(
              '        value.animationIntensity = min(1.0, max(0.0, animationIntensity))\n        value.faceScale',
              '        value.animationIntensity = min(1.0, max(0.0, animationIntensity))\n        value.dizzyRotationThresholdTurns = min(2.0, max(0.35, dizzyRotationThresholdTurns))\n        value.faceScale',
              'normalize dizzy threshold',
          )

          replace_once(
              '    static let minimumRotation = Double.pi * 1.55\n',
              '',
              'remove hardcoded rotation threshold',
          )
          replace_once(
              '    mutating func register(location: CGPoint, size: CGSize, at now: TimeInterval) -> Bool {\n',
              '    mutating func register(location: CGPoint, size: CGSize, at now: TimeInterval, minimumRotationTurns: Double) -> Bool {\n',
              'detector configurable signature',
          )
          replace_once(
              '        let radiusSpread = maxRadius - minRadius\n\n        guard abs(signedRotation) >= Self.minimumRotation,\n',
              '        let radiusSpread = maxRadius - minRadius\n        let minimumRotation = Double.pi * 2.0 * min(2.0, max(0.35, minimumRotationTurns))\n\n        guard abs(signedRotation) >= minimumRotation,\n',
              'detector configurable threshold',
          )
          replace_once(
              '                            at: Date().timeIntervalSinceReferenceDate\n                        ) {\n',
              '                            at: Date().timeIntervalSinceReferenceDate,\n                            minimumRotationTurns: pal.preferences.dizzyRotationThresholdTurns\n                        ) {\n',
              'pass preference into detector',
          )

          interaction_old = (
              '                HStack {\n'
              '                    Text("Animation intensity")\n'
              '                    Slider(value: bind(\\.animationIntensity), in: 0...1)\n'
              '                }\n'
              '                Toggle("Automatic blinking + rare wink", isOn: bind(\\.automaticBlinking))\n'
          )
          interaction_new = (
              '                HStack {\n'
              '                    Text("Animation intensity")\n'
              '                    Slider(value: bind(\\.animationIntensity), in: 0...1)\n'
              '                }\n'
              '                HStack {\n'
              '                    Text("Dizzy threshold")\n'
              '                    Slider(value: bind(\\.dizzyRotationThresholdTurns), in: 0.35...2.0, step: 0.05)\n'
              '                    Text("\\(pal.preferences.dizzyRotationThresholdTurns, specifier: \"%.2f\") turns")\n'
              '                        .font(.caption.monospacedDigit())\n'
              '                        .frame(width: 76, alignment: .trailing)\n'
              '                }\n'
              '                Text("How much fast circular cursor movement is required before Pixel Pet becomes dizzy. Lower values trigger sooner.")\n'
              '                    .font(.caption2)\n'
              '                    .foregroundStyle(.secondary)\n'
              '                Toggle("Automatic blinking + rare wink", isOn: bind(\\.automaticBlinking))\n'
          )
          replace_once(interaction_old, interaction_new, 'dizzy threshold settings UI')

          path.write_text(s)
          PY

      - name: Verify configurable dizzy threshold
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'var version = 7',
              'var dizzyRotationThresholdTurns = 0.8',
              'case automaticBlinking, animationSpeed, animationIntensity, dizzyRotationThresholdTurns',
              'decodeIfPresent(Double.self, forKey: .dizzyRotationThresholdTurns) ?? 0.8',
              'value.dizzyRotationThresholdTurns = min(2.0, max(0.35, dizzyRotationThresholdTurns))',
              'minimumRotationTurns: Double',
              'let minimumRotation = Double.pi * 2.0 * min(2.0, max(0.35, minimumRotationTurns))',
              'minimumRotationTurns: pal.preferences.dizzyRotationThresholdTurns',
              'Text("Dizzy threshold")',
              'Slider(value: bind(\\.dizzyRotationThresholdTurns), in: 0.35...2.0, step: 0.05)',
          ]
          missing = [m for m in required if m not in s]
          if missing:
              raise SystemExit(f'Missing configurable dizzy threshold markers: {missing}')
          if 'static let minimumRotation = Double.pi * 1.55' in s:
              raise SystemExit('Hardcoded dizzy rotation threshold is still present.')
          print('Configurable dizzy threshold verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add configurable Pixel Pet dizzy threshold"
          git push origin HEAD:main
