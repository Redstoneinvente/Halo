name: Expand Pixel Pet Personality Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply personality engine
        run: |
          printf '%s' '' | python3 -c 'import sys,base64,gzip; sys.stdout.buffer.write(gzip.decompress(base64.b64decode(sys.stdin.buffer.read())))' > /tmp/pixel_pal_personality.py
          python3 /tmp/pixel_pal_personality.py

      - name: Verify personality contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'enum HaloPixelPalPersonality',
              'struct HaloPixelPalStrokeDetector',
              'func feedCookie()',
              'func petted()',
              'func considerChase',
              'case sneeze',
              'case hiccup',
              'case satisfied',
              'AudioSpectrumService.shared.snapshot()',
              '.onDrop(of: [UTType.fileURL.identifier]',
              'private func drawCookieBadge',
              'isEatingAnyCookie',
              'case .dreamCookie:',
              'Picker("Personality"',
          ]
          missing = [marker for marker in required if marker not in s]
          if missing:
              raise SystemExit(f'Missing Pixel Pet personality markers: {missing}')
          doc = Path('Docs/PixelPalV2.md').read_text()
          if '## 21. Personality micro-behaviour engine' not in doc:
              raise SystemExit('Canonical Pixel Pal personality section missing')
          print('Pixel Pet personality contract verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift Docs/PixelPalV2.md
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Expand Pixel Pet personality engine"
          git pull --rebase origin main
          git push origin HEAD:main
