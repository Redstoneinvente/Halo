name: Sequence Pixel Pet Cookie Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sequence shutter open then cookie consumption
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          if 'rescue - 0.55' not in s:
              old = '        DispatchQueue.main.asyncAfter(deadline: .now() + 0.62, execute: work)\n'
              new = '        DispatchQueue.main.asyncAfter(deadline: .now() + 1.02, execute: work)\n'
              if s.count(old) != 1:
                  raise SystemExit(f'happy delay: expected 1 match, found {s.count(old)}')
              s = s.replace(old, new, 1)

              old = (
                  '        if let rescue = cookieRescueElapsed {\n'
                  '            drawFuryCookie(context: &context, size: size, consumeProgress: min(1.0, rescue / 0.48))\n'
                  '        } else if elapsed >= 1.05 && elapsed < 2.15 {\n'
              )
              new = (
                  '        if cookieRescueElapsed != nil {\n'
                  '            drawFuryCookie(context: &context, size: size, consumeProgress: 0)\n'
                  '        } else if elapsed >= 1.05 && elapsed < 2.15 {\n'
              )
              if s.count(old) != 1:
                  raise SystemExit(f'whole-cookie during opening: expected 1 match, found {s.count(old)}')
              s = s.replace(old, new, 1)

              anchor = (
                  '                .allowsHitTesting(false)\n'
                  '\n'
                  '                if cookieRescueElapsed == nil, reactionElapsed >= 1.05, reactionElapsed < 2.15, let onCookieTap {\n'
              )
              replacement = (
                  '                .allowsHitTesting(false)\n'
                  '\n'
                  '                if let rescue = cookieRescueElapsed, rescue >= 0.55 {\n'
                  '                    Canvas { context, size in\n'
                  '                        drawFuryCookie(\n'
                  '                            context: &context,\n'
                  '                            size: size,\n'
                  '                            consumeProgress: min(1.0, max(0.0, (rescue - 0.55) / 0.40))\n'
                  '                        )\n'
                  '                    }\n'
                  '                    .allowsHitTesting(false)\n'
                  '                }\n'
                  '\n'
                  '                if cookieRescueElapsed == nil, reactionElapsed >= 1.05, reactionElapsed < 2.15, let onCookieTap {\n'
              )
              if s.count(anchor) != 1:
                  raise SystemExit(f'cookie consumption overlay anchor: expected 1 match, found {s.count(anchor)}')
              s = s.replace(anchor, replacement, 1)
              path.write_text(s)
          else:
              print('Sequential rescue already present; validating.')
          PY

      - name: Verify sequential cookie rescue
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'deadline: .now() + 1.02',
              'if let rescue = cookieRescueElapsed, rescue >= 0.55',
              '(rescue - 0.55) / 0.40',
              'if cookieRescueElapsed != nil',
              'consumeProgress: 0',
              'self.react(.happy, seconds: 2.4)',
          ]
          missing = [m for m in required if m not in s]
          if missing:
              raise SystemExit(f'Missing sequential rescue markers: {missing}')
          if 'min(1.0, rescue / 0.48)' in s:
              raise SystemExit('Cookie still consumes while shutter is opening.')
          print('Sequential cookie rescue verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sequence Pixel Pet cookie rescue"
          git pull --rebase origin main
          git push origin HEAD:main
