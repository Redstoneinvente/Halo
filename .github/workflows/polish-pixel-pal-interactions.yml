name: Add Pixel Pet Cookie Rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add cookie rescue and synchronized fury ending
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          if 'func feedFuryCookie()' not in s:
              def replace_once(old, new, label):
                  global s
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{label}: expected one match, found {count}')
                  s = s.replace(old, new, 1)

              replace_once(
                  '    @Published private(set) var reaction: HaloPixelPalExpression?\n    @Published private(set) var reactionStarted = Date()\n',
                  '    @Published private(set) var reaction: HaloPixelPalExpression?\n    @Published private(set) var reactionStarted = Date()\n    @Published private(set) var cookieRescueStarted: Date?\n',
                  'cookie rescue published state',
              )
              replace_once(
                  '    private var clearReactionWork: DispatchWorkItem?\n',
                  '    private var clearReactionWork: DispatchWorkItem?\n    private var cookieRescueWork: DispatchWorkItem?\n',
                  'cookie rescue work item',
              )
              replace_once(
                  '    func react(_ expression: HaloPixelPalExpression, seconds: Double = 1.7) {\n        clearReactionWork?.cancel()\n        reactionStarted = Date()\n',
                  '    func react(_ expression: HaloPixelPalExpression, seconds: Double = 1.7) {\n        clearReactionWork?.cancel()\n        if expression != .furious {\n            cookieRescueWork?.cancel()\n            cookieRescueStarted = nil\n        }\n        reactionStarted = Date()\n',
                  'reaction clears cookie rescue',
              )

              duration_old = '            react(escalation, seconds: escalation == .furious ? 4.6 : 3.4)\n'
              duration_new = '            react(escalation, seconds: escalation == .furious ? 2.82 : 3.4)\n'
              if s.count(duration_old) != 2:
                  raise SystemExit(f'furious duration: expected two matches, found {s.count(duration_old)}')
              s = s.replace(duration_old, duration_new)

              marker = '    func longPressed() {\n        guard preferences.longPressReaction else { return }\n'
              insert = '    func feedFuryCookie() {\n        guard reaction == .furious, cookieRescueStarted == nil else { return }\n        clearReactionWork?.cancel()\n        let started = Date()\n        cookieRescueStarted = started\n        let work = DispatchWorkItem { [weak self] in\n            guard let self, self.reaction == .furious, self.cookieRescueStarted == started else { return }\n            self.cookieRescueStarted = nil\n            self.react(.happy, seconds: 2.4)\n        }\n        cookieRescueWork = work\n        DispatchQueue.main.asyncAfter(deadline: .now() + 0.62, execute: work)\n    }\n\n'
              replace_once(marker, insert + marker, 'cookie rescue store action')

              replace_once(
                  '        clearReactionWork?.cancel()\n        tapIndex = 0\n',
                  '        clearReactionWork?.cancel()\n        cookieRescueWork?.cancel()\n        cookieRescueStarted = nil\n        tapIndex = 0\n',
                  'reset cookie rescue state',
              )

              replace_once(
                  '                    reactionElapsed: pal.reaction.map { _ in timeline.date.timeIntervalSince(pal.reactionStarted) },\n                    pointer: pal.preferences.hoverReaction && hovering ? pointer : .zero\n',
                  '                    reactionElapsed: pal.reaction.map { _ in timeline.date.timeIntervalSince(pal.reactionStarted) },\n                    cookieRescueElapsed: pal.cookieRescueStarted.map { timeline.date.timeIntervalSince($0) },\n                    pointer: pal.preferences.hoverReaction && hovering ? pointer : .zero,\n                    onCookieTap: { pal.feedFuryCookie() }\n',
                  'pass cookie rescue state to renderer',
              )

              replace_once(
                  '    var reactionElapsed: TimeInterval? = nil\n    var pointer: CGPoint = .zero\n',
                  '    var reactionElapsed: TimeInterval? = nil\n    var cookieRescueElapsed: TimeInterval? = nil\n    var pointer: CGPoint = .zero\n    var onCookieTap: (() -> Void)? = nil\n',
                  'face cookie rescue inputs',
              )

              old_overlay = '            if expression == .furious, let reactionElapsed = reactionElapsed {\n                Canvas { context, size in\n                    drawFuryDoor(context: &context, size: size, elapsed: reactionElapsed)\n                }\n                .allowsHitTesting(false)\n            }\n'
              new_overlay = '            if expression == .furious, let reactionElapsed = reactionElapsed {\n                Canvas { context, size in\n                    drawFuryDoor(\n                        context: &context,\n                        size: size,\n                        elapsed: reactionElapsed,\n                        cookieRescueElapsed: cookieRescueElapsed\n                    )\n                }\n                .allowsHitTesting(false)\n\n                if cookieRescueElapsed == nil, reactionElapsed >= 1.05, reactionElapsed < 2.15, let onCookieTap {\n                    GeometryReader { proxy in\n                        let hitSize = max(24.0, min(proxy.size.width, proxy.size.height) * 0.30)\n                        Button(action: onCookieTap) {\n                            Color.clear\n                                .frame(width: hitSize, height: hitSize)\n                                .contentShape(Rectangle())\n                        }\n                        .buttonStyle(.plain)\n                        .position(x: proxy.size.width / 2, y: proxy.size.height / 2)\n                        .accessibilityLabel("Give Pixel Pal the cookie")\n                        .help("Give Pixel Pal the cookie")\n                    }\n                }\n            }\n'
              replace_once(old_overlay, new_overlay, 'interactive cookie overlay')

              start = s.find('    private func furyDoorClosure(elapsed: TimeInterval) -> Double {\n')
              end_marker = '    @ViewBuilder\n    private var background: some View {\n'
              end = s.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('Could not locate fury door helper region.')

              helper_b64 = ''
              helpers = base64.b64decode(helper_b64).decode('utf-8')
              s = s[:start] + helpers + s[end:]
              path.write_text(s)
          else:
              print('Cookie rescue already present; validating.')
          PY

      - name: Verify cookie rescue contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              '@Published private(set) var cookieRescueStarted: Date?',
              'func feedFuryCookie()',
              'escalation == .furious ? 2.82 : 3.4',
              'cookieRescueElapsed: pal.cookieRescueStarted.map',
              'onCookieTap: { pal.feedFuryCookie() }',
              'reactionElapsed >= 1.05, reactionElapsed < 2.15',
              'drawFuryCookie(context: &context, size: size',
              'self.react(.happy, seconds: 2.4)',
              'return elapsed >= 0.65 && elapsed < 2.80 ? 1.0 : 0.0',
          ]
          missing = [marker for marker in required if marker not in s]
          if missing:
              raise SystemExit(f'Missing cookie rescue markers: {missing}')
          if 'escalation == .furious ? 4.6 : 3.4' in s:
              raise SystemExit('Old furious duration remains.')
          print('Cookie rescue contract verified.')
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Views/PixelPetWidget.swift
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add Pixel Pet shutter cookie rescue"
          git pull --rebase origin main
          git push origin HEAD:main
