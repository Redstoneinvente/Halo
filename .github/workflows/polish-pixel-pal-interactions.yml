name: Repair Pixel Pal Expressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair expression rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/PixelPetWidget.swift')
          s = p.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '    private enum EyePose { case open, happy, closed, heart, star, winkLeft, winkRight }',
              '    private enum EyePose { case open, happy, closed, heart, star, winkLeft, winkRight, confused, smug }',
              'eye pose enum'
          )

          replace_once(
              '''        case .blink, .sleepy, .bored: return .closed\n        case .happy, .superHappy, .music: return .happy\n        case .love: return .heart\n        case .excited, .shocked: return .star\n        case .wink: return .winkRight\n        case .mischievous, .smug: return .winkRight\n        default: return .open''',
              '''        case .blink, .sleepy, .bored: return .closed\n        case .happy, .superHappy, .music, .shy: return .happy\n        case .love: return .heart\n        case .excited, .shocked: return .star\n        case .wink, .mischievous: return .winkRight\n        case .confused: return .confused\n        case .smug: return .smug\n        default: return .open''',
              'eye pose mapping'
          )

          replace_once(
              '''        case .winkRight:\n            let open = HaloPixelPalSprites.openEye(preferences.eyeStyle)\n            render(.init(open, x: leftX, y: y), 1, 0, 0)\n            render(.init(HaloPixelPalSprites.winkEye, x: rightX, y: y + 2, mirrorX: true), 1, 0, 0)\n        }''',
              '''        case .winkRight:\n            let open = HaloPixelPalSprites.openEye(preferences.eyeStyle)\n            render(.init(open, x: leftX, y: y), 1, 0, 0)\n            render(.init(HaloPixelPalSprites.winkEye, x: rightX, y: y + 2, mirrorX: true), 1, 0, 0)\n        case .confused:\n            let open = HaloPixelPalSprites.openEye(preferences.eyeStyle)\n            let closed = HaloPixelPalSprites.closedEye(preferences.eyeStyle)\n            render(.init(open, x: leftX, y: y), 1, 0, 0)\n            render(.init(closed, x: rightX, y: y + 2, mirrorX: true), 1, 0, 0)\n        case .smug:\n            let eye = HaloPixelPalSprite(rows: [\"ppppp\", \".ppp.\"])\n            render(.init(eye, x: leftX, y: y + 2), 1, 0, 0)\n            render(.init(eye, x: rightX, y: y + 2, mirrorX: true), 1, 0, 0)\n        }''',
              'distinct confused and smug eyes'
          )

          replace_once(
              '''        case .surprised, .shocked:\n            render(.init(HaloPixelPalSprites.raisedBrow, x: leftX, y: 3), 0.95, 0, 0)\n            render(.init(HaloPixelPalSprites.raisedBrow, x: rightX, y: 3, mirrorX: true), 0.95, 0, 0)\n        case .mischievous, .smug:\n            render(.init(HaloPixelPalSprites.annoyedBrow, x: leftX, y: y), 0.80, 0, 0)\n        default:''',
              '''        case .surprised, .shocked:\n            render(.init(HaloPixelPalSprites.raisedBrow, x: leftX, y: 3), 0.95, 0, 0)\n            render(.init(HaloPixelPalSprites.raisedBrow, x: rightX, y: 3, mirrorX: true), 0.95, 0, 0)\n        case .confused:\n            render(.init(HaloPixelPalSprites.raisedBrow, x: leftX, y: 3), 0.95, 0, 0)\n            render(.init(HaloPixelPalSprites.worriedBrow, x: rightX, y: y, mirrorX: true), 0.88, 0, 0)\n        case .mischievous:\n            render(.init(HaloPixelPalSprites.annoyedBrow, x: leftX, y: y), 0.82, 0, 0)\n        case .smug:\n            render(.init(HaloPixelPalSprites.raisedBrow, x: rightX, y: 3, mirrorX: true), 0.78, 0, 0)\n        default:''',
              'distinct expression brows'
          )

          replace_once(
              '        case .neutral, .focused, .confused: return HaloPixelPalSprites.mouthTiny',
              '        case .neutral, .focused: return HaloPixelPalSprites.mouthTiny\n        case .confused: return HaloPixelPalSprites.mouthO',
              'confused mouth'
          )

          replace_once(
              '''        let t = max(0, animationTime) * speed\n        if let reactionElapsed {\n            return (0, HaloPixelPalAnimationTiming.bounce(elapsed: reactionElapsed * speed,\n                                                         intensity: intensity, reduceMotion: reduceMotion))\n        }\n        let one = intensity > 0.28 ? 1 : 0\n        let two = intensity > 0.75 ? 2 : one''',
              '''        let t = max(0, animationTime) * speed\n        let one = intensity > 0.28 ? 1 : 0\n        let two = intensity > 0.75 ? 2 : one\n        if let reactionElapsed {\n            if expression == .annoyed {\n                return (Int(round(sin(t * 11.0))) * one, 0)\n            }\n            return (0, HaloPixelPalAnimationTiming.bounce(elapsed: reactionElapsed * speed,\n                                                         intensity: intensity, reduceMotion: reduceMotion))\n        }''',
              'annoyed reaction motion'
          )

          replace_once(
              '                    ForEach(HaloPixelPalExpression.allCases) { Text($0.title).tag($0) }',
              '                    ForEach(HaloPixelPalExpression.allCases.filter { $0 != .blink }) { Text($0.title).tag($0) }',
              'remove blink from manual preview picker'
          )

          p.write_text(s)
          PY

      - name: Verify expression contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'case open, happy, closed, heart, star, winkLeft, winkRight, confused, smug',
              'case .happy, .superHappy, .music, .shy: return .happy',
              'case .confused: return .confused',
              'case .smug: return .smug',
              'case .confused:',
              'let eye = HaloPixelPalSprite(rows: ["ppppp", ".ppp."])',
              'case .confused: return HaloPixelPalSprites.mouthO',
              'if expression == .annoyed',
              'HaloPixelPalExpression.allCases.filter { $0 != .blink }',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing repaired-expression contract: ' + ', '.join(missing))
          PY

      - name: Parse Pixel Pal source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/PixelPetWidget.swift
          git commit -m 'Repair Pixel Pal expressions'
          git push origin HEAD:main
