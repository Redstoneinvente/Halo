name: Fix Pixel Pet Display Background Radius

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply radius to the LED display surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('Halo/Views/PixelPetWidget.swift')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '''        ZStack {\n            background\n                .clipShape(HaloPixelPalRelativeRoundedRectangle(radiusFraction: preferences.backgroundCornerRadius))\n            if preferences.inactiveLEDIntensity > 0.001 {\n                Canvas { context, size in\n                    let geometry = HaloPixelPalDisplayGeometry(size: size, scale: displayScale, fill: preferences.faceScale)\n                    let inactiveColor = preferences.inactiveLEDUsesFaceColor ? faceColor : preferences.inactiveLEDColor.color\n                    for y in 0..<logicalGrid {\n                        for x in 0..<logicalGrid {\n                            let rect = geometry.led(x: x, y: y)\n                            let radius = min(rect.width, rect.height) * preferences.pixelCornerRadius\n                            context.fill(Path(roundedRect: rect, cornerRadius: radius),\n                                         with: .color(inactiveColor.opacity(preferences.inactiveLEDIntensity)),\n                                         style: FillStyle(antialiased: preferences.pixelCornerRadius > 0.001))\n                        }\n                    }\n                }\n            }\n            Canvas { context, size in''',
              '''        ZStack {\n            ZStack {\n                background\n                if preferences.inactiveLEDIntensity > 0.001 {\n                    Canvas { context, size in\n                        let geometry = HaloPixelPalDisplayGeometry(size: size, scale: displayScale, fill: preferences.faceScale)\n                        let inactiveColor = preferences.inactiveLEDUsesFaceColor ? faceColor : preferences.inactiveLEDColor.color\n                        for y in 0..<logicalGrid {\n                            for x in 0..<logicalGrid {\n                                let rect = geometry.led(x: x, y: y)\n                                let radius = min(rect.width, rect.height) * preferences.pixelCornerRadius\n                                context.fill(Path(roundedRect: rect, cornerRadius: radius),\n                                             with: .color(inactiveColor.opacity(preferences.inactiveLEDIntensity)),\n                                             style: FillStyle(antialiased: preferences.pixelCornerRadius > 0.001))\n                            }\n                        }\n                    }\n                }\n            }\n            .clipShape(HaloPixelPalRelativeRoundedRectangle(radiusFraction: preferences.backgroundCornerRadius))\n\n            Canvas { context, size in''',
              'LED display surface grouping'
          )

          replace_once(
              '''                if pal.preferences.backgroundStyle != .transparent {\n                    HStack {\n                        Text("Surface opacity")\n                        Slider(value: bind(\\.backgroundOpacity), in: 0...1)\n                        Text("\\(Int(pal.preferences.backgroundOpacity * 100))%")\n                            .font(.caption.monospacedDigit())\n                            .frame(width: 38, alignment: .trailing)\n                    }\n                    HStack {\n                        Text("Background corner radius")\n                        Slider(value: bind(\\.backgroundCornerRadius), in: 0...0.5)\n                        Text("\\(Int(pal.preferences.backgroundCornerRadius * 100))%")\n                            .font(.caption.monospacedDigit())\n                            .frame(width: 38, alignment: .trailing)\n                    }\n                }\n                Toggle("Match inactive LEDs to face color", isOn: bind(\\.inactiveLEDUsesFaceColor))''',
              '''                if pal.preferences.backgroundStyle != .transparent {\n                    HStack {\n                        Text("Surface opacity")\n                        Slider(value: bind(\\.backgroundOpacity), in: 0...1)\n                        Text("\\(Int(pal.preferences.backgroundOpacity * 100))%")\n                            .font(.caption.monospacedDigit())\n                            .frame(width: 38, alignment: .trailing)\n                    }\n                }\n                HStack {\n                    Text("Background corner radius")\n                    Slider(value: bind(\\.backgroundCornerRadius), in: 0...0.5)\n                    Text("\\(Int(pal.preferences.backgroundCornerRadius * 100))%")\n                        .font(.caption.monospacedDigit())\n                        .frame(width: 38, alignment: .trailing)\n                }\n                Text("Rounds the LED display background, including the inactive LED matrix, without clipping the active Pixel Pal pixels.")\n                    .font(.caption2)\n                    .foregroundStyle(.secondary)\n                Toggle("Match inactive LEDs to face color", isOn: bind(\\.inactiveLEDUsesFaceColor))''',
              'background radius settings semantics'
          )

          path.write_text(s)
          PY

      - name: Verify display radius contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'ZStack {\n                background\n                if preferences.inactiveLEDIntensity > 0.001',
              '.clipShape(HaloPixelPalRelativeRoundedRectangle(radiusFraction: preferences.backgroundCornerRadius))',
              'Rounds the LED display background, including the inactive LED matrix, without clipping the active Pixel Pal pixels.',
              'Text("Pixel corner radius")',
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Missing LED display radius contract: ' + ', '.join(missing))
          PY

      - name: Parse Pixel Pet source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/PixelPetWidget.swift
          git commit -m 'Fix Pixel Pet LED display radius'
          git push origin HEAD:main
