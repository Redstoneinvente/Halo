name: Polish Pixel Pal Time Reactions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-pixel-pal-interactions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply time-of-day Pixel Pal reactions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/PixelPetWidget.swift')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
          '''    static let exclamation = HaloPixelPalSprite(rows: [
              "a",
              "a",
              "a",
              ".",
              "a"
          ])

          // Accessories''',
          '''    static let exclamation = HaloPixelPalSprite(rows: [
              "a",
              "a",
              "a",
              ".",
              "a"
          ])
          static let zSmall = HaloPixelPalSprite(rows: [
              "aaa",
              "..a",
              ".a.",
              "aaa"
          ])
          static let zTiny = HaloPixelPalSprite(rows: [
              "aa",
              ".a",
              "aa"
          ])

          // Accessories''',
          'sleep Z sprites')

          replace_once(
          '''private enum HaloPixelPalFX {
              case none, hearts, sparkle, music, sweat, tears, alert
          }''',
          '''private enum HaloPixelPalFX {
              case none, hearts, sparkle, music, sweat, tears, alert, sleepZ
          }''',
          'sleep FX enum')

          replace_once(
          '''        if hovering && p.hoverReaction { return resting }

          if p.idleReaction {
              let mouseIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .mouseMoved)
              let keyboardIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .keyDown)
              if min(mouseIdle, keyboardIdle) > 180 {
                  return .init(expression: .bored, accessory: nil, fx: .none)
              }
          }

          if p.nightReaction {
              let hour = Calendar.autoupdatingCurrent.component(.hour, from: date)
              if hour >= 23 || hour < 6 {
                  return .init(expression: .sleepy, accessory: .sleepingCap, fx: .none)
              }
          }

          return resting''',
          '''        if p.nightReaction {
              let hour = Calendar.autoupdatingCurrent.component(.hour, from: date)

              // Late night: settle down, breathe slowly and drift off with floating Zs.
              if hour >= 23 || hour < 5 {
                  return .init(expression: .sleepy, accessory: .sleepingCap, fx: .sleepZ)
              }

              // Early morning: wake up bright and fresh before normal daytime behavior resumes.
              if hour >= 5 && hour < 9 {
                  return .init(expression: .happy, accessory: .sprout, fx: .sparkle)
              }
          }

          if hovering && p.hoverReaction { return resting }

          if p.idleReaction {
              let mouseIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .mouseMoved)
              let keyboardIdle = CGEventSource.secondsSinceLastEventType(.combinedSessionState, eventType: .keyDown)
              if min(mouseIdle, keyboardIdle) > 180 {
                  return .init(expression: .bored, accessory: nil, fx: .none)
              }
          }

          return resting''',
          'time-of-day context')

          replace_once(
          '''        case .crying: return .tears
              case .annoyed, .shocked, .surprised: return .alert''',
          '''        case .crying: return .tears
              case .sleepy: return .sleepZ
              case .annoyed, .shocked, .surprised: return .alert''',
          'sleep expression FX')

          replace_once(
          '''        case .alert:
              render(.init(HaloPixelPalSprites.exclamation, x: 21, y: 2), 0.95, 0, reduceMotion ? 0 : -phase % 2)
          }''',
          '''        case .alert:
              render(.init(HaloPixelPalSprites.exclamation, x: 21, y: 2), 0.95, 0, reduceMotion ? 0 : -phase % 2)
          case .sleepZ:
              render(.init(HaloPixelPalSprites.zTiny, x: 17, y: 7), 0.52, 0, lift)
              render(.init(HaloPixelPalSprites.zSmall, x: 20, y: 2), 0.88, 0, lift - 1)
          }''',
          'sleep Z rendering')

          replace_once(
          '''        case .worried, .sad, .crying:
              return (Int(round(sin(t * 2.0))) * one, one)
          case .bored:''',
          '''        case .worried, .sad, .crying:
              return (Int(round(sin(t * 2.0))) * one, one)
          case .sleepy:
              return (0, Int(round(sin(t * 1.15))) * one)
          case .bored:''',
          'sleep breathing motion')

          replace_once(
          '''        case .crying: return .tears
              case .annoyed, .surprised, .shocked: return .alert''',
          '''        case .crying: return .tears
              case .sleepy: return .sleepZ
              case .annoyed, .surprised, .shocked: return .alert''',
          'sleep preview FX')

          replace_once(
          '''                    Toggle("Night / sleep", isOn: bind(\\.nightReaction))''',
          '''                    Toggle("Time of day (morning / night)", isOn: bind(\\.nightReaction))''',
          'time reaction settings label')

          p.write_text(s)
          PY

      - name: Verify source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/PixelPetWidget.swift').read_text()
          required = [
              'case none, hearts, sparkle, music, sweat, tears, alert, sleepZ',
              'static let zSmall = HaloPixelPalSprite',
              'static let zTiny = HaloPixelPalSprite',
              'if hour >= 23 || hour < 5',
              'if hour >= 5 && hour < 9',
              'expression: .sleepy, accessory: .sleepingCap, fx: .sleepZ',
              'expression: .happy, accessory: .sprout, fx: .sparkle',
              'case .sleepZ:',
              'case .sleepy:',
              'Time of day (morning / night)',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing time-reaction contract: ' + ', '.join(missing))
          PY

      - name: Parse Pixel Pal source
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Full Xcode build
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/PixelPetWidget.swift
          git commit -m 'Add Pixel Pal time-of-day moods'
          git push origin HEAD:main
