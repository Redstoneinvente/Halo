name: Fix Clipboard CI Card Size

on:
  push:
    paths:
      - '.github/clipboard-ci-card-size-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Clipboard CI card sizing fix
        run: python3 scripts/fix_clipboard_ci_card_size.py
      - name: Verify preview panel
        run: |
          grep -q 'https://halo.redstoneinvente.com' Halo/Views/WorkspaceSettingsView.swift
          grep -q '.frame(height: 112)' Halo/Views/WorkspaceSettingsView.swift
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Make Clipboard CI card size consistent'
            git push
          fi
