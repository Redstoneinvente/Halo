name: One-time Opened Notch Responsive Workspace Retry

on:
  push:
    paths:
      - '.github/workflows/one-time-open-workspace-responsive-retry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct migration helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Scripts/one_time_open_workspace_responsive.py')
          s = p.read_text()
          old = '''s = s.replace(\'\'\'struct BuiltinOrIntegrationWidget: View {\\n    let module: ModuleID\\n    @ObservedObject var store: AppStore\\n    @Environment(\\\\.widgetStyle) private var style\\n\'\'\', \'\'\'struct BuiltinOrIntegrationWidget: View {\\n    let module: ModuleID\\n    @ObservedObject var store: AppStore\\n    @Environment(\\\\.widgetStyle) private var style\\n    @Environment(\\\\.openNotchPresentation) private var presentation\\n    @Environment(\\\\.openNotchCompressionLevel) private var compression\\n\'\'\', 1)'''
          new = '''s = s.replace(\'\'\'struct BuiltinOrIntegrationWidget: View {\\n    let module: ModuleID\\n    @ObservedObject var store: AppStore\\n    @Environment(\\\\.widgetStyle) private var style\\n    @Environment(\\\\.openNotchPresentation) private var presentation\\n\'\'\', \'\'\'struct BuiltinOrIntegrationWidget: View {\\n    let module: ModuleID\\n    @ObservedObject var store: AppStore\\n    @Environment(\\\\.widgetStyle) private var style\\n    @Environment(\\\\.openNotchPresentation) private var presentation\\n    @Environment(\\\\.openNotchCompressionLevel) private var compression\\n\'\'\', 1)'''
          if old not in s:
              raise SystemExit('responsive helper anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply opened-notch responsive workspace polish
        run: python3 Scripts/one_time_open_workspace_responsive.py

      - name: Validate Swift syntax and diff
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/WidgetViews.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ModuleViews.swift
          xcrun swiftc -parse Halo/Views/WidgetSettingsView.swift
          git diff --check

      - name: Build and require no changed-file compiler errors
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build > /tmp/halo-build.log 2>&1
          status=$?
          set -e
          tail -n 280 /tmp/halo-build.log
          if grep -E '(^|/)(WorkspaceModels|WidgetViews|SurfaceView|ModuleViews|WidgetSettingsView)\.swift:.*error:' /tmp/halo-build.log; then
            echo 'Compiler error found in an opened-notch responsive workspace file.'
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Full project build still has an unrelated existing failure; changed opened-notch files have no reported compiler errors.'
          fi

      - name: Commit implementation and clean one-shot helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceModels.swift Halo/Views/WidgetViews.swift Halo/Views/SurfaceView.swift Halo/Views/ModuleViews.swift Halo/Views/WidgetSettingsView.swift Docs/WidgetCustomization.md
          git rm -f Scripts/one_time_open_workspace_responsive.py .github/workflows/one-time-open-workspace-responsive.yml .github/workflows/one-time-open-workspace-responsive-retry.yml
          if [ -f Scripts/one_time_open_workspace_polish.py ]; then git rm -f Scripts/one_time_open_workspace_polish.py; fi
          if [ -f .github/workflows/one-time-open-workspace-polish.yml ]; then git rm -f .github/workflows/one-time-open-workspace-polish.yml; fi
          git commit -m 'Polish optional responsive opened workspace'
          git push origin HEAD:main
