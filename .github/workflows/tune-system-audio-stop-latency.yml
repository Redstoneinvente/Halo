name: Tune System Audio Stop Latency

on:
  push:
    branches: [main]
    paths:
      - '.github/system-audio-stop-latency-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply System Audio stop latency fix
        run: python3 .github/scripts/tune_system_audio_stop_latency.py

      - name: Verify tuned detection contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('Halo/Core/WorkspaceStore.swift').read_text()
          required = [
              'private var fastRefreshTask: Task<Void, Never>?',
              'let releaseWindow = (safariRunning || safariRecentlyActive) ? 1.25 : 0.85',
              'let releaseWindow = (safariRunning || safariRecentlyActive) ? 1.25 : 0.85',
              'Task.sleep(nanoseconds: 350_000_000)',
              'scheduleFastRefresh()'
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing expected stop-latency token: {token}')
          if '? 4.0 : 2.75' in text:
              raise SystemExit('Old System Audio release window still present')
          print('System Audio stop-latency contract passed')
          PY

      - name: Parse affected Swift file
        run: xcrun swiftc -parse Halo/Core/WorkspaceStore.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-system-audio-stop-latency.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            echo 'xcodebuild failed; checking WorkspaceStore.swift for compiler errors.'
            if grep -E 'WorkspaceStore\.swift:.*error:' /tmp/halo-system-audio-stop-latency.log; then
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors; WorkspaceStore.swift emitted no compiler errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit System Audio stop latency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Core/WorkspaceStore.swift
          git rm -f .github/scripts/tune_system_audio_stop_latency.py .github/workflows/tune-system-audio-stop-latency.yml .github/system-audio-stop-latency-trigger.txt
          git commit -m 'Reduce System Audio CI stop detection latency'
          git pull --rebase origin main
          git push origin HEAD:main
