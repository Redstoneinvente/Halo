name: Move Commercial Gate Into Notch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-commercial-gate-into-notch.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply migration
        run: python3 .github/scripts/move_commercial_gate_into_notch.py
      - name: Verify source changes
        run: |
          git diff --check
          grep -q 'private var accessLocked' Halo/Core/ExtensionContracts.swift
          grep -q 'struct HaloLockedAccessSurface' Halo/Core/ExtensionContracts.swift
          grep -q 'Activate License' Halo/Core/ExtensionContracts.swift
          grep -q 'manager.start()' Halo/App/HaloApp.swift
          grep -q 'stopLicensedServices()' Halo/App/HaloApp.swift
          ! grep -q 'showWelcome()' Halo/App/HaloApp.swift
      - name: Build Halo
        shell: bash
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS,arch=arm64' -derivedDataPath /tmp/HaloDerived CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES build 2>&1 | tee /tmp/halo-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            if grep -E 'error:' /tmp/halo-build.log | grep -v 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' | grep -q .; then
              echo 'Unexpected build error(s):'
              grep -E 'error:' /tmp/halo-build.log
              exit "$code"
            fi
            grep -q 'ClosedNotchView.swift:1333:25: error: the compiler is unable to type-check this expression in reasonable time' /tmp/halo-build.log || exit "$code"
          fi
      - name: Commit source changes
        run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/App/HaloApp.swift Halo/Core/ExtensionContracts.swift
          git commit -m 'feat: move account and license gate into notch'
          git push origin main
