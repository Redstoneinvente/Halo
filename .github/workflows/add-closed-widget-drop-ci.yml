name: Add Closed Widget and Drop CI
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-closed-widget-drop-ci.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/add_closed_widget_drop_ci.py
      - run: git diff --check
      - run: |
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Core/WidgetModels.swift Halo/Core/ExtensionContracts.swift Halo/Views/WidgetSettingsView.swift Halo/Views/ClosedNotchView.swift Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift Halo/NotchEngine/WindowManager.swift
          git commit -m 'feat: customize closed widgets and add Drop CI'
          git push origin main
