name: Fix Teleprompter Context Matching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Teleprompter context matcher repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Teleprompter context engine
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('Halo/Services/CaptureService.swift')
          s = p.read_text()

          pattern = re.compile(r'''    private func evaluateContext\(_ rule: TeleprompterContextRule\) -> Bool \{.*?\n    private func heuristicScreenRecordingActive\(\) -> Bool \{''', re.S)
          replacement = r'''    private func evaluateContext(_ rule: TeleprompterContextRule) -> Bool {
        let queries = contextQueries(rule.value)
        switch rule.kind {
        case .frontmostApp:
            guard !queries.isEmpty, let app = NSWorkspace.shared.frontmostApplication else { return false }
            return appMatches(app, queries: queries)
        case .runningApp:
            guard !queries.isEmpty else { return false }
            return NSWorkspace.shared.runningApplications.contains { appMatches($0, queries: queries) }
        case .windowTitle:
            guard !queries.isEmpty else { return false }
            let frontPID = NSWorkspace.shared.frontmostApplication?.processIdentifier
            let descriptions = windowDescriptions(frontmostPID: frontPID)
            return descriptions.contains { description in queries.contains { description.localizedCaseInsensitiveContains($0) } }
        case .recordingActive:
            // Refresh on demand so a context check is not waiting for the 1.2 s polling tick.
            let detected = heuristicScreenRecordingActive()
            if detected != lastRecordingState { lastRecordingState = detected }
            return detected == rule.boolValue
        case .displayCount:
            return NSScreen.screens.count == max(1, rule.numberValue)
        case .timeRange:
            let hour = Calendar.current.component(.hour, from: Date())
            if rule.startHour == rule.endHour { return true }
            return rule.startHour < rule.endHour
                ? (hour >= rule.startHour && hour < rule.endHour)
                : (hour >= rule.startHour || hour < rule.endHour)
        }
    }

    private func contextQueries(_ raw: String) -> [String] {
        raw.components(separatedBy: CharacterSet(charactersIn: ",;\n"))
            .map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }
            .filter { !$0.isEmpty }
    }

    private func appMatches(_ app: NSRunningApplication, queries: [String]) -> Bool {
        let values = [app.localizedName ?? "", app.bundleIdentifier ?? ""]
        return queries.contains { query in
            values.contains { value in value.localizedCaseInsensitiveContains(query) }
        }
    }

    private func windowDescriptions(frontmostPID: pid_t? = nil) -> [String] {
        guard let list = CGWindowListCopyWindowInfo([.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID) as? [[String: Any]] else { return [] }
        return list.compactMap { info in
            if let frontmostPID,
               let pid = info[kCGWindowOwnerPID as String] as? pid_t,
               pid != frontmostPID { return nil }
            let owner = info[kCGWindowOwnerName as String] as? String ?? ""
            let name = info[kCGWindowName as String] as? String ?? ""
            guard !owner.isEmpty || !name.isEmpty else { return nil }
            return "\(owner) \(name)"
        }
    }

    private func heuristicScreenRecordingActive() -> Bool {'''

          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'context matcher replacement count={count}')

          # App triggers should accept comma/semicolon/newline-separated app names and bundle IDs too.
          old = '''                let queries = trigger.applicationNames.map { $0.lowercased() }\n                if queries.isEmpty || queries.contains(where: { query in values.contains(where: { $0.contains(query) }) }) { fire(trigger: trigger, profile: profile) }'''
          new = '''                let queries = trigger.applicationNames\n                    .flatMap { contextQueries($0) }\n                if queries.isEmpty || queries.contains(where: { query in values.contains(where: { $0.localizedCaseInsensitiveContains(query) }) }) { fire(trigger: trigger, profile: profile) }'''
          if old in s2:
              s2 = s2.replace(old, new, 1)

          p.write_text(s2)
      - name: Commit context fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Services/CaptureService.swift
          git commit -m "Fix Teleprompter context matching"
          git push origin main
