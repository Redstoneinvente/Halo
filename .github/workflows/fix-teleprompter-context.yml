name: Fix Teleprompter Studio And Notch Suppression

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix Teleprompter Studio top bar and notch suppression'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Teleprompter Studio and notch behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          capture = Path('Halo/Services/CaptureService.swift')
          s = capture.read_text()

          old = '''        panel.orderFrontRegardless()\n        if profile.behavior.autoStart { runtime.begin() }'''
          new = '''        panel.orderFrontRegardless()\n        NotificationCenter.default.post(name: .init("HaloTeleprompterVisibilityChanged"), object: nil, userInfo: ["active": true])\n        if profile.behavior.autoStart { runtime.begin() }'''
          if old not in s:
              raise SystemExit('teleprompter show anchor missing')
          s = s.replace(old, new, 1)

          old = '''    func hidePrompt() { runtime?.pause(); runtime = nil; promptPanel?.orderOut(nil); promptPanel = nil }'''
          new = '''    func hidePrompt() {\n        let wasVisible = promptPanel?.isVisible == true\n        runtime?.pause()\n        runtime = nil\n        promptPanel?.orderOut(nil)\n        promptPanel = nil\n        if wasVisible {\n            NotificationCenter.default.post(name: .init("HaloTeleprompterVisibilityChanged"), object: nil, userInfo: ["active": false])\n        }\n    }'''
          if old not in s:
              raise SystemExit('teleprompter hide anchor missing')
          s = s.replace(old, new, 1)

          old = '''        NavigationSplitView {'''
          new = '''        NavigationSplitView {'''
          if old not in s:
              raise SystemExit('studio root anchor missing')

          old = '''        } detail: {\n            if let index = store.selectedIndex { TeleprompterProfileEditor(profile: $store.profiles[index]) }\n            else { VStack(spacing: 8) { Image(systemName: "text.bubble").font(.largeTitle); Text("Select a Teleprompter").font(.headline) }.foregroundStyle(.secondary) }\n        }\n    }'''
          new = '''        } detail: {\n            if let index = store.selectedIndex { TeleprompterProfileEditor(profile: $store.profiles[index]) }\n            else { VStack(spacing: 8) { Image(systemName: "text.bubble").font(.largeTitle); Text("Select a Teleprompter").font(.headline) }.foregroundStyle(.secondary) }\n        }\n        .safeAreaPadding(.top, 12)\n    }'''
          if old not in s:
              raise SystemExit('studio safe-area anchor missing')
          s = s.replace(old, new, 1)
          capture.write_text(s)

          surface = Path('Halo/Views/SurfaceView.swift')
          v = surface.read_text()

          old = '''    @ObservedObject private var bluetooth = BluetoothStateService.shared\n    @AppStorage("HaloOpenKeepClosedNotchContents") private var keepClosedContentsWhenOpen = false'''
          new = '''    @ObservedObject private var bluetooth = BluetoothStateService.shared\n    @State private var teleprompterActive = false\n    @AppStorage("HaloOpenKeepClosedNotchContents") private var keepClosedContentsWhenOpen = false'''
          if old not in v:
              raise SystemExit('surface state anchor missing')
          v = v.replace(old, new, 1)

          old = '''                    .onTapGesture {\n                        if state.expanded && state.pinned { return }\n                        state.expanded.toggle()\n                    }'''
          new = '''                    .onTapGesture {\n                        guard !teleprompterActive else { return }\n                        if state.expanded && state.pinned { return }\n                        state.expanded.toggle()\n                    }'''
          if old not in v:
              raise SystemExit('surface tap anchor missing')
          v = v.replace(old, new, 1)

          old = '''        .onReceive(Timer.publish(every: 30, on: .main, in: .common).autoconnect()) { _ in store.expireFiles() }\n        .onHover { state.hover($0, enabled: store.configuration.hoverToExpand) }'''
          new = '''        .onReceive(Timer.publish(every: 30, on: .main, in: .common).autoconnect()) { _ in store.expireFiles() }\n        .onReceive(NotificationCenter.default.publisher(for: .init("HaloTeleprompterVisibilityChanged"))) { note in\n            let active = (note.userInfo?["active"] as? Bool) ?? false\n            teleprompterActive = active\n            if active {\n                state.collapseTask?.cancel()\n                if !state.pinned { state.expanded = false }\n            }\n        }\n        .onHover { hovering in\n            if teleprompterActive {\n                state.collapseTask?.cancel()\n                if !state.pinned { state.expanded = false }\n            } else {\n                state.hover(hovering, enabled: store.configuration.hoverToExpand)\n            }\n        }'''
          if old not in v:
              raise SystemExit('surface hover anchor missing')
          v = v.replace(old, new, 1)

          old = '''        .onChange(of: state.expanded) { expanded in\n            workspace.setOpenedNotchVisible(expanded && activeContext == nil, token: openVisibilityToken)\n            if !expanded {'''
          new = '''        .onChange(of: state.expanded) { expanded in\n            if teleprompterActive && expanded && activeContext == nil {\n                state.expanded = false\n                workspace.setOpenedNotchVisible(false, token: openVisibilityToken)\n                return\n            }\n            workspace.setOpenedNotchVisible(expanded && activeContext == nil, token: openVisibilityToken)\n            if !expanded {'''
          if old not in v:
              raise SystemExit('surface expanded anchor missing')
          v = v.replace(old, new, 1)

          surface.write_text(v)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Services/CaptureService.swift Halo/Views/SurfaceView.swift
          git commit -m "Fix Teleprompter Studio layout and suppress normal notch"
          git push origin main
