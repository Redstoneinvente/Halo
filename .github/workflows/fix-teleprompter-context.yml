name: Add Teleprompter CI Enable And Priority

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add Teleprompter CI enable and priority'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch Teleprompter CI arbitration
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Teleprompter runtime: obey global CI enable and ownership arbitration.
          capture = Path('Halo/Services/CaptureService.swift')
          s = capture.read_text()

          old = '''    func install() {\n        guard !installed else { return }; installed = true'''
          new = '''    func install() {\n        guard !installed else { return }; installed = true'''
          if old not in s:
              raise SystemExit('install anchor missing')

          old = '''        for name in ["HaloScreenRecordingStateChanged", "HaloHUDScreenRecordingStateChanged"] {'''
          new = '''        observers.append(NotificationCenter.default.addObserver(forName: .init("HaloTeleprompterCIOwnershipChanged"), object: nil, queue: .main) { [weak self] note in\n            let owns = (note.userInfo?["owns"] as? Bool) ?? false\n            Task { @MainActor in\n                guard let self else { return }\n                if !owns, self.promptPanel?.isVisible == true { self.hidePrompt() }\n            }\n        })\n        for name in ["HaloScreenRecordingStateChanged", "HaloHUDScreenRecordingStateChanged"] {'''
          if old not in s:
              raise SystemExit('ownership observer anchor missing')
          s = s.replace(old, new, 1)

          old = '''    func show(profile: TeleprompterProfile) {\n        guard profile.enabled else { return }'''
          new = '''    func show(profile: TeleprompterProfile) {\n        guard UserDefaults.standard.object(forKey: "HaloContextTeleprompterEnabled") as? Bool ?? true else { return }\n        guard profile.enabled else { return }'''
          if old not in s:
              raise SystemExit('show guard anchor missing')
          s = s.replace(old, new, 1)

          capture.write_text(s)

          # Surface arbitration: Teleprompter becomes a normal CI candidate.
          surface = Path('Halo/Views/SurfaceView.swift')
          v = surface.read_text()

          old = '''private enum ActiveContextInterface: String {\n    case drop, music, bluetooth, retro\n}'''
          new = '''private enum ActiveContextInterface: String {\n    case drop, teleprompter, music, bluetooth, retro\n}'''
          if old not in v:
              raise SystemExit('active context enum anchor missing')
          v = v.replace(old, new, 1)

          old = '''    @State private var teleprompterActive = false\n    @AppStorage("HaloOpenKeepClosedNotchContents") private var keepClosedContentsWhenOpen = false'''
          new = '''    @State private var teleprompterActive = false\n    @AppStorage("HaloContextTeleprompterEnabled") private var teleprompterCIEnabled = true\n    @AppStorage("HaloContextTeleprompterPriority") private var teleprompterPriority = 70.0\n    @AppStorage("HaloOpenKeepClosedNotchContents") private var keepClosedContentsWhenOpen = false'''
          if old not in v:
              raise SystemExit('teleprompter appstorage anchor missing')
          v = v.replace(old, new, 1)

          old = '''        if retroCIEnabled && retroGameRequested {\n            candidates.append((.retro, retroPriority, 3))\n        }\n        if contextOptions.enabled && workspace.media.isPlaying {\n            candidates.append((.music, contextMusicPriority, 2))'''
          new = '''        if retroCIEnabled && retroGameRequested {\n            candidates.append((.retro, retroPriority, 4))\n        }\n        if teleprompterCIEnabled && teleprompterActive {\n            candidates.append((.teleprompter, teleprompterPriority, 3))\n        }\n        if contextOptions.enabled && workspace.media.isPlaying {\n            candidates.append((.music, contextMusicPriority, 2))'''
          if old not in v:
              raise SystemExit('candidate anchor missing')
          v = v.replace(old, new, 1)

          old = '''    private var retroContextActive: Bool { activeContext == .retro }'''
          new = '''    private var retroContextActive: Bool { activeContext == .retro }\n    private var teleprompterContextActive: Bool { activeContext == .teleprompter }'''
          if old not in v:
              raise SystemExit('teleprompter active helper anchor missing')
          v = v.replace(old, new, 1)

          old = '''        case .retro: return retroUsesFullNotchArea\n        case .none: return false'''
          new = '''        case .retro: return retroUsesFullNotchArea\n        case .teleprompter: return true\n        case .none: return false'''
          if old not in v:
              raise SystemExit('full surface switch anchor missing')
          v = v.replace(old, new, 1)

          old = '''        case .retro: return retroKeepsClosedContents\n        case .none:'''
          new = '''        case .retro: return retroKeepsClosedContents\n        case .teleprompter: return false\n        case .none:'''
          if old not in v:
              raise SystemExit('closed contents switch anchor missing')
          v = v.replace(old, new, 1)

          old = '''        .onReceive(NotificationCenter.default.publisher(for: .init("HaloTeleprompterVisibilityChanged"))) { note in\n            let active = (note.userInfo?["active"] as? Bool) ?? false\n            teleprompterActive = active\n            if active {\n                state.collapseTask?.cancel()\n                if !state.pinned { state.expanded = false }\n            }\n        }'''
          new = '''        .onReceive(NotificationCenter.default.publisher(for: .init("HaloTeleprompterVisibilityChanged"))) { note in\n            let active = (note.userInfo?["active"] as? Bool) ?? false\n            teleprompterActive = active\n            DispatchQueue.main.async {\n                let owns = teleprompterCIEnabled && teleprompterActive && activeContext == .teleprompter\n                NotificationCenter.default.post(name: .init("HaloTeleprompterCIOwnershipChanged"), object: nil, userInfo: ["owns": owns])\n                if owns {\n                    state.collapseTask?.cancel()\n                    if !state.pinned { state.expanded = false }\n                }\n            }\n        }'''
          if old not in v:
              raise SystemExit('visibility receiver anchor missing')
          v = v.replace(old, new, 1)

          old = '''        .onHover { hovering in\n            if teleprompterActive {'''
          new = '''        .onHover { hovering in\n            if teleprompterContextActive {'''
          if old not in v:
              raise SystemExit('hover arbitration anchor missing')
          v = v.replace(old, new, 1)

          old = '''            if teleprompterActive && expanded && activeContext == nil {'''
          new = '''            if teleprompterContextActive && expanded {'''
          if old not in v:
              raise SystemExit('expanded arbitration anchor missing')
          v = v.replace(old, new, 1)

          old = '''        .onChange(of: activeContext) { _ in\n            workspace.setOpenedNotchVisible(state.expanded && activeContext == nil, token: openVisibilityToken)\n        }'''
          new = '''        .onChange(of: activeContext) { _ in\n            let owns = teleprompterCIEnabled && teleprompterActive && activeContext == .teleprompter\n            NotificationCenter.default.post(name: .init("HaloTeleprompterCIOwnershipChanged"), object: nil, userInfo: ["owns": owns])\n            if owns {\n                state.collapseTask?.cancel()\n                if !state.pinned { state.expanded = false }\n            }\n            workspace.setOpenedNotchVisible(state.expanded && activeContext == nil, token: openVisibilityToken)\n        }'''
          if old not in v:
              raise SystemExit('activeContext onChange anchor missing')
          v = v.replace(old, new, 1)

          surface.write_text(v)

          # Settings: global toggle + priority slider and card status.
          settings = Path('Halo/Views/WorkspaceSettingsView.swift')
          w = settings.read_text()

          old = '''private struct TeleprompterContextInterfaceCard: View {\n    let action: () -> Void\n    @ObservedObject private var teleprompter = TeleprompterStore.shared'''
          new = '''private struct TeleprompterContextInterfaceCard: View {\n    let action: () -> Void\n    @AppStorage("HaloContextTeleprompterEnabled") private var ciEnabled = true\n    @AppStorage("HaloContextTeleprompterPriority") private var priority = 70.0\n    @ObservedObject private var teleprompter = TeleprompterStore.shared'''
          if old not in w:
              raise SystemExit('teleprompter card anchor missing')
          w = w.replace(old, new, 1)

          old = '''    private var enabled: Bool { teleprompter.profiles.contains(where: { $0.enabled }) }'''
          new = '''    private var enabled: Bool { ciEnabled && teleprompter.profiles.contains(where: { $0.enabled }) }'''
          if old not in w:
              raise SystemExit('teleprompter card enabled anchor missing')
          w = w.replace(old, new, 1)

          old = '''                    Text("\\(triggerCount) trigger\\(triggerCount == 1 ? "" : "s")")\n                        .font(.caption2).foregroundStyle(.secondary)'''
          new = '''                    Text("\\(triggerCount) trigger\\(triggerCount == 1 ? "" : "s")")\n                        .font(.caption2).foregroundStyle(.secondary)\n                    Text("Priority \\(Int(priority))")\n                        .font(.caption2).foregroundStyle(.secondary)'''
          if old not in w:
              raise SystemExit('teleprompter card priority anchor missing')
          w = w.replace(old, new, 1)

          old = '''private struct TeleprompterContextSettings: View {\n    @ObservedObject private var teleprompter = TeleprompterStore.shared\n\n    var body: some View {'''
          new = '''private struct TeleprompterContextSettings: View {\n    @ObservedObject private var teleprompter = TeleprompterStore.shared\n    @AppStorage("HaloContextTeleprompterEnabled") private var ciEnabled = true\n    @AppStorage("HaloContextTeleprompterPriority") private var priority = 70.0\n\n    var body: some View {'''
          if old not in w:
              raise SystemExit('teleprompter settings anchor missing')
          w = w.replace(old, new, 1)

          old = '''        Section("Teleprompter Context Interface") {\n            HStack(spacing: 12) {'''
          new = '''        Section("Teleprompter Context Interface") {\n            Toggle("Enable Teleprompter CI", isOn: $ciEnabled)\n                .onChange(of: ciEnabled) { enabled in\n                    if !enabled { TeleprompterCoordinator.shared.hidePrompt() }\n                }\n            Text("Disabling Teleprompter CI keeps your scripts, profiles, triggers and contexts saved, but prevents the CI from opening.")\n                .font(.caption).foregroundStyle(.secondary)\n            HStack(spacing: 12) {'''
          if old not in w:
              raise SystemExit('teleprompter global toggle anchor missing')
          w = w.replace(old, new, 1)

          old = '''        Section("Profiles") {'''
          new = '''        Section("CI priority") {\n            Slider(value: $priority, in: 0...100, step: 1) { Text("Teleprompter CI priority") }\n            Text("When multiple Context Interfaces are eligible, Halo gives notch ownership to the enabled CI with the highest priority. Teleprompter defaults to 70, between Retro and Music.")\n                .font(.caption).foregroundStyle(.secondary)\n        }\n\n        Section("Profiles") {'''
          if old not in w:
              raise SystemExit('teleprompter priority section anchor missing')
          w = w.replace(old, new, 1)

          settings.write_text(w)
          PY
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Services/CaptureService.swift Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m "Add Teleprompter CI enable toggle and priority arbitration"
          git push origin main
