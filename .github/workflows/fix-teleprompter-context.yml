name: Fix Teleprompter Context Matching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Repair screen recording context trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Repair screen recording detection
        shell: python
        run: |
          from pathlib import Path

          p = Path('Halo/Services/CaptureService.swift')
          s = p.read_text()

          old = '''        case .recordingActive:\n            return heuristicScreenRecordingActive() == rule.boolValue'''
          new = '''        case .recordingActive:\n            return lastRecordingState == rule.boolValue'''
          if old not in s:
              raise SystemExit('recording context anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private func heuristicScreenRecordingActive() -> Bool {\n        let windows = windowDescriptions().map { $0.lowercased() }\n        let recorders = ["obs", "screenflow", "camtasia", "loom"]\n        let running = NSWorkspace.shared.runningApplications.compactMap(\\.localizedName).map { $0.lowercased() }\n        let recorderRunning = running.contains { name in recorders.contains(where: name.contains) }\n        let recordingWindow = windows.contains { description in\n            recorders.contains(where: description.contains) && (description.contains("record") || description.contains("studio"))\n        }\n        return recorderRunning && recordingWindow\n    }'''
          new = '''    private func heuristicScreenRecordingActive() -> Bool {\n        let windows = windowDescriptions().map { $0.lowercased() }\n        let apps = NSWorkspace.shared.runningApplications\n        let appNames = apps.compactMap(\\.localizedName).map { $0.lowercased() }\n        let bundleIDs = apps.compactMap(\\.bundleIdentifier).map { $0.lowercased() }\n\n        // Native macOS screen recording uses Screenshot / screencaptureui while a capture is active.\n        let nativeRecorderActive = appNames.contains { name in\n            name.contains("screenshot") || name.contains("screencaptureui")\n        } || bundleIDs.contains { id in\n            id.contains("screencaptureui") || id.contains("screenshot")\n        }\n\n        let recorders = ["obs", "screenflow", "camtasia", "loom", "quicktime"]\n        let recorderRunning = appNames.contains { name in recorders.contains(where: name.contains) }\n        let explicitRecordingWindow = windows.contains { description in\n            recorders.contains(where: description.contains) &&\n            (description.contains("recording") || description.contains("record") || description.contains("rec ") || description.contains("live"))\n        }\n\n        return nativeRecorderActive || (recorderRunning && explicitRecordingWindow)\n    }'''
          if old not in s:
              raise SystemExit('heuristic anchor not found')
          s = s.replace(old, new, 1)

          old = '''    private func recordingStateChanged(_ active: Bool) {\n        let changed = active != lastRecordingState\n        lastRecordingState = active\n        evaluateContextAutomation()'''
          new = '''    private func recordingStateChanged(_ active: Bool) {\n        let changed = active != lastRecordingState\n        lastRecordingState = active\n        evaluateContextAutomation()'''
          if old not in s:
              raise SystemExit('recording state anchor not found')

          p.write_text(s)
      - name: Commit screen recording fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/Services/CaptureService.swift
          git commit -m "Fix screen recording context trigger"
          git push origin main
