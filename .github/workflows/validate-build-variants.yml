name: Validate Halo Build Variants

on:
  push:
    branches:
      - main
      - app-store-testing
      - app-store-sandbox-testing
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halo-build-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  halo-core-tests:
    name: Halo Core Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  halo-direct:
    name: Halo Direct
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo Direct
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  halo-app-store:
    name: Halo App Store
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo App Store
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo App Store" \
            -configuration "Debug App Store" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  apply-lock-screen-settings:
    name: Apply Lock Screen Settings
    if: github.event_name == 'pull_request' && github.head_ref == 'lock-screen-settings-apply'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch settings source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Halo/Views/WorkspaceSettingsView.swift')
          s = p.read_text()

          if 'private struct LockScreenSettingsPane: View' in s:
              print('Lock Screen settings already applied')
              raise SystemExit(0)

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '        coreItems.append("Privacy")\n',
              '        coreItems.append("Privacy")\n        coreItems.append("Lock Screen")\n',
              'Core sidebar insertion'
          )

          replace_once(
              '                             : (section == "Visual Workspace Editor" ? "Design the active Visual Workspace" : "Changes are saved automatically"))\n',
              '                             : (section == "Lock Screen" ? "How Halo behaves when your Mac is locked" : (section == "Visual Workspace Editor" ? "Design the active Visual Workspace" : "Changes are saved automatically")))\n',
              'Lock Screen header subtitle'
          )

          replace_once(
              '        case "Privacy": return "hand.raised"\n',
              '        case "Privacy": return "hand.raised"\n        case "Lock Screen": return "lock.fill"\n',
              'Lock Screen icon'
          )

          replace_once(
              '        case "Reviews":\n            HaloReviewCenterView()\n',
              '        case "Lock Screen":\n            LockScreenSettingsPane()\n        case "Reviews":\n            HaloReviewCenterView()\n',
              'Lock Screen content route'
          )

          pane_lines = [
              '',
              '',
              '@MainActor',
              'private struct LockScreenSettingsPane: View {',
              '    var body: some View {',
              '        Group {',
              '            Section("Lock Screen behavior") {',
              '                HStack(alignment: .top, spacing: 12) {',
              '                    Image(systemName: "lock.fill")',
              '                        .font(.title2)',
              '                        .foregroundStyle(Color.accentColor)',
              '                        .frame(width: 28)',
              '',
              '                    VStack(alignment: .leading, spacing: 5) {',
              '                        Text("Not shown while your Mac is locked")',
              '                            .font(.headline)',
              '                        Text("Halo follows the macOS secure session boundary. When the Lock Screen is active, Halo stays out of the secure interface and is not interactive there.")',
              '                            .font(.caption)',
              '                            .foregroundStyle(.secondary)',
              '                            .fixedSize(horizontal: false, vertical: true)',
              '                    }',
              '                }',
              '            }',
              '',
              '            Section("After you unlock") {',
              '                Label("Halo resumes with your desktop session", systemImage: "lock.open.fill")',
              '                    .font(.headline)',
              '',
              '                Text("Your Halo profile and settings stay intact while the Mac is locked. After you unlock and return to the desktop, Halo continues normally with the same configuration.")',
              '                    .font(.caption)',
              '                    .foregroundStyle(.secondary)',
              '                    .fixedSize(horizontal: false, vertical: true)',
              '            }',
              '',
              '            Section("Secure by design") {',
              '                Label("Uses standard macOS app behavior", systemImage: "checkmark.shield.fill")',
              '                    .font(.headline)',
              '',
              '                Text("Halo does not replace the macOS Lock Screen, inject into the login process, or use private APIs to force its surface above the secure interface.")',
              '                    .font(.caption)',
              '                    .foregroundStyle(.secondary)',
              '                    .fixedSize(horizontal: false, vertical: true)',
              '',
              '                Text("Lock Screen presentation is controlled by macOS, so Halo does not offer a switch to draw the notch surface over it.")',
              '                    .font(.caption)',
              '                    .foregroundStyle(.secondary)',
              '                    .fixedSize(horizontal: false, vertical: true)',
              '            }',
              '        }',
              '    }',
              '}',
              ''
          ]
          s += '\n'.join(pane_lines)
          p.write_text(s)
          PY

      - name: Parse updated settings source
        run: xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift

      - name: Commit patch to feature branch
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'Add Lock Screen settings guidance'
          git push origin "HEAD:${{ github.head_ref }}"
