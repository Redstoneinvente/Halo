name: Validate Halo Build Variants

on:
  push:
    branches:
      - main
      - app-store-testing
      - app-store-sandbox-testing
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: halo-build-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  halo-core-tests:
    name: Halo Core Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  halo-direct:
    name: Halo Direct
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo Direct
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  halo-app-store:
    name: Halo App Store
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo App Store
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo App Store" \
            -configuration "Debug App Store" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  lock-screen-presence-patch:
    name: Lock Screen Presence Patch
    if: github.event_name == 'pull_request' && github.head_ref == 'lock-screen-presence'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Correct patch route anchor
        run: python3 .github/fix-presence-patch-anchor.py
      - name: Apply source patch
        run: python3 .github/lock-screen-presence-patch.py
      - name: Validate patch
        run: git diff --check
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/NotchEngine/WindowManager.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m "Add contextual Lock Screen Presence"
          git push origin HEAD:${{ github.head_ref }}
