name: Validate Halo Build Variants

on:
  push:
    branches:
      - app-store-testing
  workflow_dispatch:

concurrency:
  group: halo-build-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  halo-direct:
    name: Halo Direct
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test distribution capability layer
        run: |
          cat > /tmp/main.swift <<'SWIFT'
          precondition(HaloDistribution.current == .direct)
          precondition(HaloDistribution.direct.supportsSparkle)
          precondition(HaloDistribution.direct.supportsExternalLicensing)
          precondition(HaloDistribution.direct.supportsUnrestrictedFileAccess)
          precondition(HaloDistribution.direct.supportsPartnerIntegrations)
          precondition(!HaloDistribution.appStore.supportsSparkle)
          precondition(!HaloDistribution.appStore.supportsExternalLicensing)
          precondition(!HaloDistribution.appStore.supportsUnrestrictedFileAccess)
          precondition(!HaloDistribution.appStore.supportsPartnerIntegrations)
          SWIFT
          swiftc -D HALO_DIRECT Halo/Core/HaloDistribution.swift /tmp/main.swift -o /tmp/halo-distribution-direct
          /tmp/halo-distribution-direct

          cat > /tmp/main.swift <<'SWIFT'
          precondition(HaloDistribution.current == .appStore)
          precondition(!HaloDistribution.current.supportsSparkle)
          precondition(!HaloDistribution.current.supportsExternalLicensing)
          precondition(!HaloDistribution.current.supportsUnrestrictedFileAccess)
          precondition(!HaloDistribution.current.supportsPartnerIntegrations)
          SWIFT
          swiftc -D HALO_APPSTORE Halo/Core/HaloDistribution.swift /tmp/main.swift -o /tmp/halo-distribution-appstore
          /tmp/halo-distribution-appstore

      - name: Build Halo Direct
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  halo-app-store:
    name: Halo App Store
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo App Store
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo App Store" \
            -configuration "Debug App Store" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
