name: Validate Halo Build Variants

on:
  push:
    branches:
      - main
      - app-store-testing
      - app-store-sandbox-testing
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: halo-build-variants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  halo-core-tests:
    name: Halo Core Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run core regression tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            test

  halo-direct:
    name: Halo Direct
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo Direct
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo Direct" \
            -configuration "Debug Direct" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  halo-app-store:
    name: Halo App Store
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Halo App Store
        run: |
          set -o pipefail
          xcodebuild \
            -project Halo.xcodeproj \
            -scheme "Halo App Store" \
            -configuration "Debug App Store" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  lock-screen-customization:
    name: Lock Screen Customization Patch
    if: github.event_name == 'pull_request' && github.head_ref == 'lock-screen-customization'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Extract and apply patch
        shell: bash
        run: |
          sed -n "/^          python3 - <<'PY'$/,/^          PY$/p" .github/workflows/apply-lock-screen-customization.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply_lock_screen.py
          python3 /tmp/apply_lock_screen.py
      - name: Validate Swift syntax
        run: |
          xcrun swiftc -parse Halo/NotchEngine/WindowManager.swift
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift
          git diff --check
      - name: Commit patch to feature branch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Halo/NotchEngine/WindowManager.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m "Add customizable Lock Screen transitions"
          git push origin HEAD:${{ github.head_ref }}
