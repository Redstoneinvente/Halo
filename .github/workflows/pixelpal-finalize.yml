name: Finalize Pixel Pal Customization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pixelpal-finalize.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Maximize default face fill
        run: |
          python3 -c "from pathlib import Path; p=Path('Halo/Views/PixelPetWidget.swift'); s=p.read_text(); s=s.replace('var faceScale = 0.96', 'var faceScale = 1.0').replace('faceScale = try c.decodeIfPresent(Double.self, forKey: .faceScale) ?? 0.96', 'faceScale = try c.decodeIfPresent(Double.self, forKey: .faceScale) ?? 1.0'); p.write_text(s)"

      - name: Parse Pixel Pal
        run: xcrun swiftc -parse Halo/Views/PixelPetWidget.swift

      - name: Build Halo
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Commit verified result
        run: |
          rm -f .github/workflows/pixelpal-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize Pixel Pal customization'
          git push origin HEAD:main
