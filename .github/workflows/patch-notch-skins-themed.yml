name: Patch Themed Notch Skins

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run Notch Skins themed patch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply themed Notch Skins patch
        run: python3 .github/scripts/patch-notch-skins-themed.py

      - name: Verify feature contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m = Path('Halo/Core/WorkspaceModels.swift').read_text()
          s = Path('Halo/Views/SurfaceView.swift').read_text()
          u = Path('Halo/Views/WorkspaceSettingsView.swift').read_text()
          pane = u[u.index('@MainActor private struct NotchSkinSettingsPane'):u.index('@MainActor private struct AppearanceSettingsPane')]
          assert 'case custom = "Custom Image"' not in m
          assert 'enum NotchSkinImageMode:' not in m
          assert 'raw == "Custom Image"' in m
          assert 'Choose Image' not in pane and 'chooseCustomSkin' not in pane
          assert 'assetPath' not in pane and 'imageMode' not in pane
          for name in ['Aurora', 'Synthwave Sunset', 'Sakura Night', 'Ocean Current', 'Ember Core', 'Blueprint', 'Matrix Rain', 'Nebula']:
              assert name in m or name in u
          assert 'surfaceBackgroundLayer\n                NotchSkinLayer(options:' in s
          assert 'Filled ribbons stay visible' in s
          assert 'let thickness = max(CGFloat(1.5)' in s
          print('feature contract OK')
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Core/WorkspaceModels.swift
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/WorkspaceSettingsView.swift

      - name: Build regression check
        run: xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build

      - name: Commit feature and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch-notch-skins-themed.py .github/workflows/patch-notch-skins-themed.yml .github/notch-skins-themed-trigger.txt
          git add Halo/Core/WorkspaceModels.swift Halo/Views/SurfaceView.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m "Improve themed notch skins"
          git pull --rebase origin main
          git push origin HEAD:main
