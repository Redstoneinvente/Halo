name: Add Sparkle and What's New

on:
  push:
    branches: [chatgpt/sparkle-whats-new]

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate
        shell: bash
        run: |
          set -euo pipefail
          cp .github/fix_sparkle_startup_abort.py /tmp/fix_sparkle_startup_abort.py
          git fetch origin main
          git checkout --detach origin/main
          python3 /tmp/fix_sparkle_startup_abort.py
          grep -q 'private var controller: SPUStandardUpdaterController?' Halo/Services/UpdateManager.swift
          ! grep -q 'private let controller: SPUStandardUpdaterController' Halo/Services/UpdateManager.swift
          grep -q 'CFBundleShortVersionString' Halo/Info.plist
          grep -q 'CFBundleVersion' Halo/Info.plist
          test "$(grep -c 'CURRENT_PROJECT_VERSION = 200;' Halo.xcodeproj/project.pbxproj)" -ge 2
          git diff --check
          plutil -lint Halo/Info.plist
          xcrun swiftc -parse Halo/Services/UpdateManager.swift
          xcodebuild -resolvePackageDependencies -project Halo.xcodeproj -scheme Halo
          set +e
          xcodebuild -project Halo.xcodeproj -target Halo -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > /tmp/sparkle-build.log 2>&1
          BUILD_STATUS=$?
          set -e
          grep -E 'UpdateManager.swift:.*(error:|warning:)' /tmp/sparkle-build.log || true
          if grep -Eq 'UpdateManager.swift:.*error:' /tmp/sparkle-build.log; then
            tail -n 180 /tmp/sparkle-build.log
            exit 1
          fi
          if [ -f build/Debug/Halo.app/Contents/Info.plist ]; then
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Debug/Halo.app/Contents/Info.plist)" = "0.2.0"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Debug/Halo.app/Contents/Info.plist)" = "200"
          fi
          echo "Build status: $BUILD_STATUS"
          git config user.name 'Doshagyasing Gowardun'
          git config user.email '45894815+Redstoneinvente@users.noreply.github.com'
          git add Halo/Services/UpdateManager.swift Halo/Info.plist Halo.xcodeproj/project.pbxproj
          git commit -m "Harden Sparkle startup configuration"
          git push origin HEAD:main
