name: Apply launcher application picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-launcher-application-picker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch launcher application picker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          widget_path = Path('Halo/Views/WidgetSettingsView.swift')
          widget_text = widget_path.read_text()

          old_ui = '''                TextField("Favorite app bundle IDs", text: adaptiveFavoriteBundles(adaptive))
                Text("Comma-separated bundle IDs. Halo opens installed apps directly; it does not pretend to provide Spotlight indexing.").font(.caption2).foregroundStyle(.secondary)'''
          new_ui = '''                LauncherFavoriteApplicationsPicker(bundleIDs: adaptive.launcherFavoriteBundleIDs)
                Text("Choose installed apps to pin in Launcher. Halo keeps their bundle identifiers internally so existing profiles remain compatible.").font(.caption2).foregroundStyle(.secondary)'''
          if old_ui not in widget_text:
              raise SystemExit('Expected Launcher bundle-ID field was not found')
          widget_text = widget_text.replace(old_ui, new_ui, 1)

          old_helper = '''    private func adaptiveFavoriteBundles(_ adaptive: Binding<VisualAdaptiveWidgetOptions>) -> Binding<String> {
              Binding(get: { adaptive.wrappedValue.launcherFavoriteBundleIDs.joined(separator: ", ") }, set: { text in
                  adaptive.wrappedValue.launcherFavoriteBundleIDs = text.split(separator: ",").map { $0.trimmingCharacters(in: .whitespacesAndNewlines) }.filter { !$0.isEmpty }
              })
          }

          '''
          if old_helper not in widget_text:
              raise SystemExit('Expected adaptiveFavoriteBundles helper was not found')
          widget_text = widget_text.replace(old_helper, '', 1)
          widget_path.write_text(widget_text)

          workspace_path = Path('Halo/Views/WorkspaceSettingsView.swift')
          workspace_text = workspace_path.read_text()
          marker = '// MARK: - Launcher favorite application picker'
          if marker in workspace_text:
              raise SystemExit('Launcher application picker already exists')

          helper = r'''

// MARK: - Launcher favorite application picker

struct LauncherFavoriteApplicationsPicker: View {
    @Binding var bundleIDs: [String]
    @State private var showingPicker = false

    var body: some View {
        VStack(alignment: .leading, spacing: 8) {
            LabeledContent("Favorite apps") {
                HStack(spacing: 10) {
                    Text(bundleIDs.isEmpty ? "None" : "\(bundleIDs.count) selected")
                        .foregroundStyle(.secondary)
                        .monospacedDigit()
                    Button("Choose Apps…") {
                        showingPicker = true
                    }
                }
            }

            if !bundleIDs.isEmpty {
                ScrollView(.horizontal, showsIndicators: false) {
                    HStack(spacing: 7) {
                        ForEach(Array(bundleIDs.enumerated()), id: \.offset) { _, bundleID in
                            LauncherFavoriteApplicationChip(bundleID: bundleID)
                        }
                    }
                    .padding(.vertical, 1)
                }
            }
        }
        .sheet(isPresented: $showingPicker) {
            LauncherFavoriteApplicationsSheet(bundleIDs: $bundleIDs)
        }
    }
}

private struct LauncherFavoriteApplicationChip: View {
    let bundleID: String

    private var applicationURL: URL? {
        NSWorkspace.shared.urlForApplication(withBundleIdentifier: bundleID)
    }

    private var displayName: String {
        guard let applicationURL else { return bundleID }
        return FileManager.default.displayName(atPath: applicationURL.path)
    }

    var body: some View {
        HStack(spacing: 6) {
            if let applicationURL {
                Image(nsImage: NSWorkspace.shared.icon(forFile: applicationURL.path))
                    .resizable()
                    .scaledToFit()
                    .frame(width: 20, height: 20)
            } else {
                Image(systemName: "app.dashed")
                    .frame(width: 20, height: 20)
                    .foregroundStyle(.secondary)
            }

            Text(displayName)
                .font(.caption.weight(.medium))
                .lineLimit(1)
        }
        .padding(.horizontal, 8)
        .padding(.vertical, 5)
        .background(.quaternary, in: Capsule())
        .help(bundleID)
    }
}

private struct LauncherFavoriteApplicationsSheet: View {
    @Environment(\.dismiss) private var dismiss
    @Binding var bundleIDs: [String]

    @State private var applications: [HaloInstalledApplication] = []
    @State private var searchText = ""
    @State private var isLoading = true

    private var selectedIDs: Set<String> {
        Set(bundleIDs)
    }

    private var filteredApplications: [HaloInstalledApplication] {
        let query = searchText.trimmingCharacters(in: .whitespacesAndNewlines)
        guard !query.isEmpty else { return applications }
        return applications.filter {
            $0.name.localizedCaseInsensitiveContains(query) ||
            $0.bundleIdentifier.localizedCaseInsensitiveContains(query)
        }
    }

    private var unavailableSelectedIDs: [String] {
        let installedIDs = Set(applications.map(\.bundleIdentifier))
        let query = searchText.trimmingCharacters(in: .whitespacesAndNewlines)
        return bundleIDs.filter { bundleID in
            !installedIDs.contains(bundleID) &&
            (query.isEmpty || bundleID.localizedCaseInsensitiveContains(query))
        }
    }

    var body: some View {
        VStack(spacing: 0) {
            HStack(alignment: .center, spacing: 12) {
                VStack(alignment: .leading, spacing: 4) {
                    Text("Favorite Applications")
                        .font(.title2.bold())
                    Text("Choose the installed apps you want pinned in Halo's Launcher.")
                        .font(.callout)
                        .foregroundStyle(.secondary)
                }
                Spacer()
                Button("Done") { dismiss() }
                    .keyboardShortcut(.defaultAction)
            }
            .padding(20)

            TextField("Search apps", text: $searchText)
                .textFieldStyle(.roundedBorder)
                .padding(.horizontal, 20)
                .padding(.bottom, 14)

            Divider()

            if isLoading {
                VStack(spacing: 12) {
                    ProgressView()
                    Text("Finding installed apps…")
                        .foregroundStyle(.secondary)
                }
                .frame(maxWidth: .infinity, maxHeight: .infinity)
            } else if filteredApplications.isEmpty && unavailableSelectedIDs.isEmpty {
                VStack(spacing: 10) {
                    Image(systemName: "magnifyingglass")
                        .font(.system(size: 30))
                        .foregroundStyle(.secondary)
                    Text("No apps found")
                        .font(.headline)
                    Text("Try a different app name.")
                        .font(.callout)
                        .foregroundStyle(.secondary)
                }
                .frame(maxWidth: .infinity, maxHeight: .infinity)
            } else {
                ScrollView {
                    LazyVStack(spacing: 2) {
                        ForEach(filteredApplications) { application in
                            applicationRow(application)
                        }

                        if !unavailableSelectedIDs.isEmpty {
                            HStack {
                                Text("Previously selected")
                                    .font(.caption.weight(.semibold))
                                    .foregroundStyle(.secondary)
                                Spacer()
                            }
                            .padding(.horizontal, 16)
                            .padding(.top, 12)
                            .padding(.bottom, 4)

                            ForEach(unavailableSelectedIDs, id: \.self) { bundleID in
                                unavailableRow(bundleID)
                            }
                        }
                    }
                    .padding(8)
                }
            }

            Divider()

            HStack {
                Button("Clear Selection", role: .destructive) {
                    bundleIDs.removeAll()
                }
                .disabled(bundleIDs.isEmpty)

                Spacer()

                Text("\(bundleIDs.count) of 20 selected")
                    .font(.callout)
                    .foregroundStyle(.secondary)
                    .monospacedDigit()
            }
            .padding(16)
        }
        .frame(width: 640, height: 560)
        .task {
            await loadApplications()
        }
    }

    @ViewBuilder
    private func applicationRow(_ application: HaloInstalledApplication) -> some View {
        let selected = selectedIDs.contains(application.bundleIdentifier)
        let selectionFull = bundleIDs.count >= 20 && !selected

        Button {
            toggle(application.bundleIdentifier)
        } label: {
            HStack(spacing: 12) {
                Image(nsImage: NSWorkspace.shared.icon(forFile: application.url.path))
                    .resizable()
                    .scaledToFit()
                    .frame(width: 32, height: 32)

                VStack(alignment: .leading, spacing: 2) {
                    Text(application.name)
                        .font(.body.weight(.medium))
                        .foregroundStyle(.primary)
                    Text(application.bundleIdentifier)
                        .font(.caption)
                        .foregroundStyle(.secondary)
                        .textSelection(.enabled)
                }

                Spacer()

                Image(systemName: selected ? "checkmark.circle.fill" : "circle")
                    .font(.title3)
                    .foregroundStyle(selected ? Color.accentColor : Color.secondary)
            }
            .padding(.horizontal, 10)
            .padding(.vertical, 7)
            .contentShape(Rectangle())
            .background(
                selected ? Color.accentColor.opacity(0.08) : Color.clear,
                in: RoundedRectangle(cornerRadius: 9)
            )
            .opacity(selectionFull ? 0.45 : 1)
        }
        .buttonStyle(.plain)
        .disabled(selectionFull)
    }

    @ViewBuilder
    private func unavailableRow(_ bundleID: String) -> some View {
        Button {
            toggle(bundleID)
        } label: {
            HStack(spacing: 12) {
                Image(systemName: "app.dashed")
                    .font(.title2)
                    .frame(width: 32, height: 32)
                    .foregroundStyle(.secondary)

                VStack(alignment: .leading, spacing: 2) {
                    Text(bundleID)
                        .font(.body.weight(.medium))
                        .foregroundStyle(.primary)
                    Text("Not currently installed")
                        .font(.caption)
                        .foregroundStyle(.secondary)
                }

                Spacer()

                Image(systemName: "checkmark.circle.fill")
                    .font(.title3)
                    .foregroundStyle(Color.accentColor)
            }
            .padding(.horizontal, 10)
            .padding(.vertical, 7)
            .contentShape(Rectangle())
        }
        .buttonStyle(.plain)
    }

    private func toggle(_ bundleID: String) {
        if let index = bundleIDs.firstIndex(of: bundleID) {
            bundleIDs.remove(at: index)
        } else if bundleIDs.count < 20 {
            bundleIDs.append(bundleID)
        }
        NSHapticFeedbackManager.defaultPerformer.perform(.alignment, performanceTime: .now)
    }

    private func loadApplications() async {
        guard applications.isEmpty else {
            isLoading = false
            return
        }
        isLoading = true
        let discovered = await Task.detached(priority: .utility) {
            HaloInstalledApplicationCatalog.discover()
        }.value
        applications = discovered
        isLoading = false
    }
}
'''

          workspace_path.write_text(workspace_text + helper)
          PY

      - name: Verify launcher picker source contract
        shell: bash
        run: |
          grep -q 'LauncherFavoriteApplicationsPicker(bundleIDs: adaptive.launcherFavoriteBundleIDs)' Halo/Views/WidgetSettingsView.swift
          grep -q 'struct LauncherFavoriteApplicationsPicker: View' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloInstalledApplicationCatalog.discover()' Halo/Views/WorkspaceSettingsView.swift
          if grep -q 'TextField("Favorite app bundle IDs"' Halo/Views/WidgetSettingsView.swift; then exit 1; fi
          if grep -q 'adaptiveFavoriteBundles' Halo/Views/WidgetSettingsView.swift; then exit 1; fi

      - name: Build Halo
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -derivedDataPath /tmp/HaloDerivedData CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-launcher-picker-build.log

      - name: Commit source change and clean temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-launcher-application-picker.yml
          git add Halo/Views/WidgetSettingsView.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'Replace launcher bundle IDs with app picker'
          git push origin HEAD:main
