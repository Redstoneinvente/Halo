name: Apply launcher application picker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-launcher-application-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch launcher application picker
        run: python3 .github/temp/patch_launcher_application_picker.py

      - name: Verify launcher picker source contract
        shell: bash
        run: |
          grep -q 'LauncherFavoriteApplicationsPicker(bundleIDs: adaptive.launcherFavoriteBundleIDs)' Halo/Views/WidgetSettingsView.swift
          grep -q 'struct LauncherFavoriteApplicationsPicker: View' Halo/Views/WorkspaceSettingsView.swift
          grep -q 'HaloInstalledApplicationCatalog.discover()' Halo/Views/WorkspaceSettingsView.swift
          if grep -q 'TextField("Favorite app bundle IDs"' Halo/Views/WidgetSettingsView.swift; then exit 1; fi
          if grep -q 'adaptiveFavoriteBundles' Halo/Views/WidgetSettingsView.swift; then exit 1; fi

      - name: Build Halo
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -derivedDataPath /tmp/HaloDerivedData CODE_SIGNING_ALLOWED=NO build | tee /tmp/halo-launcher-picker-build.log

      - name: Commit source change and clean temporary helpers
        if: success()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-launcher-application-picker.yml .github/temp/patch_launcher_application_picker.py
          git add Halo/Views/WidgetSettingsView.swift Halo/Views/WorkspaceSettingsView.swift
          git commit -m 'Replace launcher bundle IDs with app picker'
          git push origin HEAD:main
