name: Fix Closed Visualizer Expanded Strip V2

on:
  push:
    branches: [main]
    paths:
      - '.github/closed-visualizer-expanded-strip-v2-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply parent-level visualizer retention fix
        run: python3 .github/scripts/fix_closed_visualizer_expanded_strip_v2.py

      - name: Verify visualizer strip contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('Halo/Views/SurfaceView.swift').read_text()
          c = Path('Halo/Views/ClosedNotchView.swift').read_text()
          required_surface = [
              'private var preservesMusicClosedVisualizer: Bool',
              'private var preservesClosedStripWhileExpanded: Bool',
              'visualizerOnly: true, expandVisualizerToAvailableWidth: true',
              'preserveClosedVisualizerStrip: preservesMusicClosedVisualizer',
              'keepsClosedNotchContents || preserveClosedVisualizerStrip',
          ]
          required_closed = [
              'var visualizerOnly = false',
              'var expandVisualizerToAvailableWidth = false',
              'if visualizerOnly {',
              'if expandVisualizerToAvailableWidth { v.width = max(1, innerWidth) }',
              '.frame(width: max(1, innerWidth), height: innerHeight)',
          ]
          missing = [x for x in required_surface if x not in s] + [x for x in required_closed if x not in c]
          if missing:
              raise SystemExit('missing contract markers: ' + repr(missing))
          if s.count('visualizerOnly: true, expandVisualizerToAvailableWidth: true') < 2:
              raise SystemExit('both non-full and full-surface Music CI branches must preserve the visualizer')
          if s.count('preserveClosedVisualizerStrip: preservesMusicClosedVisualizer') != 2:
              raise SystemExit('all ContextMusicView call sites must receive strip reservation state')
          print('Closed visualizer parent-level retention contract passed')
          PY

      - name: Parse changed Swift files
        run: |
          xcrun swiftc -parse Halo/Views/SurfaceView.swift
          xcrun swiftc -parse Halo/Views/ClosedNotchView.swift

      - name: Build regression check
        run: |
          set +e
          xcodebuild -project Halo.xcodeproj -scheme Halo -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build > /tmp/halo-closed-visualizer-v2.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            grep -E '(SurfaceView|ClosedNotchView)\.swift:.*error:' /tmp/halo-closed-visualizer-v2.log || true
            if grep -E '(SurfaceView|ClosedNotchView)\.swift:.*error:' /tmp/halo-closed-visualizer-v2.log; then
              exit 1
            fi
            echo 'Build failed only on unrelated baseline errors.'
          else
            echo 'Halo build passed.'
          fi

      - name: Commit visualizer retention fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Halo/Views/SurfaceView.swift Halo/Views/ClosedNotchView.swift
          git rm -f \
            .github/scripts/fix_closed_visualizer_expanded_strip.py \
            .github/workflows/fix-closed-visualizer-expanded-strip.yml \
            .github/closed-visualizer-expanded-strip-trigger.txt \
            .github/scripts/fix_closed_visualizer_expanded_strip_v2.py \
            .github/workflows/fix-closed-visualizer-expanded-strip-v2.yml \
            .github/closed-visualizer-expanded-strip-v2-trigger.txt
          git commit -m 'Keep closed notch visualizer above Audio CI'
          git pull --rebase origin main
          git push origin HEAD:main
